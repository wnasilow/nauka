<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Audiobooki</title>
<meta name="theme-color" content="#c4122f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#f3f4f2; --panel:#fff; --ink:#1b1f22; --muted:#5d666c; --line:#d9ddda;
  --accent:#c4122f; --accent-ink:#fff; --accent-soft:#fbe7ea; --ok:#1f7a3a;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141719; --panel:#1d2124; --ink:#e8eae8; --muted:#9aa3a8; --line:#30363a;
  --accent:#ff5468; --accent-ink:#1a0005; --accent-soft:#3a1a20; --ok:#5fd17f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141719; --panel:#1d2124; --ink:#e8eae8; --muted:#9aa3a8; --line:#30363a;
  --accent:#ff5468; --accent-ink:#1a0005; --accent-soft:#3a1a20; --ok:#5fd17f; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font-body);padding:env(safe-area-inset-top) 16px calc(32px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
.wrap{max-width:680px;margin:0 auto}
h1,h2{font-family:var(--font-display);font-weight:700;line-height:1.1;margin:0}
h1{font-size:2rem}
header{padding:20px 0 6px}
header a{color:var(--muted);font-size:.9rem;text-decoration:none}
.muted{color:var(--muted)} .small{font-size:.88rem}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:10px 0 14px}
.tools label{display:flex;gap:6px;align-items:center;cursor:pointer}
#sync{font-size:.85rem}
details{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary h2{font-size:1.3rem}
summary .cnt{color:var(--muted);font-size:.9rem;white-space:nowrap}
summary .cnt.done{color:var(--ok);font-weight:600}
.fl{display:block;padding:0 16px 8px;font-size:.88rem;color:var(--accent);text-decoration:none}
li a.fd{flex:none;font-size:1.1rem;text-decoration:none;color:var(--muted)}
ul{list-style:none;margin:0;padding:0 8px 8px}
li{display:flex;gap:10px;align-items:center;padding:8px;border-top:1px solid var(--line)}
li input{width:22px;height:22px;flex:none;accent-color:var(--accent);cursor:pointer}
li a{flex:1;color:var(--ink);text-decoration:none;min-width:0;overflow-wrap:anywhere}
li a:hover{color:var(--accent)}
li .sz{color:var(--muted);font-size:.8rem;white-space:nowrap}
li.w a{color:var(--muted)}
body.hide li.w{display:none}
body.hide details.alldone{display:none}
button.lnk{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.play{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:10px;text-decoration:none;font-weight:600;margin:0 16px 10px}
li.nx{background:var(--accent-soft);border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
<header><a href="../">← Nauka</a><h1>Audiobooki</h1></header>
<div class="tools">
  <label><input type="checkbox" id="hide"> ukryj przesłuchane</label>
  <span id="sync" class="muted"></span>
</div>
<p class="muted small">Rozdziałów nie da się otworzyć osobnymi linkami: przycisk otwiera odtwarzacz książki (po zalogowaniu), a rozdział wybierasz tam w „Wybierz rozdział”. Podświetlony jest następny do przesłuchania.</p>
<div id="lista"></div>
</div>
<script>
// Książki dopisuje się w KSIAZKI; czas rozdziału w formacie m:ss albo g:mm:ss.
const KSIAZKI = [
 {id: "finfort", tytul: "Finansowa Forteca", autor: "Marcin Iwuć",
  link: "https://marcin-iwuc.tresci.online/books/audiobook-finansowa-forteca-jak-inwestowac-skutecznie-i-miec-swiety-spokoj-dostep-tylko-online",
  rozdzialy: [
   ["Intro audiobooka", "2:00"],
   ["Wprowadzenie", "11:21"],
   ["Rozdział 1: Jak to właściwie działa?", "55:34"],
   ["Rozdział 2: Co musisz zrobić, nim zainwestujesz?", "15:30"],
   ["Rozdział 3: Strategia trzech portfeli", "2:11:50"],
   ["Rozdział 4: Dlaczego rynki są cykliczne?", "1:04:14"],
   ["Rozdział 5: Inwestowanie i psychologia", "1:15:45"],
   ["Rozdział 6: Jak duże ryzyko możesz zaakceptować?", "52:27"],
   ["Rozdział 7: Inwestowanie w akcje – kupujesz kawałki biznesów", "2:10:19"],
   ["Rozdział 8: Inwestowanie w obligacje – działasz jak mały bank", "1:56:49"],
   ["Rozdział 9: Mieszkania na wynajem", "1:56:22"],
   ["Rozdział 10: Złoto najpewniejsza waluta na świecie", "49:44"],
   ["Rozdział 11: Surowce", "33:57"],
   ["Rozdział 12: Gotówka i waluty obce", "5:49"],
   ["Rozdział 13: Kryptowaluty", "23:12"],
   ["Rozdział 14: Przedmioty kolekcjonerskie", "9:56"],
   ["Rozdział 15: Najważniejsza ze wszystkich klas aktywów", "16:51"],
   ["Rozdział 16: Produkty inwestycyjne – czyli w co opakować nasze aktywa?", "2:16:07"],
   ["Rozdział 17: Odpowiedzi na najczęściej zadawane pytania", "1:51:21"]
  ]}
];

// Stan: {"<ksiazka>/<nr>": {w: 1|0, t: ms}}; scalanie jak w /nauka/boks/: wygrywa nowszy znacznik czasu.
const API = "https://nieciecz.taile0bd49.ts.net:8443/sync/";
const SERWIS = "audiobooki", LS = "nauka_audiobooki_stan", LSK = "nauka_sync_klucz", LSH = "nauka_audiobooki_ukryj";
const ls = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const m = location.hash.match(/sync=([\w-]+)/);
if (m) { ls.set(LSK, m[1]); history.replaceState(null, "", location.pathname); }
const KLUCZ = ls.get(LSK);
let stan = {}; try { stan = JSON.parse(ls.get(LS) || "{}") || {}; } catch (e) {}
const $ = s => document.querySelector(s);

function scal(a, b) {
  const o = {...a};
  for (const [k, v] of Object.entries(b || {})) if (!o[k] || (v.t || 0) > (o[k].t || 0)) o[k] = v;
  return o;
}
const ob = id => !!(stan[id] && stan[id].w);
const sek = s => s.split(":").reduce((a, x) => a * 60 + +x, 0);
const czas = s => { const g = Math.floor(s / 3600), mi = Math.round(s % 3600 / 60); return g ? `${g} h ${mi} min` : `${mi} min`; };

function rysuj() {
  const otwarte = new Set([...document.querySelectorAll("details[open]")].map(d => d.dataset.f));
  const pierwszyRaz = !document.querySelector("details");
  const box = $("#lista"); box.innerHTML = "";
  for (const k of KSIAZKI) {
    const ids = k.rozdzialy.map((_, i) => k.id + "/" + (i + 1));
    const razem = k.rozdzialy.reduce((s, r) => s + sek(r[1]), 0);
    const zostalo = k.rozdzialy.reduce((s, r, i) => s + (ob(ids[i]) ? 0 : sek(r[1])), 0);
    const n = ids.filter(ob).length, nast = ids.findIndex(id => !ob(id));
    const d = document.createElement("details");
    d.dataset.f = k.id;
    if (n === ids.length) d.className = "alldone";
    d.innerHTML = `<summary><h2></h2><span class="cnt${n === ids.length ? " done" : ""}">${n}/${ids.length}</span></summary>
      <div class="small muted" style="padding:0 16px"></div><div class="bar" style="margin:8px 16px"><i></i></div>
      <a class="play" target="_blank" rel="noopener">▶ Otwórz odtwarzacz</a><ul></ul>`;
    d.querySelector("h2").textContent = k.tytul;
    d.querySelector("div.small").textContent = `${k.autor} · razem ${czas(razem)} · zostało ${czas(zostalo)}`;
    d.querySelector(".bar i").style.width = (100 * (razem - zostalo) / razem) + "%";
    d.querySelector(".play").href = k.link;
    const ul = d.querySelector("ul");
    k.rozdzialy.forEach((r, i) => {
      const li = document.createElement("li");
      if (ob(ids[i])) li.className = "w"; else if (i === nast) li.className = "nx";
      li.innerHTML = `<input type="checkbox" aria-label="przesłuchane"><a target="_blank" rel="noopener"></a><span class="sz"></span>`;
      const cb = li.querySelector("input"); cb.checked = ob(ids[i]); cb.onchange = () => ustaw(ids[i], cb.checked);
      const a = li.querySelector("a"); a.href = k.link; a.textContent = (i + 1) + ". " + r[0];
      li.querySelector(".sz").textContent = r[1];
      ul.appendChild(li);
    });
    box.appendChild(d);
    if (otwarte.has(k.id) || (pierwszyRaz && n < ids.length)) d.open = true;
  }
}

function ustaw(id, w) { stan[id] = {w: w ? 1 : 0, t: Date.now()}; ls.set(LS, JSON.stringify(stan)); rysuj(); wyslij(); }
function info(t) { $("#sync").textContent = t; }
const godz = () => "zsynchronizowano " + new Date().toLocaleTimeString("pl", {hour: "2-digit", minute: "2-digit"});
async function pobierz() {
  const r = await fetch(API + KLUCZ + "/" + SERWIS, {cache: "no-store"});
  if (!r.ok) throw new Error(r.status);
  return (await r.json()).v || {};
}
let trwa = false, znowu = false;
async function wyslij() {
  if (!KLUCZ) return;
  if (trwa) { znowu = true; return; }
  trwa = true;
  try {
    stan = scal(stan, await pobierz());
    const r = await fetch(API + KLUCZ + "/" + SERWIS, {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({v: stan})});
    if (!r.ok) throw new Error(r.status);
    ls.set(LS, JSON.stringify(stan)); info(godz());
  } catch (e) { info("offline, zapisano w tej przeglądarce"); }
  trwa = false;
  if (znowu) { znowu = false; wyslij(); }
}
async function synchronizuj() {
  if (!KLUCZ) { info("synchronizacja wyłączona (otwórz stronę z linkiem #sync=…)"); return; }
  try {
    const zdalny = await pobierz(), przed = JSON.stringify(stan);
    stan = scal(stan, zdalny); ls.set(LS, JSON.stringify(stan));
    if (JSON.stringify(stan) !== przed) rysuj();
    if (JSON.stringify(scal(zdalny, stan)) !== JSON.stringify(zdalny)) await wyslij(); else info(godz());
  } catch (e) { info("offline, zapisano w tej przeglądarce"); }
}

$("#hide").checked = ls.get(LSH) === "1";
document.body.classList.toggle("hide", $("#hide").checked);
$("#hide").onchange = e => { document.body.classList.toggle("hide", e.target.checked); ls.set(LSH, e.target.checked ? "1" : "0"); };
document.addEventListener("visibilitychange", () => { if (!document.hidden) synchronizuj(); });
rysuj();
synchronizuj();
</script>
</body>
</html>
