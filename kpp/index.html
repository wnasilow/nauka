<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>KPP – recertyfikacja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: karta ćwiczeń ratownika. Wąska kolumna, nagłówek z postępem, zakładki Plan / Lekcja / Błędy / Egzamin. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1b1f22; --muted:#5d666c; --line:#d9ddda;
  --accent:#c4122f; --accent-ink:#ffffff; --accent-soft:#fbe7ea;
  --ok:#1f7a4a; --ok-soft:#e3f2e9; --bad:#b3261e; --bad-soft:#fbe9e7; --warn:#8a5a00; --warn-soft:#fdf1d8;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141719; --panel:#1d2124; --ink:#e8eae8; --muted:#9aa3a8; --line:#30363a;
  --accent:#ff5468; --accent-ink:#1a0005; --accent-soft:#3a1a20;
  --ok:#5cc98d; --ok-soft:#173326; --bad:#ff7a6e; --bad-soft:#3a1c19; --warn:#f0b54a; --warn-soft:#352a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141719; --panel:#1d2124; --ink:#e8eae8; --muted:#9aa3a8; --line:#30363a;
  --accent:#ff5468; --accent-ink:#1a0005; --accent-soft:#3a1a20;
  --ok:#5cc98d; --ok-soft:#173326; --bad:#ff7a6e; --bad-soft:#3a1c19; --warn:#f0b54a; --warn-soft:#352a12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:2.3rem;letter-spacing:.01em}
h2{font-size:1.7rem}
h3{font-size:1.25rem;font-weight:600}
.eyebrow{font:600 .78rem/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
header.top{padding-block:28px 12px;display:grid;gap:14px}
.top-row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.cross{display:inline-grid;place-items:center;width:34px;height:34px;background:var(--accent);color:var(--accent-ink);border-radius:6px;font:700 1.5rem/1 var(--font-display);margin-right:10px;vertical-align:-4px}
.meter{display:grid;gap:6px;min-width:220px;flex:1;max-width:340px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:.92rem;align-items:center}
.meta input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-block:10px 22px;overflow-x:auto}
nav.tabs button{font:600 1.05rem var(--font-display);letter-spacing:.03em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .count{font:500 .8rem var(--font-mono);background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:1px 7px;margin-left:4px}
button{font:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 1rem var(--font-body);border-radius:8px;padding:9px 16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,nav.tabs button:focus-visible,.opt:focus-visible,.lesson-card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.today{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:10px;padding:18px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:26px}
.today>div{min-width:0}
.week{margin-bottom:26px}
.week-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lesson-card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 12px 14px;cursor:pointer;display:grid;gap:6px;align-content:start;color:var(--ink)}
.lesson-card .no{font:700 1.6rem/1 var(--font-display);color:var(--muted)}
.lesson-card .t{font-weight:600;line-height:1.25;font-size:.95rem}
.lesson-card .d{font-size:.82rem;color:var(--muted)}
.lesson-card.done{background:var(--ok-soft);border-color:transparent}
.lesson-card.done .no{color:var(--ok)}
.lesson-card.next{border:2px solid var(--accent)}
.lesson-card.next .no{color:var(--accent)}
.pill{display:inline-block;font:600 .74rem/1 var(--font-body);letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:var(--line);color:var(--ink);justify-self:start}
.pill.ok{background:var(--ok);color:var(--panel)}
.pill.rev{background:var(--warn-soft);color:var(--warn)}
section.lesson{display:grid;gap:26px}
.lhead{display:grid;gap:8px}
.goal{font-size:1.1rem;max-width:65ch}
.block{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:grid;gap:12px;min-width:0}
.block ol,.block ul{margin:0;padding-left:1.3em;display:grid;gap:8px;max-width:68ch}
.videos{display:grid;gap:8px}
.video{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.video a{color:var(--ink);font-weight:600;text-decoration:none;min-width:0;flex:1 1 220px}
.video a:hover{color:var(--accent)}
.video a::before{content:"▶";display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.7rem;margin-right:10px;vertical-align:1px}
.video .src{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.72rem;font-weight:700;vertical-align:2px}
.video.seen a::before{background:var(--ok)}
label.chk{display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-size:.92rem;cursor:pointer}
label.chk input{width:18px;height:18px;accent-color:var(--ok)}
.reveal{border-top:1px dashed var(--line);padding-top:12px;color:var(--ink)}
.quiz{display:grid;gap:14px}
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.qtext{font-size:1.12rem;font-weight:600;max-width:70ch}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.opt b{font-family:var(--font-display);font-size:1.2rem;line-height:1.2;color:var(--muted)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right b{color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong b{color:var(--bad)}
.opt[disabled]{cursor:default}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.92rem}
.result{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.big{font:700 3rem/1 var(--font-display)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.metro{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.beat{font:700 2.6rem/1 var(--font-display);width:2.4ch;text-align:center;color:var(--accent)}
.pulse{width:22px;height:22px;border-radius:50%;background:var(--line)}
.pulse.on{background:var(--accent)}
.muted{color:var(--muted)}
table.hist{border-collapse:collapse;width:100%;font-size:.95rem}
table.hist td,table.hist th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.empty{color:var(--muted);padding:20px;border:1px dashed var(--line);border-radius:10px}
.sync{font-size:.82rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<div class="wrap">
<header class="top">
  <div class="top-row">
    <div>
      <div class="eyebrow">Kwalifikowana pierwsza pomoc</div>
      <h1><span class="cross" aria-hidden="true">+</span>Kurs przed recertyfikacją</h1>
    </div>
    <div class="meter">
      <div class="row" style="justify-content:space-between"><span class="eyebrow">Postęp</span><span class="mono" id="progTxt">0 / 20</span></div>
      <div class="bar"><i id="progBar"></i></div>
    </div>
  </div>
  <div class="meta">
    <span>4 tygodnie · 5 lekcji tygodniowo · 278 pytań z bazy egzaminacyjnej</span>
    <label for="startDate">Start kursu: <input type="date" id="startDate"></label>
    <span class="sync" id="sync">Postęp zapisany w tej przeglądarce</span>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" id="tab-plan" aria-selected="true" data-view="plan">Plan</button>
  <button role="tab" id="tab-lesson" aria-selected="false" data-view="lesson">Lekcja</button>
  <button role="tab" id="tab-errors" aria-selected="false" data-view="errors">Moje błędy<span class="count" id="errCount">0</span></button>
  <button role="tab" id="tab-exam" aria-selected="false" data-view="exam">Egzamin próbny</button>
</nav>

<main id="view"></main>

<script>
const Q = [{"nr": 1, "question": "Jedną z przyczyn wstrząsu hipowolemicznego jest:", "options": {"A": "nagły spadek poziomu glukozy we krwi.", "B": "nagłe podniesienie poziomu glukozy we krwi.", "C": "chwilowa utrata przytomności.", "D": "spadek objętości krwi krążącej.", "E": "żadne z wymienionych."}, "correct": "D"}, {"nr": 2, "question": "Osobę poszkodowaną zabezpieczamy przed wychłodzeniem folią „NRC\". Należy ja ułożyć:", "options": {"A": "złotą stroną na zewnątrz.", "B": "srebrną stroną na zewnątrz.", "C": "kolor nie ma znaczenia.", "D": "najważniejsze jest dokładne owinięcie poszkodowanego folią.", "E": "prawdziwe są odpowiedzi C i D."}, "correct": "E"}, {"nr": 3, "question": "Pozycja przeciwwstrząsowa polega na ułożeniu poszkodowanego:", "options": {"A": "w pozycji bocznej ustalonej.", "B": "na wznak (na plecach), jeżeli brak cech urazów, można zastosować bierne uniesienie kończyn dolnych do 7 minut.", "C": "na wznak z uniesionymi kończynami dolnymi 30 cm do góry.", "D": "na wznak z uniesioną głową (wałek pod głowę).", "E": "w pozycji półsiedzącej."}, "correct": "B"}, {"nr": 4, "question": "Niepokój, szybki oddech, brak wyczuwalnego tętna na tętnicy promieniowej, nawrót kapilarny >2 sek., bladość powłok skórnych, zimny pot. Te objawy mogą być oznaką:", "options": {"A": "udaru cieplnego.", "B": "śmierci klinicznej.", "C": "przegrzania.", "D": "wstrząsu.", "E": "żadne z wymienionych"}, "correct": "D"}, {"nr": 5, "question": "Czas nawrotu kapilarnego (CRT, Capillary Refill Time).", "options": {"A": "<2 sek. świadczy, że nie wystąpiła centralizacja krążenia.", "B": ">2 sek. może być jedną z oznak wstrząsu.", "C": "przy wychłodzeniu nie jest wyznacznikiem stanu poszkodowanego.", "D": "prawdziwe są odpowiedzi B i C.", "E": "prawdziwe są odpowiedzi A, B i C."}, "correct": "E"}, {"nr": 6, "question": "Będąc świadkiem napadu drgawek u poszkodowanego na ulicy należy:", "options": {"A": "wezwać natychmiast zespół ratownictwa medycznego.", "B": "przy pomocy długopisu rozchylić usta poszkodowanego.", "C": "przytrzymać całe ciało starając się wyhamować drgawki.", "D": "chronić głowę przed obrażeniami, następnie utrzymać drożność górnych dróg oddechowych.", "E": "nie dotykać poszkodowanego, bo napad musi sam minąć."}, "correct": "D"}, {"nr": 7, "question": "Wskaż fałszywe stwierdzenie dotyczące napadu drgawkowego:", "options": {"A": "może wystąpić utrata przytomności z niepamięcią wsteczną.", "B": "najczęściej dochodzi do zagryzienia języka i należy włożyć patyk między zęby, by nie było krwawienia (nawet podczas drgawek należy próbować).", "C": "często bezwiednie następuje oddanie moczu.", "D": "podczas drgawek może dojść do urazów głowy.", "E": "drgawki i prężenia często obejmują całe ciało."}, "correct": "B"}, {"nr": 8, "question": "Drgawki mogą występować przy:", "options": {"A": "urazie mózgowo-czaszkowym.", "B": "zatruciu, niedotlenieniu.", "C": "wysokiej temperaturze ciała, szczególnie u dzieci.", "D": "odwodnieniu, udarze cieplnym.", "E": "wszystkich wymienionych."}, "correct": "E"}, {"nr": 9, "question": "Wskaż prawdziwe stwierdzenie dotyczące występowania śpiączki u chorego na cukrzycę:", "options": {"A": "może być spowodowana znacznym spadkiem glukozy we krwi.", "B": "występują zaburzenia świadomości aż do jej utraty.", "C": "może być spowodowana przedawkowaniem insuliny.", "D": "prawdziwe są odpowiedzi A i D.", "E": "prawdziwe są odpowiedzi A, B i C."}, "correct": "E"}, {"nr": 10, "question": "U osoby, która jest nieprzytomna, śpiączkę cukrzycową można podejrzewać na podstawie:", "options": {"A": "obecności cukierków w kieszeni, bo to chroni przed „niedocukrzeniem\".", "B": "zapachu acetonu w wydychanym powietrzu.", "C": "suchości skóry i języka.", "D": "pokłutych opuszków palców.", "E": "prawdziwe są odpowiedzi B, C i D."}, "correct": "E"}, {"nr": 11, "question": "Hipoglikemia to stan:", "options": {"A": "w którym może dojść do utraty przytomności.", "B": "charakteryzujący się niskim poziomem glukozy we krwi (znacznie poniżej normy).", "C": "w którym mogą wystąpić następujące objawy: dezorientacja, bełkotliwa mowa, uczucie niepokoju, obfite pocenie się lub bladość powłok skórnych.", "D": "w którym jak najszybciej należy podać insulinę.", "E": "prawdziwe są odpowiedzi A, B i C."}, "correct": "E"}, {"nr": 12, "question": "Na przystanku autobusowym leży na brzuchu mężczyzna w wieku około 55 lat. Wskaż właściwe postępowanie:", "options": {"A": "wzywać policję, mężczyzna zapewne jest pijany.", "B": "ułożyć mężczyznę w pozycji bocznej ustalonej, wzywać policję.", "C": "sprawdzić oznaki życia.", "D": "wsiąść do autobusu, bo nadjechał ten, na który czekałeś.", "E": "zapytać czy jest w pobliżu lekarz."}, "correct": "C"}, {"nr": 13, "question": "W autobusie siedzi mężczyzna, skarżący się na piekący ból w klatce piersiowej. Jest blady i spocony, oddycha szybko. Wskaż właściwe postępowanie:", "options": {"A": "natychmiast wyprowadzić mężczyznę z autobusu i zaprowadzić na postój taksówek by pojechał do szpitala.", "B": "nie pozwolić mężczyźnie wstać, rozpiąć koszulę, zapytać: jak długo boli czy leczy się na serce, wezwać zespół ratownictwa medycznego, rozważyć ułożenie w pozycji przeciwwstrząsowej.", "C": "podać aspirynę (160-300 mg), jeśli jest dostępna.", "D": "nie należy podawać aspiryny dorosłym z bólem w klatce piersiowej niejasnego pochodzenia, uczulonym na lek lub przyjmującym go na stałe.", "E": "prawdziwe są odpowiedzi B, C i D."}, "correct": "E"}, {"nr": 14, "question": "U osoby, która uskarżała się na ból w klatce piersiowej doszło do utraty przytomności i osunięcia na podłogę w obecności innych ludzi. Wskaż właściwe postępowanie:", "options": {"A": "ułożyć osobę w pozycji bocznej ustalonej z utrzymaniem drożności dróg oddechowych i wezwać pomoc.", "B": "ułożyć osobę na wznak z nogami uniesionymi około 30 cm do góry i wezwać pomoc.", "C": "sprawdzić czy w kieszeni poszkodowany nie ma leków na serce by je podać.", "D": "udrożnić drogi oddechowe i sprawdzić obecność oddechu, podjąć uciśnięcia klatki piersiowej, jeśli jest brak oddechu.", "E": "po stwierdzeniu braku oddechu prowadzić oddech zastępczy."}, "correct": "D"}, {"nr": 15, "question": "U nieprzytomnej osoby dorosłej brak oddechu stanowi podstawę do podjęcia resuscytacji krążeniowo-oddechowej w schemacie:", "options": {"A": "2 wdechy, 15 uciśnięć klatki piersiowej.", "B": "2 wdechy, 30 uciśnięć klatki piersiowej.", "C": "15 uciśnięć klatki piersiowej, 2 wdechy.", "D": "30 uciśnięć klatki piersiowej, 2 wdechy.", "E": "dowolnym z wymienionych."}, "correct": "D"}, {"nr": 16, "question": "Do często spotykanych objawów zawału mięśnia sercowego należy:", "options": {"A": "ból w klatce piersiowej w okolicy zamostkowej o charakterze gniecenia.", "B": "drętwienie lewej kończyny górnej.", "C": "uczucie lęku.", "D": "pobudzenie psychoruchowe.", "E": "prawdziwe są odpowiedzi A, B i C."}, "correct": "E"}, {"nr": 17, "question": "Częstym powikłaniem uciśnięć klatki piersiowej u osoby z zatrzymaniem oddechu i krążenia jest:", "options": {"A": "uraz kręgosłupa.", "B": "niedowład kończyn dolnych.", "C": "złamanie żeber i mostka.", "D": "uszkodzenie naczyń w klatce piersiowej.", "E": "zaburzenia rytmu serca."}, "correct": "C"}, {"nr": 18, "question": "Przy trudnościach w oddychaniu poszkodowanego przebywającego w strefie zadymienia należy:", "options": {"A": "podać tlen i posadzić poszkodowanego w pozycji półsiedzącej.", "B": "podać tlen i ewakuować ze strefy zadymienia.", "C": "wezwać pomoc do poszkodowanego i przystąpić do oceny stanu poszkodowanego w miejscu zdarzenia.", "D": "w miarę możliwości odizolować drogi oddechowe poszkodowanego od atmosfery toksycznej i ewakuować ze strefy zagrożenia.", "E": "ułożyć w pozycji bezpiecznej i czekać na przybycie ratowników."}, "correct": "D"}, {"nr": 19, "question": "Oddechu zastępczego metodą usta-usta nie wolno wykonywać, gdy:", "options": {"A": "poszkodowany jest pijany.", "B": "poszkodowany jest chory na cukrzycę.", "C": "poszkodowany ma krótką szyję.", "D": "poszkodowany wypił środki ochrony roślin.", "E": "należy prowadzić oddech zastępczy z użyciem mokrej chusteczki."}, "correct": "D"}, {"nr": 20, "question": "Przy podejrzeniu zatrucia cyjanowodorem, poszkodowanego (możliwy wyczuwalny zapach gorzkich migdałów), który ma ślady wymiocin na ustach można:", "options": {"A": "zaniechać wentylacji metodą usta-usta, jeżeli są opory natury estetycznej.", "B": "wentylować tylko przy użyciu maski twarzowej.", "C": "wentylować metodą usta-usta, jeśli nie ma innych możliwości.", "D": "wentylować z użyciem nawilżonej wodą chusteczki.", "E": "wentylować go tylko przy użyciu worka samorozprężalnego."}, "correct": "E"}, {"nr": 21, "question": "Najczęstszą przyczyną zgonu u osób, które uległy zatruciu substancjami wpływającymi na funkcjonowanie centralnego układu nerwowego jest:", "options": {"A": "działanie samej substancji trującej.", "B": "podawanie odtrutek przez osoby niewykwalifikowane.", "C": "utrata przytomności i niedrożność górnych dróg oddechowych.", "D": "zaburzenia świadomości i próby samobójcze.", "E": "żadne z wymienionych."}, "correct": "C"}, {"nr": 22, "question": "W stosunku do osoby, która w wyniku zatrucia straciła przytomność należy podjąć następujące czynności:", "options": {"A": "podać węgiel aktywowany jako odtrutkę i wezwać zespół ratownictwa medycznego.", "B": "sprowokować wymioty i wezwać zespół ratownictwa medycznego.", "C": "zabezpieczyć substancję, która została zażyta i wezwać zespół ratownictwa medycznego.", "D": "przy zachowanym oddechu, ułożyć poszkodowanego w pozycji bocznej bezpiecznej i wezwać zespół ratownictwa medycznego.", "E": "wezwać zespół ratownictwa medycznego by nie tracić czasu na zbędne działania."}, "correct": "D"}, {"nr": 23, "question": "Wskaż prawidłową kolejność postępowania z osobą, która straciła przytomność podczas kąpieli w łazience, w której jest piecyk gazowy: 1) wstrzymując oddech zamknąć dopływ gazu i otworzyć okno w łazience; 2) ocenić czynności życiowe; 3) wynieść poszkodowanego poza strefę zagrożenia; 4) wezwać zespół ratownictwa medycznego i straż pożarną następnie udzielić pomocy w razie potrzeby. 5) opuścić pomieszczenie by osobie udzielającej pomocy nic się nie stało i wezwać zespół ratownictwa medycznego. Prawidłowa odpowiedź to:", "options": {"A": "5,4.", "B": "3,2,4,1.", "C": "3,4,5.", "D": "1,2,3,4.", "E": "3,2,4."}, "correct": "E"}, {"nr": 24, "question": "Wskaż fałszywe stwierdzenie dotyczące informacji o tlenku węgla:", "options": {"A": "łączy się z hemoglobiną 250-300 razy trwalej niż tlen.", "B": "ma charakterystyczny zapach i barwę.", "C": "jest lżejszy od powietrza.", "D": "potocznie nazywany jest czadem.", "E": "powstaje podczas spalania."}, "correct": "B"}, {"nr": 25, "question": "Po wyjściu z kąpieli, z łazienki, w której jest piecyk gazowy, osoba zgłasza nudności oraz zawroty głowy, zaczyna wymiotować. W tej sytuacji należy:", "options": {"A": "podejrzewać, że za długo przebywała w gorącej kąpieli i polecić jej odpoczynek w pokoju.", "B": "podejrzewać, że zjadła „coś\" co jej zaszkodziło.", "C": "podejrzewać zatrucie gazami spalinowymi w łazience (CO).", "D": "podejrzewać, że piła alkohol w łazience podczas kąpieli.", "E": "zabrać ją na spacer by się „przewietrzyła\"."}, "correct": "C"}, {"nr": 26, "question": "Pulsoksymetria jako metoda pomiarowa jest metodą:", "options": {"A": "nieinwazyjną przezskórnego oznaczania wysycenia krwi tlenem.", "B": "nieinwazyjną przezskórnego oznaczania wysycenia krwi CO2.", "C": "inwazyjną żylnego oznaczania wysycenia krwi tlenem.", "D": "która pozwala na jednoczesną ocenę tętna.", "E": "prawdziwe są odpowiedzi A i D."}, "correct": "E"}, {"nr": 27, "question": "Jednym z pierwszych objawów zatrucia tlenkiem węgla są:", "options": {"A": "bóle brzucha.", "B": "zawroty głowy.", "C": "drapanie w gardle.", "D": "skoki temperatury.", "E": "swędzenie skóry."}, "correct": "B"}, {"nr": 28, "question": "Osobie, która uległa podtopieniu, po wyjęciu z wody należy:", "options": {"A": "wylać wodę z dróg oddechowych poprzez odpowiednie ułożenie.", "B": "utrzymywać stabilizację kręgosłupa, gdyż najczęściej dochodzi do urazu w odcinku szyjnym.", "C": "okryć natychmiast folią życia chroniąc przed wychłodzeniem.", "D": "sprawdzić jamę ustną, następnie udrożnić drogi oddechowe i w przypadku braku oddechu wykonać 5 oddechów ratowniczych.", "E": "wszystkie wymienione."}, "correct": "D"}, {"nr": 29, "question": "Wskaż prawdziwe stwierdzenie:", "options": {"A": "woda słona uszkadza drogi oddechowe i należy ją najpierw wylać z poszkodowanego.", "B": "woda słodka nie wchłania się i należy ją wylać z poszkodowanego.", "C": "przy utonięciu w wodzie morskiej rokowanie jest lepsze.", "D": "przy utonięciu w wodzie słodkiej rokowanie jest lepsze.", "E": "postępowanie z osobą podtopioną jest takie samo, niezależnie od rodzaju wody."}, "correct": "E"}, {"nr": 30, "question": "Ratując osobę podtopioną w wodzie o niskiej temperaturze należy pamiętać, że:", "options": {"A": "śmierć mózgu następuje szybciej w zimnej wodzie.", "B": "uciskanie klatki piersiowej i prowadzenie oddechu zastępczego jest mało efektywne z uwagi na wodę w płucach.", "C": "głowa nie powinna być odchylana z uwagi na możliwość zachłyśnięcia wypitą wodą.", "D": "uzyskanie powrotu czynności życiowych może wystąpić po kilkudziesięciu minutach resuscytacji krążeniowo-oddechowej.", "E": "wszystkie stwierdzenia są fałszywe."}, "correct": "D"}, {"nr": 31, "question": "W przypadku podtopienia prowadzenie oddechu zastępczego należy rozpocząć:", "options": {"A": "po 5 minutach od wyjęcia z wody, by mogła się ona wchłonąć z płuc.", "B": "po wylaniu wody z dróg oddechowych.", "C": "po zapewnieniu stabilizacji kręgosłupa szyjnego.", "D": "najwcześniej jak jest to możliwe, w miarę możliwości jeszcze w wodzie.", "E": "wszystkie stwierdzenia są fałszywe."}, "correct": "D"}, {"nr": 32, "question": "Powierzchnia dłoni u dorosłego (reguła dłoni) to:", "options": {"A": "0,5% powierzchni całkowitej ciała.", "B": "1% powierzchni całkowitej ciała.", "C": "1,5% powierzchni całkowitej ciała.", "D": "2% powierzchni całkowitej ciała.", "E": "2,5% powierzchni całkowitej ciała."}, "correct": "B"}, {"nr": 33, "question": "Przy oparzeniu parą wodną obu rąk należy:", "options": {"A": "wezwać zespół ratownictwa medycznego i podać leki przeciwbólowe.", "B": "pokryć powierzchnię mokrym, jałowym opatrunkiem.", "C": "schładzać aktywnie wodą co najmniej 10 minut lub do ustania bólu i wezwać zespół ratownictwa medycznego.", "D": "okryć folią „życia\" w celu ochrony przed utratą ciepła.", "E": "prawdziwe są odpowiedzi C i D."}, "correct": "E"}, {"nr": 34, "question": "Oparzenie ciężkie to oparzenie:", "options": {"A": "prądem elektrycznym.", "B": "dróg oddechowych.", "C": "II stopnia >25% powierzchni ciała.", "D": "III stopnia >10% powierzchni ciała.", "E": "wszystkie wymienione."}, "correct": "E"}, {"nr": 35, "question": "Wskaż pierwszą czynność przy poszkodowanym porażeniem prądem po odłączeniu źródła napięcia:", "options": {"A": "udrożnienie dróg oddechowych i uciski klatki piersiowej.", "B": "ocena stanu świadomości i oddechu u poszkodowanego.", "C": "stabilizacja kręgosłupa szyjnego, udrożnienie dróg oddechowych i prowadzenie oddechu zastępczego.", "D": "nie należy podchodzić i ruszać poszkodowanego w obawie o pozostały ładunek elektryczny wokół poszkodowanego.", "E": "żadne z wymienionych."}, "correct": "B"}, {"nr": 36, "question": "O oparzeniu dróg oddechowych i zatruciu wziewnym mogą świadczyć następujące objawy:", "options": {"A": "duszność, kaszel.", "B": "ślady sadzy na twarzy, w jamie ustnej i ślinie, opalone brwi i rzęsy.", "C": "charakter zdarzenia.", "D": "chrypka, świszczący oddech.", "E": "wszystkie wymienione."}, "correct": "E"}, {"nr": 37, "question": "Jaka jest najpoważniejsza wczesna komplikacja porażenia prądem elektrycznym zmiennym?", "options": {"A": "zaburzenia rytmu serca.", "B": "uraz kręgosłupa szyjnego.", "C": "wstrząs hipowolemiczny.", "D": "niewydolność nerek.", "E": "żadna z wymienionych."}, "correct": "A"}, {"nr": 38, "question": "Brak odczuwania bólu w miejscu urazu, stwierdza się przy oparzeniach:", "options": {"A": "I°.", "B": "II°.", "C": "III°.", "D": "chemicznym.", "E": "wszystkich wymienionych."}, "correct": "C"}, {"nr": 39, "question": "Podczas prac budowlanych jeden z pracowników został ochlapany wapnem w okolicy twarzy. Wskaż prawidłową kolejność postępowania: 1) opłukanie twarzy wodą w celu usunięcia substancji. 2) starcie suchą szmatką zaprawy z twarzy i okolicy oczu. 3) usunięcie poszkodowanego ze strefy zagrożenia. 4) delikatne przemywanie wodą, najlepiej mineralną. 5) zdecydowane przemywanie oczu bieżącym strumieniem wody. Prawidłowa odpowiedź to:", "options": {"A": "1,2.", "B": "3,2,4.", "C": "3,2,5.", "D": "4,1,2,3.", "E": "3,5."}, "correct": "C"}, {"nr": 40, "question": "Wskaż prawidłową kolejność postępowania z osobą nieprzytomną z objawami hipotermii: 1) przenieść do suchego, ciepłego pomieszczenia i zdjęcie mokrego ubrania. 2) podać ciepły napój najlepiej z alkoholem – działa rozgrzewająco. 3) kontrola podstawowych czynności życiowych. 4) zdecydowanymi ruchami rozcierać miejsca wychłodzone lub zalecić gimnastykę. 5) ułożyć w pozycji poziomej, ograniczyć ruch i ogrzewać biernie. Prawidłowa odpowiedź to:", "options": {"A": "1,2,3,4,5.", "B": "1,3,2,5.", "C": "3,4,2.", "D": "2,4,3.", "E": "3,1,5."}, "correct": "E"}, {"nr": 41, "question": "Podczas smażenia frytek doszło do ochlapania gorącym olejem całej dłoni. Skuteczne postępowanie polega na: 1) natychmiastowym odsunięciu poszkodowanego od naczynia z olejem; 2) ułożenie w pozycji bocznej ustalonej. 3) chłodzeniu ręki aktywnie bieżącą wodą co najmniej 10 minut lub do ustania bólu. 4) trzymaniu ręki w wiadrze z wodą; 5) polewaniu ręki alkoholem, bo świetnie odprowadza ciepło. Prawidłowa odpowiedź to:", "options": {"A": "1,5.", "B": "1,3.", "C": "3,5.", "D": "4,5.", "E": "1,2,4,5."}, "correct": "B"}, {"nr": 42, "question": "Podczas prac przeładunkowych jeden z pracowników został obsypany wapnem gaszonym. Wskaż prawidłowe postępowanie: 1) natychmiast polać wodą poszkodowanego. 2) usunąć poszkodowanego w miejsce bezpieczne. 3) zdjąć odzież z poszkodowanego. 4) posypać piachem ubranego poszkodowanego – piach wchłania ług sodowy. 5) spłukać poszkodowanego bieżącą woda i wezwać zespół ratownictwa medycznego. Prawidłowa odpowiedź to:", "options": {"A": "1,2,5.", "B": "2,3,4.", "C": "2,3,5.", "D": "3,4,5.", "E": "1,2,3,5."}, "correct": "C"}, {"nr": 43, "question": "Ratownik jest świadkiem wypadku samochodu – cysterny, na drogę wycieka płyn, który daje biało-żółty dym. Wskaż właściwe postępowanie: 1) natychmiast udać się do kabiny by wyciągnąć kierowcę; 2) zabezpieczyć miejsce wypadku: zatrzymać pojazd w bezpiecznej odległości, założyć kamizelkę odblaskową, rozstawić trójkąt ostrzegawczy; 3) zadzwonić na nr 112/998 i podać informacje o zdarzeniu oraz numery z pomarańczowej tablicy informacyjnej z samochodu, jeżeli są widoczne; 4) jak najszybciej oddalić się z miejsca zdarzenia by nie ulec zatruciu. 5) w bezpiecznej odległości oczekiwać na przybycie służb ratowniczych. Prawidłowa odpowiedź to:", "options": {"A": "1,2,5.", "B": "3,4,5.", "C": "2,3,4,5.", "D": "1,2,3.", "E": "2,3,5."}, "correct": "E"}, {"nr": 44, "question": "Po spożyciu przez poszkodowanego dużej ilości leków w celach samobójczych należy jak najszybciej:", "options": {"A": "zapytać poszkodowanego o powód i rozmawiać z nim by nie zasnął.", "B": "prowokować wymioty w celu eliminacji trucizny pod warunkiem, że jest przytomny, dbając by się nie zachłysnął.", "C": "zabezpieczyć pozostałe opakowania po środkach by przekazać je zespołowi ratownictwa medycznego.", "D": "wezwać zespół ratownictwa medycznego i czekać na przyjazd.", "E": "wezwać policję."}, "correct": "B"}, {"nr": 45, "question": "Osobę po spożyciu dużej ilości alkoholu należy:", "options": {"A": "chronić przed upadkiem, wychłodzeniem.", "B": "w przypadku utraty świadomości, ułożyć w pozycji bezpiecznej.", "C": "prowokować wymioty w celu eliminacji alkoholu i zmniejszenie efektu toksycznego.", "D": "prawdziwe są odpowiedzi A i D.", "E": "prawdziwe są odpowiedzi A, B i C."}, "correct": "D"}, {"nr": 46, "question": "Czy jest różnica w postępowaniu z osobą oparzoną silnym kwasem lub silną zasadą? (w postępowaniu na poziomie kwalifikowanej pierwszej pomocy)", "options": {"A": "nie ma różnicy, w obu przypadkach należy najpierw zobojętnić substancję żrącą.", "B": "przy oparzeniu kwasem jest więcej czasu na podjęcie działań.", "C": "zasada jest mniej groźna.", "D": "postępowanie w obu przypadkach jest takie samo.", "E": "wszystko zależy od stężenia substancji żrącej."}, "correct": "D"}, {"nr": 47, "question": "Oparzenie I° charakteryzuje się:", "options": {"A": "pęcherzami z płynem surowiczym.", "B": "piekącym, swędzącym rumieniem na skórze, bólem przy dotyku.", "C": "brakiem czucia.", "D": "prawdziwe są odpowiedzi A i D.", "E": "prawdziwe są odpowiedzi A, B i C."}, "correct": "B"}, {"nr": 48, "question": "Oparzenie II° charakteryzuje się:", "options": {"A": "piekącym, rumieniem na skórze, bólem przy dotyku.", "B": "martwicą tkanek, brakiem czucia.", "C": "pęcherzami wypełnionymi płynem surowiczym na podłożu rumieniowym.", "D": "dużym bólem w miejscu oparzenia.", "E": "prawdziwe są odpowiedzi C i D."}, "correct": "E"}, {"nr": 49, "question": "Oparzenie III° charakteryzuje się:", "options": {"A": "brakiem czucia dotyku i bólu w miejscu oparzenia.", "B": "uszkodzeniem wszystkich warstw skóry.", "C": "pęcherzami na zaczerwienionej skórze i wyciekiem płynu z pęcherzy.", "D": "prawdziwe są odpowiedzi A i D.", "E": "prawdziwe są odpowiedzi A, B i C."}, "correct": "D"}, {"nr": 50, "question": "Hipertermia to stan, w którym występuje:", "options": {"A": "podwyższona temperatura ciała.", "B": "obniżona temperatura ciała.", "C": "temperatura ciała nie ulega zmianie.", "D": "należy podjąć działania zmierzające do ochłodzenia organizmu.", "E": "prawdziwe są odpowiedzi A i D."}, "correct": "E"}, {"nr": 51, "question": "5-letnie dziecko w trakcie zabawy w ogrodzie zostało ukąszone wielokrotnie przez pszczoły. Wskaż właściwe postępowanie:", "options": {"A": "jeżeli występują objawy ostrej anafilaksji należy podać 0,3 mg adrenaliny (ampułkostrzykawka) domięśniowo.", "B": "wezwać zespół ratownictwa medycznego.", "C": "przenieść dziecko w bezpieczne miejsce, w miarę możliwości usunąć pozostałe żądła.", "D": "wezwać zespół ratownictwa medycznego i obserwować oddech, uspokoić dziecko.", "E": "prawdziwe są odpowiedzi A, C i D."}, "correct": "E"}, {"nr": 52, "question": "Hipoksja to stan, w którym:", "options": {"A": "występuje nadmiar tlenu w tkankach w stosunku do zapotrzebowania, prowadzący do hiperwentylacji.", "B": "następuje spadek ciśnienia wywołany zmianą pozycji ciała.", "C": "występuje niedobór tlenu w tkankach w stosunku do zapotrzebowania, prowadzący do niedotlenienia organizmu.", "D": "następuje wzrost ciśnienia wywołany zmianą pozycji ciała.", "E": "prawdziwe są odpowiedzi A i D."}, "correct": "C"}, {"nr": 53, "question": "Hipotonia ortostatyczna to stan, w którym:", "options": {"A": "następuje spadek ciśnienia wywołany zmianą pozycji ciała.", "B": "następuje wzrost ciśnienia wywołany zmianą pozycji ciała.", "C": "występuje niedobór tlenu w tkankach w stosunku do zapotrzebowania, prowadzący do niedotlenienia organizmu", "D": "występuje nadmiar tlenu w tkankach w stosunku do zapotrzebowania, prowadzący do hiperwentylacji.", "E": "żadna z odpowiedzi nie jest prawidłowa."}, "correct": "A"}, {"nr": 54, "question": "Przy oparzeniach elektrycznych najbardziej zagrażające dla poszkodowanego są:", "options": {"A": "skutki miejscowe, np. oparzenie dłoni.", "B": "zaburzenia rytmu serca.", "C": "niekorzystne działanie prądu na skórę (późniejsze blizny).", "D": "wpływ prądu elektrycznego na potencjały mózgowe.", "E": "żadne z wymienionych."}, "correct": "B"}, {"nr": 55, "question": "Przy oparzeniach termicznych dłoni istotnym elementem działań ratowniczych jest: 1) schładzanie bieżącą wodą co najmniej 10 minut lub do ustąpienia bólu lub zastosowanie hydrożelu bezpośrednio na oparzenie. 2) zdjęcie biżuterii z palców i nadgarstków. 3) okrycie rany oparzeniowej po schłodzeniu suchym jałowym opatrunkiem. Prawidłowa odpowiedź to:", "options": {"A": "1,3.", "B": "1,2.", "C": "2,3.", "D": "tylko 1.", "E": "wszystkie wymienione."}, "correct": "E"}, {"nr": 56, "question": "U nieprzytomnego poszkodowanego po upadku ze schodów, bez krwotoków zewnętrznych, z widocznym powierzchniowym otarciem skóry głowy, z zachowanym własnym oddechem i tętnem, działania pilne należy wykonać w następującej kolejności: 1) tlenoterapia (jeżeli są wskazania). 2) odkażenie rany. 3) ręczna stabilizacja kręgosłupa szyjnego, ocena oddechu. 4) ułożenie w pozycji przeciwwstrząsowej. 5) założenie opatrunku osłaniającego. Prawidłowa odpowiedź to:", "options": {"A": "3,1.", "B": "1,4.", "C": "1,2,3.", "D": "2,3,5.", "E": "1,2,3,4."}, "correct": "A"}, {"nr": 57, "question": "Wskaż priorytetowe czynności ratownicze:", "options": {"A": "opatrzenie rany oparzeniowej.", "B": "udrożnienie dróg oddechowych.", "C": "unieruchomienie złamanej kończyny.", "D": "zatamowanie krwotoku.", "E": "czynności ujęte w punktach B i D mają zawsze pierwszeństwo przed innymi działaniami."}, "correct": "E"}, {"nr": 58, "question": "Ranę kłutą klatki piersiowej na miejscu zdarzenia należy zaopatrzyć:", "options": {"A": "pozostawić bez opatrunku lub opatrunkiem nieokluzyjnym.", "B": "opatrunkiem z folii, szczelnie przymocowanym do klatki piersiowej ze wszystkich stron.", "C": "pozostawić bez zaopatrzenia ze względu na niebezpieczeństwo braku przepływu powietrza w drogach oddechowych poszkodowanego.", "D": "opatrunkiem zastawkowym.", "E": "prawdziwe są odpowiedzi A i D."}, "correct": "E"}, {"nr": 59, "question": "W krwotoku tętniczym przedramienia, który nie zmniejsza się po zaopatrzeniu opatrunkiem uciskowym założonym w miejscu krwawienia, należy rozważyć następujące postępowanie: 1) ułożenie poszkodowanego płasko oraz umieszczenie kończyny powyżej poziomu serca. 2) wzmocnienie ucisku poprzez owinięcie opatrunku dodatkowymi zwojami bandaża. 3) zdjęcie już założonego opatrunku i ponowne założenie grubszego opatrunku. 4) założenie opaski zaciskowej na przedramieniu 5-7 cm powyżej miejsca krwotoku. 5) założenie drugiej opaski zaciskowej na ramieniu jeżeli pierwsza jest nieskuteczna. Prawidłowa odpowiedź to:", "options": {"A": "1,3,5.", "B": "1,2,4.", "C": "1,2,4,5.", "D": "1,3,4.", "E": "2,3,4,5."}, "correct": "C"}, {"nr": 60, "question": "Podawanie tlenu poszkodowanemu jest w określonych sytuacjach bezwzględnie konieczne. Wskaż prawdziwe stwierdzenia: 1) tlen podawać można tylko poszkodowanemu znajdującemu się w pozycji leżącej. 2) podawanie tlenu jest podstawowym działaniem w zatruciach wziewnych. 3) aby uzyskać około 100% stężenie tlenu podawanego dorosłemu przez maskę do tlenoterapii należy zastosować przepływ minimum 6 litrów na minutę. 4) tlen jest szkodliwy przy dłuższym stosowaniu. 5) zestaw do tlenoterapii biernej powinien posiadać rezerwuar. Prawidłowa odpowiedź to:", "options": {"A": "2,3,4.", "B": "1,2,4.", "C": "2,4,5.", "D": "1,4,5.", "E": "1,3,5."}, "correct": "C"}, {"nr": 61, "question": "U poszkodowanego w wyniku wypadku stwierdzono szereg obrażeń i objawów. Wskaż, który objaw (lub grupa objawów) albo obrażenie jest najbardziej niepokojący i może wskazywać na potencjalne zagrożenie życia poszkodowanego:", "options": {"A": "złamanie kończyny górnej ze znacznym przemieszczeniem.", "B": "oparzenie II stopnia okolicy podudzia.", "C": "rana szarpana dłoni z niewielkim, powolnym wyciekiem krwi.", "D": "blada, chłodna i spocona skóra.", "E": "złamanie otwarte podudzia lewego bez krwotoku."}, "correct": "D"}, {"nr": 62, "question": "Wyciek płynu mózgowo-rdzeniowego i/lub krwawienie z uszu u poszkodowanego po urazie:", "options": {"A": "może grozić rozwinięciem wstrząsu.", "B": "może świadczyć o złamaniu podstawy czaszki.", "C": "wymaga założenia jałowego tamponu do ucha.", "D": "prawdziwe są odpowiedzi A i D.", "E": "prawdziwe są odpowiedzi A, B i C."}, "correct": "D"}, {"nr": 63, "question": "Krwotok tętniczy zaopatruje się w pierwszej kolejności:", "options": {"A": "opaską zaciskową poniżej miejsca zranienia.", "B": "opaską zaciskową powyżej miejsca zranienia.", "C": "opatrunkiem uciskowym w miejscu zranienia.", "D": "szczelnym opatrunkiem osłaniającym.", "E": "prawdziwe są odpowiedzi B i C."}, "correct": "E"}, {"nr": 64, "question": "W przypadku krwotoku u poszkodowanego w pierwszej fazie występują pewne charakterystyczne objawy. Wskaż, który z objawów raczej nie wystąpi u takiego poszkodowanego:", "options": {"A": "przyspieszone tętno", "B": "przyspieszony i spłycony oddech.", "C": "odczuwalne wzmożone pragnienie.", "D": "zwolniona czynność serca.", "E": "uczucie zimna."}, "correct": "D"}, {"nr": 65, "question": "W trakcie udzielania pomocy w przypadku oparzenia, miejsce urazu należy schłodzić bieżącą wodą lub użyć opatrunku hydrożelowego. Wskaż zalety zastosowania opatrunku hydrożelowego:", "options": {"A": "zmniejsza uczucie bólu.", "B": "opatrunek nie przywiera do rany.", "C": "zmniejsza znacznie ryzyko wystąpienia hipotermii spowodowanej schładzaniem.", "D": "prawdziwe są odpowiedzi A i D.", "E": "prawdziwe są odpowiedzi A, B i C."}, "correct": "E"}, {"nr": 66, "question": "W wyniku zdarzenia drogowego poszkodowany leży na ulicy. Stwierdzono ranę tłuczoną głowy, złamanie kości obu podudzi na tej samej wysokości oraz stłuczenie barku. Jeden ze stojących obok samochodów ma zbitą przednią szybę i wgniecioną maskę. Najbardziej prawdopodobną przyczyną doznanych obrażeń jest:", "options": {"A": "wypadnięcie poszkodowanego z jadącego samochodu.", "B": "zgniecenie samochodu, w którym znajdował się poszkodowany.", "C": "potrącenie poszkodowanego przez ten samochód osobowy.", "D": "na podstawie takiego obrazu nie można przypuszczać jaki był mechanizm urazu.", "E": "analiza przyczyn obrażeń nie ma znaczenia."}, "correct": "C"}, {"nr": 67, "question": "Najdogodniejszą pozycją dla poszkodowanych z poziomą raną brzucha jest pozycja:", "options": {"A": "leżąca z nogami zgiętymi w stawach biodrowych i kolanowych.", "B": "półsiedząca.", "C": "boczna bezpieczna.", "D": "leżąca na brzuchu, z nogami wyprostowanymi.", "E": "przeciwwstrząsowa."}, "correct": "A"}, {"nr": 68, "question": "U poszkodowanego po urazie głowy z ucha wycieka powoli różowo podbarwiony płyn. Wskaż właściwe postępowanie:", "options": {"A": "taki stan nie wymaga na miejscu zdarzenia żadnych szczególnych działań ratowniczych, gdyż wyciek ustaje po kilku minutach.", "B": "należy wykonać opatrunek osłaniający z gazy jałowej i codofixu.", "C": "należy wykonać opatrunek uciskowy z gazy jałowej z użyciem bandaża elastycznego.", "D": "należy do przewodu słuchowego włożyć szczelny tampon z gazy jałowej, aby zapobiec dalszemu wyciekowi.", "E": "żaden z wymienionych."}, "correct": "B"}, {"nr": 69, "question": "Krwotok tętniczy można próbować odróżnić od żylnego na podstawie:", "options": {"A": "intensywności wypływu krwi.", "B": "większej bolesności przy krwawieniu.", "C": "różnicy koloru wypływającej krwi.", "D": "krwotok tętniczy ma zazwyczaj charakter tętniący.", "E": "prawdziwe są odpowiedzi A i D."}, "correct": "E"}, {"nr": 70, "question": "Poszkodowany siedzi w rozbitym samochodzie. Jest blady, spocony, ma przyśpieszony oddech, złamania zamknięte obu kończyn dolnych na różnych wysokościach oraz zaburzenia świadomości. Wskaż prawidłowy sposób postępowania przed przybyciem Zespołu Ratownictwa Medycznego:", "options": {"A": "w pierwszej kolejności należy unieruchomić złamania, później wykonywać dalsze czynności.", "B": "należy podać poszkodowanemu tlen i zaczekać z dalszym działaniem na przybycie lekarza.", "C": "należy pilnie ewakuować poszkodowanego z pojazdu, bo pozycja w jakiej się znajduje stanowi dla niego zagrożenie, a następnie wykonywać dalsze, określone rodzajem obrażeń procedury ratownicze.", "D": "jeżeli pilna ewakuacja z pojazdu jest niemożliwa, należy dążyć do ułożenia w pozycji przeciwwstrząsowej w pojeździe.", "E": "prawdziwe są odpowiedzi C i D."}, "correct": "E"}, {"nr": 71, "question": "Wskaż prawidłową kolejność postępowania z poszkodowanym po urazie w wyniku wypadku samochodowego:", "options": {"A": "pilne unieruchomienie złamań, zatamowanie krwotoku, zapewnienie komfortu termicznego.", "B": "zabezpieczenie miejsca zdarzenia, dotarcie do poszkodowanego, udzielenie pomocy.", "C": "zabezpieczenie miejsca zdarzenia, unieruchomienie złamań, podanie tlenu.", "D": "stabilizacja głowy przy pomocy kołnierza ortopedycznego, tamowanie krwotoku, unieruchomienie złamań.", "E": "wszystkie wymienione są nieprawidłowe."}, "correct": "B"}, {"nr": 72, "question": "Kołnierz ortopedyczny służy do:", "options": {"A": "ograniczenia ruchomości odcinka szyjnego kręgosłupa.", "B": "usztywnienia kręgosłupa szyjnego.", "C": "unieruchomienia głowy.", "D": "unieruchomienia głowy tylko na czas ewakuacji.", "E": "żadnego z wymienionych."}, "correct": "A"}, {"nr": 73, "question": "U poszkodowanego z rozległą raną powłok i obrażeniami narządów jamy brzusznej ratownik powinien:", "options": {"A": "podać doustnie ogrzane, niesłodzone płyny celem zmniejszenia utraty ciepła.", "B": "założyć wilgotny opatrunek osłaniający przykryty szczelnie folią.", "C": "założyć opatrunek uciskowy przykryty folią termoizolacyjną.", "D": "prawdziwe są odpowiedzi A i D.", "E": "prawdziwe są odpowiedzi A i D."}, "correct": "B"}, {"nr": 74, "question": "Do zakresu kwalifikowanej pierwszej pomocy medycznej udzielanej przez ratowników nie należy:", "options": {"A": "wykonywanie resuscytacji krążeniowo-oddechowej (RKO).", "B": "podejmowanie decyzji o transporcie poszkodowanych do ośrodków leczniczych.", "C": "tamowanie krwotoków.", "D": "udrożnienie dróg oddechowych z użyciem rurki ustno-gardłowej lub maski krtaniowej.", "E": "zapewnienie komfortu cieplnego."}, "correct": "B"}, {"nr": 75, "question": "W masywnych krwotokach (duża utrata krwi w krótkim czasie) w pierwszej fazie należy spodziewać się u poszkodowanego:", "options": {"A": "zaburzeń świadomości.", "B": "przyspieszonego tętna.", "C": "zaczerwienienia skóry.", "D": "bladości skóry.", "E": "prawdziwe są odpowiedzi A, B i C."}, "correct": "E"}, {"nr": 76, "question": "W złamaniu otwartym kości udowej, któremu towarzyszy krwotok tętniczy, priorytetem ratowniczym jest:", "options": {"A": "zatamowanie krwotoku, w razie potrzeby przez ucisk na tętnicę powyżej miejsca złamania.", "B": "ułożenie odłamów w pozycji zbliżonej do fizjologicznej dla stworzenia warunków dla zastosowania opatrunku uciskowego.", "C": "założenie opatrunku osłaniającego i stabilizacja w pozycji zbliżonej do fizjologicznej.", "D": "stabilizacja i unieruchomienie w pozycji zastanej oraz opatrunek uciskowy.", "E": "tlenoterapia 100% tlenem."}, "correct": "A"}, {"nr": 77, "question": "Poszkodowanemu w hipotermii należy zapewnić pozycję:", "options": {"A": "poziomą.", "B": "półsiedzącą.", "C": "przeciwwstrząsową.", "D": "boczną bezpieczną.", "E": "pozycja nie ma znaczenia."}, "correct": "A"}, {"nr": 78, "question": "W razie zwichnięcia stawu należy:", "options": {"A": "nakazać delikatne ruchy czynne, po kilkunastu minutach ból ustąpi.", "B": "nastawić zwichnięcie, podciągając w osi kończyny, staw rozmasować.", "C": "unieruchomić staw w pozycji fizjologicznej.", "D": "unieruchomić staw w pozycji zastanej.", "E": "dla zmniejszenia obrzęku zastosować opatrunek z bandaża elastycznego."}, "correct": "D"}, {"nr": 79, "question": "W przypadku braku szyn Kramera, jedną z możliwych alternatyw zabezpieczenia złamanego podudzia jest:", "options": {"A": "pozostawienie bez zaopatrzenia.", "B": "unieruchomienie w pozycji zastanej przy użyciu kija, deski itp. sprzętu przygodnego.", "C": "owinięcie ściśle bandażem elastycznym.", "D": "przymocowanie do drugiej kończyny.", "E": "przymocowanie do drugiej kończyny przy użyciu przekładki pomiędzy nimi."}, "correct": "D"}, {"nr": 80 "correct": "C"}, {"nr": 96, "question": "Kwalifikowana pierwsza pomoc to określenie czynności podejmowanych wobec osoby w stanie nagłego zagrożenia zdrowotnego przez ratownika. W rozumieniu Ustawy o Państwowym Ratownictwie Medycznym ratownikiem może być: 1) wyłącznie osoba posiadająca dyplom szkoły lub uczelni medycznej. 2) wyłącznie osoba zatrudniona lub pełniąca służbę w jednostkach współpracujących z systemem ratownictwa medycznego lub będąca członkiem tych jednostek. 3) osoba posiadająca ważne zaświadczenie o ukończeniu kursu w zakresie kwalifikowanej pierwszej pomocy i uzyskaniu tytułu ratownika. 4) osoba, której stan zdrowia pozwala na udzielanie kwalifikowanej pierwszej pomocy. 5) osoba posiadająca dyplom ukończenia szkoły medycznej oraz pełną zdolność do czynności prawnych. Prawidłowa odpowiedź to:", "options": {"A": "1,3,4.", "B": "1,2,3.", "C": "3,4.", "D": "3,4,5.", "E": "2,4,5."}, "correct": "C"}, {"nr": 97, "question": "Czy osoba udzielająca pierwszej pomocy, kwalifikowanej pierwszej pomocy oraz podejmująca medyczne czynności ratunkowe korzysta z ochrony przewidzianej prawem?", "options": {"A": "zawarte jest to w prawie zwyczajowym.", "B": "tak, wynika to z Rozporządzenia MSWiA w sprawie szczegółowych zasad organizacji krajowego systemu ratowniczo-gaśniczego z 1999 roku.", "C": "tak, wynika to z Ustawy o Państwowym Ratownictwie Medycznym z 2006 roku.", "D": "nie, wynika to z Kodeksu Karnego.", "E": "nie podlega żadnej ochronie prawnej."}, "correct": "C"}, {"nr": 98, "question": "Pozycja boczna ustalona ma na celu zapewnienie drożnych dróg oddechowych oraz umożliwienie swobodnego wypływu śliny i treści z jamy ustnej. Aby spełniała swoje zadanie muszą być spełnione poniższe warunki, z wyjątkiem:", "options": {"A": "pozycja musi być stabilna.", "B": "musi być możliwe łatwe ocenianie czynności życiowych.", "C": "nie zmienia się raz przyjętego ułożenia poszkodowanego.", "D": "musi być zapewniony swobodny wypływ śliny i innych wydzielin.", "E": "należy unikać ucisku na klatkę piersiową."}, "correct": "C"}, {"nr": 99, "question": "Ratownik jest świadkiem jak osoba, która się krztusi traci przytomność i upada na podłogę. Dzwoni na 112 lub 999, a następnie przystępuje do działania w następującej kolejności:", "options": {"A": "obraca poszkodowanego plecami ku górze i wykonuje 5 uderzeń pomiędzy łopatkami.", "B": "wykonuje parę szybkich i bardzo silnych oddechów usta-usta.", "C": "czeka, aż poszkodowany odzyska przytomność, podnosi go, następnie staje za jego plecami i wykonuje uciśnięcia nadbrzusza.", "D": "usuwa widoczne ciało obce z jamy ustnej, następnie rozpoczyna resuscytacje krążeniowo-oddechową zaczynając od 30 uciśnięć klatki piersiowej.", "E": "siada okrakiem na udach poszkodowanego i wykonuje 5 uciśnięć nadbrzusza."}, "correct": "D"}, {"nr": 100, "question": "24-letnia kobieta połknęła garść pigułek nasennych około 30-45 minut temu. Ratownik znajduje ją nieprzytomną, wykonującą sporadyczne próby łapania powietrza (gasping). Jej tętno jest szybkie i dobrze wyczuwalne. Wskaż właściwe postępowanie:", "options": {"A": "wezwać zespół ratownictwa medycznego i rozpocząć oddechy wspomagane workiem samorozprężalnym z częstotliwością 10 oddechów/minutę.", "B": "rozpocząć uciski klatki piersiowej, a po minucie zadzwonić po zespół ratownictwa medycznego.", "C": "wykonać 2 uciśnięcia nadbrzusza, a następnie położyć poszkodowanego w pozycji bezpiecznej.", "D": "podjąć reanimację przez 1 minutę, a następnie zadzwonić po zespół ratownictwa medycznego.", "E": "wykonać 5 uciśnięć nadbrzusza, a następnie 2 wdechy."}, "correct": "A"}, {"nr": 101, "question": "Ratownik udziela pomocy 6-letniej ofierze wypadku samochodowego, u której podejrzewa uraz kręgosłupa szyjnego. Dziecko jest nieprzytomne, oddycha płytko, z wysiłkiem, słychać charczenie. Częstość oddechów 30/minutę. Aby udrożnić drogi oddechowe powinien wykonać następujący manewr:", "options": {"A": "maksymalnie odchylając głowę do tyłu.", "B": "wysunąć żuchwę na szczękę, odchylając głowę do tyłu.", "C": "wyciągnąć język przed żuchwę.", "D": "usiąść okrakiem na udach ratowanego dziecka i wykonywać uciśnięcia nadbrzusza.", "E": "wykluczyć obecność ciała obcego i wysunąć żuchwę na szczękę jednocześnie stabilizując kręgosłup szyjny, rozważyć założenie rurki ustno-gardłowej."}, "correct": "E"}, {"nr": 102, "question": "Ratownik zbliża się do osoby dorosłej, która leży na podłodze. Nie ma nikogo innego w pobliżu. Wskaż właściwe postępowanie:", "options": {"A": "ocenić przytomność leżącego, sprawdzić oddech, potem wezwać zespół ratownictwa medycznego.", "B": "zadzwonić po zespół ratownictwa medycznego i czekać na karetkę przed domem.", "C": "usunąć ewentualne ciała obce z dróg oddechowych palcem.", "D": "prowadzić RKO przez 5 minut, a potem zadzwonić po zespół ratownictwa medycznego.", "E": "zawołać o pomoc i zacząć oddechy zastępcze."}, "correct": "A"}, {"nr": 103, "question": "Wskaż fałszywe stwierdzenie dotyczące pomocy tonącym:", "options": {"A": "u tonących w pierwszej chwili po wydobyciu należy starać się wylać całą wodę zgromadzoną w układzie oddechowym.", "B": "jeżeli nie ma pewności co do mechanizmu tonięcia, należy założyć kołnierz ortopedyczny.", "C": "również w porze letniej należy poszkodowanemu wydobytemu z wody zapewnić komfort cieplny.", "D": "resuscytację krążeniowo-oddechową u podtopionych należy zacząć od 5 oddechów ratowniczych.", "E": "po sprawdzeniu przytomności i ocenie oddechu, wołać się o pomoc."}, "correct": "A"}, {"nr": 104, "question": "U niektórych poszkodowanych nieprzytomnych, ale oddychających stosuje się pozycję bezpieczną. Wskaż fałszywe stwierdzenie:", "options": {"A": "pozycja ta może zapobiec dostaniu się treści pokarmowej do dróg oddechowych.", "B": "pozycję taką stosuje się ze względu na łatwą kontrolę tętna u poszkodowanego.", "C": "pozycja ta zapewnia udrożnienie górnych dróg oddechowych u osoby nieprzytomnej.", "D": "możliwość ułożenia poszkodowanego w tej pozycji dopuszcza na jego pozostawienie, celem udzielenia pomocy większej liczbie poszkodowanych.", "E": "ułożenie poszkodowanego w tej pozycji nie gwarantuje przeżycia."}, "correct": "B"}, {"nr": 105, "question": "Wskaż czynność, która nie jest elementem procedury udrażniania dróg oddechowych:", "options": {"A": "odessanie płynnej treści z jamy ustnej.", "B": "uciśnięcia nadbrzusza.", "C": "tlenoterapia bierna.", "D": "założenie poszkodowanemu rurki ustno-gardłowej.", "E": "rękoczyn czoło-żuchwa."}, "correct": "C"}, {"nr": 106, "question": "Jakie będzie postępowanie u poszkodowanego, który w wyniku wypadku samochodowego doznał urazu z raną tłuczoną głowy z przejściową utratą świadomości i przebywa nadal w samochodzie?", "options": {"A": "zadzwonić po zespół ratownictwa medycznego i czekać przy samochodzie obserwując poszkodowanego.", "B": "wezwać zespół ratownictwa medycznego, sprawdzić jego podstawowe funkcje życiowe (stan świadomości, oddech, krążenie), a następnie zależnie od sytuacji podjąć decyzję o ewakuacji lub udzieleniu pomocy w samochodzie.", "C": "wyciągnąć poszkodowanego z samochodu i rozpocząć oddechy zastępcze.", "D": "podać tlen i czekać na pomoc.", "E": "rozpocząć resuscytację krążeniowo-oddechową w samochodzie."}, "correct": "B"}, {"nr": 107, "question": "Wskaż prawidłową kolejność czynności, jakie należy wykonać po wezwaniu zespołu ratownictwa medycznego u głęboko nieprzytomnego poszkodowanego, po urazie, bez widocznych obrażeń, z zachowanym własnym charczącym oddechem i oznakami krążenia: 1) okrycie kocem termoizolacyjnym. 2) tlenoterapia bierna (jeżeli są wskazania). 3) założenie rurki ustno-gardłowej (jeżeli toleruje). 4) stabilizacja kręgosłupa szyjnego. 5) udrożnienie dróg oddechowych poprzez wysunięcie żuchwy. Prawidłowa odpowiedź to:", "options": {"A": "2,5,3,1,4.", "B": "1,3,5,4,2.", "C": "3,2,4,1,5.", "D": "5,4,3,2,1.", "E": "4,2,1,3,5."}, "correct": "D"}, {"nr": 108, "question": "Postępowanie z poszkodowanym, który w czasie pożaru wyskoczył z III piętra i doznał urazu kręgosłupa w odcinku piersiowo-lędźwiowym oraz jest nieprzytomny, z zachowanym oddechem i krążeniem, w pierwszej kolejności obejmuje:", "options": {"A": "resuscytacje krążeniowo oddechową (RKO), bo podtrzymanie krążenia jest priorytetem.", "B": "oddech zastępczy z tlenoterapią o przepływie 10 l/minutę.", "C": "ręczną stabilizację kręgosłupa oraz tlenoterapię bierną (jeżeli są wskazania).", "D": "opatrzenie ran i złamań oraz oparzeń.", "E": "szybki transport do szpitala."}, "correct": "C"}, {"nr": 109, "question": "Wskaż czynność ratowniczą priorytetową u osoby nieprzytomnej:", "options": {"A": "opatrzenie rany oparzeniowej.", "B": "udrożnienie dróg oddechowych.", "C": "unieruchomienie złamanej kończyny.", "D": "zaopatrzenie złamania otwartego.", "E": "okrycie kocem termoizolacyjnym."}, "correct": "B"}, {"nr": 110, "question": "Rurkę ustno-gardłową należy zastosować:", "options": {"A": "u poszkodowanych przytomnych, ale po urazach klatki piersiowej.", "B": "u nieprzytomnych z obecną treścią pokarmową w jamie ustnej (dla udrożnienia).", "C": "u nieprzytomnych, aby zmniejszyć zagrożenie niedrożnością dróg oddechowych.", "D": "tylko przy bezdechu u dorosłych, zamiast tlenoterapii.", "E": "zawsze u poszkodowanych przytomnych z urazem twarzoczaszki."}, "correct": "C"}, {"nr": 111, "question": "W postępowaniu z nieprzytomnym dorosłym nieurazowym wezwanie zespołu ratownictwa medycznego powinno nastąpić:", "options": {"A": "po ocenie oddechu.", "B": "jeżeli poszkodowany ma poważne obrażenia.", "C": "nie należy wzywać pomocy, jeżeli strażak-ratownik wie, co należy zrobić z osobą poszkodowaną.", "D": "po pierwszej minucie resuscytacji krążeniowo-oddechowej.", "E": "po udzieleniu pierwszej pomocy i stwierdzeniu, że stan poszkodowanego nie ulega zmianie."}, "correct": "A"}, {"nr": 112, "question": "Podczas oceny stanu neurologicznego poszkodowanego korzystamy ze skali AVPU. Co oznaczają poszczególne litery tej skali:", "options": {"A": "A – alergie, V – wysypki, P – przyjmowane leki, U – uzależnienia.", "B": "A – zorientowany, V – reaguje na głos, P – reaguje na bodźce bólowe, U – brak reakcji.", "C": "A – brak reakcji, V – reaguje na bodźce bólowe, P – reaguje na bodźce słowne, U – zorientowany.", "D": "A – agresywny, V – wulgarny, P – podsypiający, U – unikający kontaktu.", "E": "wszystkie wymienione są fałszywe."}, "correct": "B"}, {"nr": 113, "question": "Właściwy rozmiar rurki ustno-gardłowej dla poszkodowanego nieprzytomnego wyznacza odległość:", "options": {"A": "od brody do obojczyka.", "B": "od płatka ucha do kącika ust.", "C": "od czubka jego nosa do brody.", "D": "rurkę dobiera się tylko u osoby przytomnej.", "E": "rurki nie stosuje się u osób nieprzytomnych."}, "correct": "B"}, {"nr": 114, "question": "Jeśli wystąpią trudności w prowadzeniu skutecznej wentylacji za pomocą maski i worka samorozprężalnego należy: 1) poprawić ułożenie maski na twarzy poszkodowanego. 2) ponownie spróbować udrożnić drogi oddechowe za pomocą odpowiednich rękoczynów. 3) poczekać z decyzją co, do dalszego postępowania na przybycie lekarza, gdyż można zaszkodzić poszkodowanemu. 4) sprawdzić szczelność układu do wentylacji. 5) pomimo trudności kontynuować wentylację, bo każdy manewr sprawdzający to strata czasu. Prawidłowa odpowiedź to:", "options": {"A": "2,4,5.", "B": "1,3,5.", "C": "2,3,4.", "D": "3,4,5.", "E": "1,2,4."}, "correct": "E"}, {"nr": 115, "question": "W czasie prowadzenia u poszkodowanego oddechu zastępczego przy użyciu maski twarzowej i worka samorozprężalnego, należy pamiętać o dołączeniu do zestawu rezerwuaru tlenowego. Ma to na celu:", "options": {"A": "zwiększenie stężenia tlenu w mieszaninie oddechowej z 21% do około 40-50 %.", "B": "utrzymanie przy właściwym dopływie tlenu wysokiego stężenia tlenu w mieszaninie oddechowej nawet na poziomie bliskim 99% (dbając o szczelne przyłożenie maski oddechowej do twarzy poszkodowanego).", "C": "ułatwienie prowadzenia oddechu zastępczego (w takim przypadku nie trzeba dbać o szczelne przyłożenie maski oddechowej do twarzy poszkodowanego).", "D": "stworzenie wystarczającej rezerwy tlenowej na czas, nawet do 4 minut po odłączeniu przewodu łączącego układ z butlą tlenową (co jest niezwykle przydatne, np. przy ewakuacji poszkodowanego).", "E": "podanie prawidłowej ilości tlenu przy jednocześnie występujących trudnościach z utrzymaniem drożności dróg oddechowych poszkodowanego."}, "correct": "B"}, {"nr": 116, "question": "Wskaż prawdziwe stwierdzenie dotyczące relacji między resuscytacją krążeniowo- oddechową (RKO) i automatyczną defibrylacją zewnętrzną (AED):", "options": {"A": "poszkodowany z ostrym zawałem serca potrzebuje RKO, a nie AED.", "B": "natychmiastowa RKO i wczesna defibrylacja (w ciągu 4-5 minut) może znacznie zwiększyć liczbę uratowanych poszkodowanych z nagłym zatrzymaniem krążenia.", "C": "jeśli defibrylacja była wykonana w ciągu 10 minut, RKO nie ma sensu.", "D": "jeśli RKO było podjęte natychmiast, defibrylacja nie jest potrzebna.", "E": "RKO należy wdrożyć dopiero po podłączeniu AED i przeprowadzonej analizie przez defibrylator."}, "correct": "B"}, {"nr": 117, "question": "Na jakiej podstawie należy podjąć decyzję o wdrożeniu resuscytacji krążeniowo- oddechowej:", "options": {"A": "szerokości źrenic poszkodowanego.", "B": "obecności tętna na obwodzie.", "C": "utracie przytomności i stwierdzeniu braku oddechu.", "D": "bladości i ochłodzeniu powłok skórnych.", "E": "obecności sinicy."}, "correct": "C"}, {"nr": 118, "question": "U dorosłych poszkodowanych prowadzenie resuscytacji krążeniowo-oddechowej w obserwowanym zatrzymaniu krążenia rozpoczyna się od:", "options": {"A": "2 oddechów ratowniczych oraz jak najszybszym użyciu AED.", "B": "5 oddechów zastępczych.", "C": "15 uciśnięć klatki piersiowej oraz jak najszybszym użyciu AED.", "D": "30 uciśnięć klatki piersiowej (1 ratownik) lub 15 uciśnięć klatki piersiowej (2 ratowników).", "E": "30 uciśnięć klatki piersiowej oraz jak najszybszym użyciu AED."}, "correct": "E"}, {"nr": 119, "question": "W celu uciskania klatki piersiowej podczas resuscytacji krążeniowo-oddechowej ręce układa się:", "options": {"A": "na środku klatki piersiowej poszkodowanego.", "B": "na górnej ¼ części mostka poszkodowanego.", "C": "w górnej ⅓ części mostka poszkodowanego.", "D": "1 cm powyżej łuku międzyżebrowego ratowanego.", "E": "na lewo od środka mostka nad sercem ratowanego."}, "correct": "A"}, {"nr": 120, "question": "Stosunek uciśnięć klatki piersiowej do oddechów ratowniczych u osoby dorosłej powinien wynosić:", "options": {"A": "50:2.", "B": "30:2.", "C": "15:2.", "D": "15:1.", "E": "10:1."}, "correct": "B"}, {"nr": 121, "question": "Podczas prowadzenia podstawowych czynności resuscytacyjnych ocenę stanu poszkodowanego wykonuje się:", "options": {"A": "co jedną minutę.", "B": "co 5 cykli (30 uciśnięć klatki piersiowej i 2 oddechy zastępcze).", "C": "jeżeli u poszkodowanego pojawią się oznaki życia.", "D": "przed naklejeniem elektrod AED.", "E": "po około 15 minutach resuscytacji krążeniowo-oddechowej."}, "correct": "C"}, {"nr": 122, "question": "Jeżeli pierwszy oddech ratowniczy nie powoduje uniesienia się klatki piersiowej, należy wykonać następujące czynności, z wyjątkiem:", "options": {"A": "wykonania nie więcej niż dwóch prób podania oddechów ratowniczych.", "B": "wygarnięcia „na ślepo\" ewentualnych ciał obcych, będących przyczyną niedrożności dróg oddechowych.", "C": "usunięcia tylko widocznych ciał obcych.", "D": "sprawdzenia czy udrożnienie dróg oddechowych jest poprawnie wykonane.", "E": "sprawdzenia czy nie występują uszkodzenia (bądź anomalie) klatki piersiowej, uniemożliwiające jej prawidłowe unoszenie."}, "correct": "B"}, {"nr": 123, "question": "W przypadku stwierdzenia u poszkodowanego objawów łagodnej niedrożności dróg oddechowych spowodowanej prawdopodobnie obecnością ciała obcego, działania ratownika polegają na:", "options": {"A": "zachęcaniu poszkodowanego do kaszlu.", "B": "wykonaniu 5 uderzeń w okolicę międzyłopatkową.", "C": "wykonaniu 5 uderzeń w okolicę międzyłopatkową, a następnie 5 uciśnięć nadbrzusza.", "D": "wykonaniu 5 uciśnięć nadbrzusza.", "E": "rytmicznym uderzaniu poszkodowanego w okolicę międzyłopatkową, na przemian z uciskaniem nadbrzusza."}, "correct": "A"}, {"nr": 124, "question": "Worek samorozprężalny posiada następujące zalety, z wyjątkiem:", "options": {"A": "może być podłączony do maski twarzowej, rurki dotchawiczej lub alternatywnych przyrządów do udrażniania dróg oddechowych.", "B": "jest zalecany do stosowania w przypadku zatrucia wziewnego", "C": "przy zastosowaniu maski, rezerwuaru tlenowego i przepływu tlenu 12-16 l/min. pozwala osiągnąć wdechowe stężenie tlenu nie wyższe niż 75%.", "D": "zabezpiecza przed zakażeniem ratownika prowadzącego wentylację.", "E": "w razie uszkodzenia mechanicznego worka, można go zastosować tylko do tlenoterapii biernej."}, "correct": "C"}, {"nr": 125, "question": "Ratownik wykonuje resuscytację krążeniowo-oddechową z udziałem kolegi. Jak często powinien uciskać klatkę piersiową?", "options": {"A": "wystarczająco szybko by utrzymać różowy kolor skóry twarzy.", "B": "z częstością zależną od wielkości klatki piersiowej.", "C": "poniżej 100 razy/minutę.", "D": "50-60 razy/minutę.", "E": "100-120 razy/minutę."}, "correct": "E"}, {"nr": 126, "question": "Ratownik wykonuje resuscytację u 5-letniego dziecka z zatrzymaniem czynności serca. Którą z technik ucisku klatki piersiowej powinien zastosować?", "options": {"A": "uciskanie jedną lub dwoma dłońmi (zależnie od gabarytów poszkodowanego), z częstością 100-120 razy/minutę.", "B": "uciskanie dwoma dłońmi tak, by odchylenie mostka nie przekraczało około 1,5 cm.", "C": "uciskanie dolnego odcinka mostka tylko dwoma palcami.", "D": "wykonanie 15 uciśnięć, a następnie 3 wolnych wdechów.", "E": "wykonywanie uciśnięć jedną ręką z częstością około 100 razy/minutę."}, "correct": "A"}, {"nr": 127, "question": "Rodzic bawi się z dziećmi w pokoju, w którym jest dużo zabawek składających się z drobnych części. Nagle 8-miesięczne niemowlę zaczyna się dusić. Słychać świst towarzyszący każdej próbie oddechu. Jego kaszel jest cichy i nieefektywny, zaczyna sinieć. U niemowlęcia doszło do:", "options": {"A": "ostrego ataku astmy oskrzelowej.", "B": "napadu padaczki.", "C": "obrzęku strun głosowych w przebiegu infekcji.", "D": "całkowitej niedrożności dróg oddechowych spowodowanej ciałem obcym.", "E": "częściowej niedrożności dróg oddechowych."}, "correct": "D"}, {"nr": 128, "question": "Kobieta upadła na korytarzu w pracy. Podchodząc do poszkodowanej ratownik stwierdził, że jest nieprzytomna. Udrożnił drogi oddechowe. Aby ocenić czy nieprzytomna oddycha należy:", "options": {"A": "przyłożyć lusterko do ust nieprzytomnej.", "B": "zbliżyć do ust i nosa poszkodowanej kartkę papieru lub piórko.", "C": "ocenić ruchy tchawicy (jabłko Adama).", "D": "przez 10 sekund pochylając się uchem nad ustami i nosem poszkodowanej, należy starać się usłyszeć oddech i wyczuć go na swoim policzku, jednocześnie obserwując ruchy klatki piersiowej.", "E": "obserwować przez 5 sekund czy unosi się klatka piersiowa."}, "correct": "D"}, {"nr": 129, "question": "Czynności resuscytacyjne (uciski klatki piersiowej i oddechy) należy przerwać w następującej sytuacji:", "options": {"A": "po około 10-15 minutach prowadzenia czynności ratowniczych.", "B": "odzyskania prawidłowego oddechu przez poszkodowanego, przybycia na miejsce zdarzenia zespołu ratownictwa medycznego i przejęcia poszkodowanego, fizycznego wyczerpania ratownika, niebezpieczeństwa.", "C": "w bardzo niesprzyjających warunkach atmosferycznych.", "D": "w przypadku wydobycia poszkodowanego z zimnej wody, który po 10 minutach akcji nie daje oznak życia.", "E": "po przybyciu na miejsce innych służb ratowniczych."}, "correct": "B"}, {"nr": 130, "question": "U nieprzytomnego poszkodowanego nie stwierdzono oddechu, ani tętna. Po rozpoczęciu resuscytacji krążeniowo-oddechowej (RKO) stwierdzono, że doszło u niego do złamania kilku żeber. W takiej sytuacji należy:", "options": {"A": "przerywać RKO i wykonać tylko oddechy ratownicze.", "B": "rozpocząć bezpośrednie uciski serca .", "C": "nadal prowadzić podjęte działania ratownicze (resuscytacje krążeniowo-oddechową) zgodnie z algorytmem.", "D": "w pierwszej kolejności owinąć klatkę piersiową poszkodowanego bandażem elastycznym, dopiero wówczas rozpocząć wykonywanie RKO.", "E": "kontynuować podjęte czynności ratownicze, omijając uszkodzoną okolicę."}, "correct": "C"}, {"nr": 131, "question": "Kierownik firmy jest 50-letnim otyłym mężczyzną. Do tej pory nie chorował na serce. Aktualnie zaczął uskarżać się na nagły, ostry ból w klatce piersiowej, promieniujący do lewej ręki i żuchwy. Wskaż właściwe postępowanie:", "options": {"A": "zadzwonić po zespół ratownictwa medycznego.", "B": "podać nitroglicerynę pod język (1 tabletkę).", "C": "podać aspirynę 160-300 mg, jeżeli nie jest uczulony.", "D": "ułożyć mężczyznę w dogodnej pozycji (opcjonalnie pozycja półsiedząca) i wezwać zespół ratownictwa medycznego.", "E": "prawdziwe są odpowiedzi C i D."}, "correct": "E"}, {"nr": 132, "question": "Ratownik wykonuje resuscytacje krążeniowo-oddechową (RKO) u półrocznego dziecka z zatrzymaniem czynności serca. Którą technikę ucisków klatki piersiowej powinien zastosować? 1) uciskanie klatki piersiowej jedną dłonią z częstotliwością około 100 uciśnięć/minutę. 2) uciskanie klatki piersiowej dwoma palcami jednej ręki tak, by ugiąć dolną połowę mostka na głębokość około 4 cm. 3) uciskanie górnego odcinka mostka dwoma palcami; 4) uciskanie klatki piersiowej 15 razy, a następnie wykonanie 3 wolnych wdechów; 5) uciskanie klatki piersiowej z częstotliwością około 100-120 razy/minutę. Prawidłowa odpowiedź to:", "options": {"A": "1,5.", "B": "2,5.", "C": "3,4.", "D": "1,3.", "E": "4,5."}, "correct": "B"}, {"nr": 133, "question": "Szybkie badanie urazowe poszkodowanego w zdarzeniu pojedynczym nie powinno trwać dłużej niż:", "options": {"A": "1 minutę.", "B": "2 minuty.", "C": "5 minut.", "D": "10 minut.", "E": "15 minut."}, "correct": "B"}, {"nr": 134, "question": "Przed przystąpieniem do badania wstępnego u poszkodowanych z obrażeniami pourazowymi z zachowanymi czynnościami życiowymi należy:", "options": {"A": "unieruchomić złamaną kończynę.", "B": "stabilizować ręcznie kręgosłup szyjny.", "C": "podać tlen.", "D": "wykonać resuscytacje krążeniowo-oddechową (RKO).", "E": "wykonać manewr Sellicka."}, "correct": "B"}, {"nr": 135, "question": "Poszkodowanych z obrażeniami pourazowymi obraca się podczas wymiotów:", "options": {"A": "na komendę prowadzącego wstępne badanie urazowe.", "B": "tylko po założeniu kołnierza ortopedycznego.", "C": "po zastosowaniu manewru Sellicka.", "D": "w sposób zsynchronizowany na komendę ratownika trzymającego głowę.", "E": "w inny niż wymienione sposób."}, "correct": "D"}, {"nr": 136, "question": "Prowadzący wstępne badanie urazowe podchodzi w miarę możliwości do poszkodowanego:", "options": {"A": "od strony jego nóg.", "B": "od strony jego głowy.", "C": "od strony lewej.", "D": "od strony prawej.", "E": "nie ma znaczenia, z której strony podejdzie."}, "correct": "A"}, {"nr": 137, "question": "Ocenę oddechu poszkodowanego prowadzi się przez:", "options": {"A": "10 sek.", "B": "15 sek.", "C": "25 sek.", "D": "60 sek.", "E": "90 sek."}, "correct": "A"}, {"nr": 138, "question": "Kiedy można przerwać wstępne badanie urazowe?", "options": {"A": "gdy wystąpi niedrożność dróg oddechowych i zatrzymanie krążenia.", "B": "gdy występuje masywny krwotok.", "C": "tylko po założeniu kołnierza ortopedycznego.", "D": "prawdziwe są odpowiedzi A i D.", "E": "prawdziwe są odpowiedzi A i D."}, "correct": "D"}, {"nr": 139, "question": "Podczas wstępnego badania urazowego przy poszkodowanym powinno być w miarę możliwości:", "options": {"A": "2 ratowników.", "B": "3 ratowników.", "C": "4 ratowników.", "D": "5 ratowników.", "E": "6 ratowników."}, "correct": "B"}, {"nr": 140, "question": "Podczas wstępnego badania urazowego poszkodowanego, który leży na brzuchu, ale ma zachowany prawid const DEFAULT = {start: "2026-10-05", done: {}, watched: {}, tasks: {}, wrong: {}, best: {}, exams: []};

function load(){ try { const r = localStorage.getItem("kpp-state"); if (r) return Object.assign(structuredClone(DEFAULT), JSON.parse(r)); } catch(e){} return structuredClone(DEFAULT); }
let dbDoc = null, saveTimer = null;
function save(){
  try { localStorage.setItem("kpp-state", JSON.stringify(S)); } catch(e){}
  if (!dbDoc) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await dbDoc.set({state: JSON.stringify(S), updated: new Date().toISOString()}); setSync("Postęp zsynchronizowany z Twoim kontem"); }
    catch(e){ setSync("Nie udało się zapisać na koncie, postęp jest w tej przeglądarce"); }
  }, 700);
}
function setSync(t){ document.getElementById("sync").textContent = t; }
(async () => {
  try {
    if (!window.claude?.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    dbDoc = db.doc("data/users/" + id + "/kpp/progress");
    const snap = await dbDoc.get();
    if (snap.exists) {
      const remote = JSON.parse(snap.data().state || "{}");
      S = Object.assign(structuredClone(DEFAULT), remote);
      try { localStorage.setItem("kpp-state", JSON.stringify(S)); } catch(e){}
      render();
    } else if (Object.keys(S.done).length || S.exams.length || Object.keys(S.wrong).length) save();
    setSync("Postęp zsynchronizowany z Twoim kontem");
  } catch(e) {}
})();

const h = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, val] of Object.entries(attrs)) { if (val == null) continue; if (k === "class") e.className = val; else if (k.startsWith("on")) e[k] = val; else if (k === "html") e.innerHTML = val; else e.setAttribute(k, val); } kids.flat().forEach(c => c != null && e.append(c.nodeType ? c : document.createTextNode(c))); return e; };

function renderPlan(v){

    v.append(h("div", {class: "today"},

    S.exams.slice(-8).forEach(e => t.append(h("tr", {}, h("td", {}, new Date(e.date).toLocaleString("pl-PL", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"})), h("td", {class: "mono"}, e.pct + "% (" + e.ok + "/" + e.n + ")"))));

function transferUI(){
  const ta = h("textarea", {id: "xfer", rows: "3", style: "width:100%;font:500 .8rem var(--font-mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px", placeholder: "Tu pojawi się kod albo wklej kod z innego urządzenia"});

    ta.value = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    ta.select();
    try { await navigator.clipboard.writeText(ta.value); msg.textContent = "Kod skopiowany. Wklej go na drugim urządzeniu."; } catch(e) { msg.textContent = "Zaznaczyłem kod, skopiuj go ręcznie."; }
  }}, "Eksportuj postęp");
  const imp = h("button", {class: "btn", onclick: () => {
    try { const o = JSON.parse(decodeURIComponent(escape(atob(ta.value.trim())))); if (!o || typeof o.done !== "object") throw 0; S = Object.assign(structuredClone(DEFAULT), o); save(); render(); }
    catch(e) { msg.textContent = "To nie jest poprawny kod postępu. Skopiuj go jeszcze raz w całości."; }

}

  const sc = h("div", {class: "block"}, h("h3", {}, "3. Scenariusz"), h("p", {style: "margin:0;max-width:68ch"}, l.scenario[0]));

  } else {

  fin.append(S.done[i]
    ? h("button", {class: "btn", onclick: () => { delete S.done[i]; save(); render(); }}, "Oznacz jako niezrobioną")
    : h("button", {class: "btn primary", onclick: () => { S.done[i] = new Date().toISOString().slice(0, 10); save(); go("plan"); }}, "Zakończ lekcję"));
  if (i > 0) fin.append(h("button", {class: "btn", onclick: () => go("lesson", i - 1)}, "← Poprzednia"));

function quizUI(st, onFinish, opts = {}){
  const box = h("div", {class: "quiz"});
  const draw = () => {
    box.innerHTML = "";
    if (!st.ids.length) { box.append(h("div", {class: "empty"}, opts.emptyText || "Brak pytań.")); return; }
    if (!st.started) {
      box.append(h("p", {style: "margin:0"}, st.ids.length + " pytań. Po każdej odpowiedzi od razu widzisz, czy była dobra. Błędne trafiają do zakładki „Moje błędy”."),
        h("div", {class: "row"}, h("button", {class: "btn primary", onclick: () => { st.started = true; draw(); }}, "Rozpocznij quiz")));
      return;
    }
    if (st.pos >= st.ids.length) {
      const pct = Math.round(st.ok / st.ids.length * 100);
      onFinish && onFinish(pct);
      box.append(h("div", {class: "result"}, h("span", {class: "big mono", style: "color:" + (pct >= 80 ? "var(--ok)" : pct >= 70 ? "var(--warn)" : "var(--bad)")}, pct + "%"),
        h("div", {}, h("strong", {}, st.ok + " z " + st.ids.length + " poprawnie"), h("div", {class: "muted"}, pct >= 80 ? "Dobrze. Ta lekcja jest opanowana." : "Wróć do punktów „Zapamiętaj” i powtórz quiz."))),
        h("div", {class: "row"}, h("button", {class: "btn", onclick: () => { st.ids = shuffle(st.ids); st.pos = 0; st.ok = 0; st.answered = null; draw(); }}, "Powtórz quiz")));
      return;
    }
    const q = QBY[st.ids[st.pos]];
    box.append(h("div", {class: "qhead"}, h("span", {class: "mono"}, "Pytanie " + (st.pos + 1) + " / " + st.ids.length), h("span", {class: "mono"}, "nr " + q.nr + " w bazie · " + st.ok + " dobrze")));
    box.append(h("div", {class: "qtext"}, q.question));
    const os = h("div", {class: "opts"});
    Object.entries(q.options).forEach(([k, txt]) => {
      const b = h("button", {class: "opt", onclick: () => answer(k)}, h("b", {}, k), h("span", {}, txt));
      if (st.answered) { b.disabled = true; if (k === q.correct) b.classList.add("right"); else if (k === st.answered) b.classList.add("wrong"); }
      os.append(b);
    });
    box.append(os);
    if (st.answered) {
      if (NOTES[q.nr]) box.append(h("div", {class: "note"}, NOTES[q.nr]));
      box.append(h("div", {class: "row"}, h("strong", {style: "color:" + (st.answered === q.correct ? "var(--ok)" : "var(--bad)")}, st.answered === q.correct ? "Dobrze" : "Poprawna odpowiedź: " + q.correct),
        h("button", {class: "btn primary", onclick: () => { st.pos++; st.answered = null; draw(); }}, st.pos + 1 < st.ids.length ? "Dalej" : "Wynik")));
    }
    function answer(k){
      if (st.answered) return;
      st.answered = k;
      if (k === q.correct) { st.ok++; if (opts.clearOnRight) delete S.wrong[q.nr]; }
      else S.wrong[q.nr] = (S.wrong[q.nr] || 0) + 1;
      save(); document.getElementById("errCount").textContent = Object.keys(S.wrong).length; draw();
    }
  };
  draw();
