}

let errState = null;
function renderErrors(v){
  const ids = Object.keys(S.wrong).map(Number);
  v.append(h("div", {class: "lhead", style: "display:grid;gap:8px;margin-bottom:18px"}, h("h2", {}, "Moje błędy"),
    h("p", {class: "goal", style: "margin:0"}, "Tu trafia każde pytanie, na które odpowiesz źle. Znika, gdy odpowiesz na nie dobrze w tej zakładce.")));
  if (!ids.length) { v.append(h("div", {class: "empty"}, "Na razie nie ma tu pytań. Zrób quiz z dowolnej lekcji.")); return; }
  const byL = {}; ids.forEach(n => { const l = LESSON_OF[n]; byL[l] = (byL[l] || 0) + 1; });
  const weak = Object.entries(byL).sort((a, b) => b[1] - a[1]).slice(0, 4);
  v.append(h("div", {class: "block", style: "margin-bottom:18px"}, h("h3", {}, "Najwięcej błędów w lekcjach"),
    h("div", {class: "row"}, weak.map(([l, c]) => h("button", {class: "btn", onclick: () => go("lesson", +l)}, (+l + 1) + ". " + LESSONS[l].title + " · " + c)))));
  if (!errState || errState.pos >= errState.ids.length && errState.done) errState = {ids: shuffle(ids), pos: 0, ok: 0, answered: null, started: true};
  const b = h("div", {class: "block"});
  b.append(quizUI(errState, () => { errState.done = true; }, {clearOnRight: true}));
  v.append(b);
}

function renderExam(v){
  v.append(h("div", {class: "lhead", style: "display:grid;gap:8px;margin-bottom:18px"}, h("h2", {}, "Egzamin próbny"),
    h("p", {class: "goal", style: "margin:0"}, "30 losowych pytań z całej bazy, 30 minut, jedna poprawna odpowiedź. Próg zaliczenia 70%. Wynik zobaczysz na końcu, razem z listą błędów.")));
  const b = h("div", {class: "block"}); v.append(b);
  if (!examState) {
    b.append(h("div", {class: "row"}, h("button", {class: "btn primary", onclick: () => { examState = {ids: shuffle(POOL).slice(0, 30), pos: 0, ans: {}, t0: Date.now()}; render(); }}, "Rozpocznij egzamin")),
      S.exams.length ? h("p", {class: "muted", style: "margin:0"}, "Ostatni wynik: " + S.exams[S.exams.length - 1].pct + "%") : null);
    return;
  }
  const st = examState;
  if (st.finished) { b.append(examSummary(st)); return; }
  const left = Math.max(0, 1800 - Math.floor((Date.now() - st.t0) / 1000));
  if (left === 0) { finishExam(); return; }
  const q = QBY[st.ids[st.pos]];
  const timer = h("span", {class: "mono", id: "timer"}, mmss(left));
  b.append(h("div", {class: "qhead"}, h("span", {class: "mono"}, "Pytanie " + (st.pos + 1) + " / 30 · odpowiedziano " + Object.keys(st.ans).length), timer));
  b.append(h("div", {class: "qtext"}, q.question));
  const os = h("div", {class: "opts"});
  Object.entries(q.options).forEach(([k, txt]) => {
    const bt = h("button", {class: "opt" + (st.ans[q.nr] === k ? " right" : ""), onclick: () => { st.ans[q.nr] = k; if (st.pos < 29) st.pos++; render(); }}, h("b", {}, k), h("span", {}, txt));
    os.append(bt);
  });
  b.append(os);
  b.append(h("div", {class: "row"},
    h("button", {class: "btn", disabled: st.pos === 0 ? "" : null, onclick: () => { st.pos--; render(); }}, "← Wstecz"),
    h("button", {class: "btn", disabled: st.pos === 29 ? "" : null, onclick: () => { st.pos++; render(); }}, "Dalej →"),
    h("button", {class: "btn primary", onclick: finishExam}, "Zakończ i sprawdź")));
  clearInterval(window._tick);
  window._tick = setInterval(() => { const el = document.getElementById("timer"); if (!el || !examState || examState.finished) return clearInterval(window._tick); const l2 = Math.max(0, 1800 - Math.floor((Date.now() - examState.t0) / 1000)); el.textContent = mmss(l2); if (l2 === 0) finishExam(); }, 1000);
}
function finishExam(){
  const st = examState; if (!st || st.finished) return;
  clearInterval(window._tick);
  st.finished = true; st.ok = st.ids.filter(n => st.ans[n] === QBY[n].correct).length;
  st.ids.forEach(n => { if (st.ans[n] !== QBY[n].correct) S.wrong[n] = (S.wrong[n] || 0) + 1; });
  st.pct = Math.round(st.ok / 30 * 100);
  S.exams.push({date: new Date().toISOString(), ok: st.ok, n: 30, pct: st.pct});
  save(); render();
}
function examSummary(st){
  const box = h("div", {class: "quiz"});
  const pass = st.pct >= 70;
  box.append(h("div", {class: "result"}, h("span", {class: "big mono", style: "color:" + (st.pct >= 80 ? "var(--ok)" : pass ? "var(--warn)" : "var(--bad)")}, st.pct + "%"),
    h("div", {}, h("strong", {}, st.ok + " / 30 · " + (pass ? "zaliczony" : "niezaliczony")), h("div", {class: "muted"}, "Czas: " + mmss(Math.min(1800, Math.floor((Date.now() - st.t0) / 1000)))))));
  const wrong = st.ids.filter(n => st.ans[n] !== QBY[n].correct);
  if (wrong.length) {
    const byL = {}; wrong.forEach(n => byL[LESSON_OF[n]] = (byL[LESSON_OF[n]] || 0) + 1);
    box.append(h("h3", {}, "Do powtórki"), h("div", {class: "row"}, Object.entries(byL).sort((a, b) => b[1] - a[1]).map(([l, c]) => h("button", {class: "btn", onclick: () => go("lesson", +l)}, (+l + 1) + ". " + LESSONS[l].title + " · " + c))));
    box.append(h("h3", {}, "Błędne odpowiedzi"));
    wrong.forEach(n => { const q = QBY[n]; box.append(h("div", {class: "block", style: "padding:12px 14px"},
      h("div", {class: "qtext", style: "font-size:1rem"}, q.question),
      h("div", {}, h("span", {style: "color:var(--bad)"}, "Twoja: " + (st.ans[n] ? st.ans[n] + ". " + q.options[st.ans[n]] : "brak odpowiedzi"))),
      h("div", {}, h("span", {style: "color:var(--ok)"}, "Poprawna: " + q.correct + ". " + q.options[q.correct])),
      NOTES[n] ? h("div", {class: "note"}, NOTES[n]) : null)); });
  }
  box.append(h("div", {class: "row"}, h("button", {class: "btn primary", onclick: () => { examState = null; render(); }}, "Nowy egzamin")));
  return box;
}
const mmss = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------- metronom RKO ----------
function metronomeUI(){
  const beat = h("span", {class: "beat mono"}, "0");
  const pulse = h("span", {class: "pulse"});
  const bpm = h("select", {id: "bpm", class: "btn", style: "padding:6px 8px"}, [100, 110, 120].map(x => h("option", {value: x}, x + " / min")));
  bpm.value = "110";
  const btn = h("button", {class: "btn primary"}, "Start metronomu");
  btn.onclick = () => { if (metro) { stopMetro(); btn.textContent = "Start metronomu"; return; } startMetro(+bpm.value, beat, pulse); btn.textContent = "Stop"; };
  return h("div", {class: "metro"}, btn, bpm, pulse, beat, h("span", {class: "muted"}, "licznik do 30, potem 2 wdechy (pauza ok. 5 s)"));
}
function startMetro(rate, beat, pulse){
  let ctx; try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  let n = 0, pause = 0;
  const tick = () => {
    if (pause > 0) { pause--; beat.textContent = "W"; return; }
    n++; beat.textContent = n;
    pulse.classList.add("on"); setTimeout(() => pulse.classList.remove("on"), 90);
    if (ctx) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = n === 30 ? 1320 : 880; g.gain.setValueAtTime(.25, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .07); o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + .08); }
    if (n === 30) { n = 0; pause = Math.round(5 * rate / 60); }
  };
  metro = {id: setInterval(tick, 60000 / rate), ctx};
}
function stopMetro(){ if (metro) { clearInterval(metro.id); try { metro.ctx && metro.ctx.close(); } catch(e) {} metro = null; } }

render();
