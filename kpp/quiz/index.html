  b.append(h("div", {class: "qhead"}, h("span", {class: "mono"}, "Pytanie " + (st.pos + 1) + " / " + st.ids.length),
    h("span", {}, powtorka ? h("span", {class: "tag"}, "jeszcze raz w tej serii") : p.n ? (doPoprawy(nr) ? h("span", {class: "tag"}, "było źle " + (p.n - p.ok) + "×") : h("span", {class: "tag ok"}, "było dobrze " + p.ok + "×")) : "nowe",
      h("span", {class: "mono"}, "  nr " + nr))));
  b.append(h("div", {class: "qtext"}, q.question));
  b.append(opcje(q, {wybrana: st.odp, pokazKlucz: !!st.odp, onclick: st.odp ? null : k => {
    st.odp = k;
    const dobrze = zapisz(nr, k);
    if (dobrze && !powtorka) st.ok++;
    // błędne pytanie wraca jeszcze raz pod koniec tej serii (raz)
    if (!dobrze && !powtorka) { st.ids.push(nr); st.powt[st.ids.length - 1] = 1; }
    st.pokaz = !dobrze;
    render();
  }}));
  if (st.odp) {
    const dobrze = st.odp === q.correct;
    const whyBox = h("div", {}); if (st.pokaz) whyBox.append(wyjasnienie(q));
    b.append(h("div", {class: "row spread"}, h("strong", {style: "color:" + (dobrze ? "var(--ok)" : "var(--bad)")}, dobrze ? "Dobrze" : "Źle. Poprawna odpowiedź: " + q.correct),
      h("div", {class: "row"},
        st.pokaz ? null : h("button", {class: "btn", onclick: () => { st.pokaz = true; render(); }}, "Dlaczego?"),
        h("button", {class: "btn primary", onclick: () => { st.pos++; st.odp = null; st.pokaz = false; render(); }}, st.pos + 1 < st.ids.length ? "Dalej" : "Wynik"))), whyBox);
  }
}

// --- symulacja ---
let examState = null; try { examState = JSON.parse(ls.get(LSX) || "null"); } catch (e) {}
const zapiszEgzamin = () => examState && !examState.fin ? ls.set(LSX, JSON.stringify(examState)) : ls.del(LSX);
function renderExam(v) {
  clearInterval(window._tick);
  const b = h("div", {class: "block quiz"}); v.append(b);
  if (!examState) {
    b.append(h("h3", {}, "Symulacja egzaminu"),
      h("p", {style: "margin:0"}, EX_N + " pytań z całej bazy (" + POOL.length + "), " + EX_MIN + " minut. Możesz wracać do pytań i zmieniać odpowiedzi. Wynik, poprawne odpowiedzi i wyjaśnienia zobaczysz po zakończeniu, a błędy trafią do nauki."),
      h("div", {class: "row"}, h("button", {class: "btn primary", onclick: () => { examState = {ids: shuffle(POOL).slice(0, EX_N), pos: 0, ans: {}, t0: Date.now()}; zapiszEgzamin(); render(); }}, "Start")));
    return;
  }
  const st = examState;
  if (st.fin) return podsumowanie(b, st);
  const left = () => Math.max(0, EX_MIN * 60 - Math.floor((Date.now() - st.t0) / 1000));
  if (!left()) return zakoncz();
  const fmt = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  const timer = h("span", {class: "timer", id: "timer"}, fmt(left()));
  const nOdp = Object.keys(st.ans).length;
  b.append(h("div", {class: "row spread"}, h("span", {class: "mono muted"}, "Pytanie " + (st.pos + 1) + " / " + st.ids.length + " · odpowiedzi " + nOdp), timer));
  const q = QBY[st.ids[st.pos]];
  b.append(h("div", {class: "qtext"}, q.question));
  b.append(opcje(q, {wybrana: st.ans[st.pos], onclick: k => { st.ans[st.pos] = k; zapiszEgzamin(); if (st.pos + 1 < st.ids.length) st.pos++; render(); }}));
  b.append(h("div", {class: "row spread"},
    h("div", {class: "row"}, h("button", {class: "btn", disabled: st.pos ? null : "", onclick: () => { st.pos--; zapiszEgzamin(); render(); }}, "← Wstecz"),
      h("button", {class: "btn", disabled: st.pos + 1 < st.ids.length ? null : "", onclick: () => { st.pos++; zapiszEgzamin(); render(); }}, "Dalej →")),
    h("button", {class: "btn primary", onclick: () => { if (nOdp < st.ids.length && !confirm("Bez odpowiedzi: " + (st.ids.length - nOdp) + ". Zakończyć test?")) return; zakoncz(); }}, "Zakończ test")));
  const g = h("div", {class: "navgrid"});
  st.ids.forEach((_, i) => g.append(h("button", {class: (st.ans[i] ? "done" : "") + (i === st.pos ? " cur" : ""), onclick: () => { st.pos = i; zapiszEgzamin(); render(); }}, i + 1)));
  b.append(g);
  window._tick = setInterval(() => {
    const el = document.getElementById("timer"); if (!el || current !== "exam" || !examState || examState.fin) return clearInterval(window._tick);
    const l = left(); el.textContent = fmt(l); el.classList.toggle("low", l < 300);
    if (!l) { clearInterval(window._tick); zakoncz(); }
  }, 1000);
}
function zakoncz() {
  const st = examState; if (!st || st.fin) return;
  st.fin = true; st.ok = 0; st.zle = [];
  st.ids.forEach((nr, i) => { if (zapisz(nr, st.ans[i] || null)) st.ok++; else st.zle.push(nr); });
  st.pct = Math.round(st.ok / st.ids.length * 100);
  st.sek = Math.min(EX_MIN * 60, Math.round((Date.now() - st.t0) / 1000));
  stan["x" + st.t0] = {ok: st.ok, n: st.ids.length, pct: st.pct, sek: st.sek, zle: st.zle, t: Date.now()};
  zmiana(); zapiszEgzamin(); render();
}
function podsumowanie(b, st) {
  b.append(h("div", {class: "result"}, h("span", {class: "big mono", style: "color:" + kolor(st.pct)}, st.pct + "%"),
    h("div", {}, h("strong", {}, st.ok + " z " + st.ids.length + " · " + (st.pct >= PROG ? "zaliczony" : "niezaliczony") + " (próg " + PROG + "%)"),
      h("div", {class: "muted"}, "Czas " + Math.round(st.sek / 60) + " min. " + (st.zle.length ? st.zle.length + " błędnych pytań trafiło do nauki." : "Bez błędów.")))),
    h("div", {class: "row"}, h("button", {class: "btn primary", onclick: () => { examState = null; render(); }}, "Nowa symulacja"),
      st.zle.length ? h("button", {class: "btn", onclick: () => { learnState = {ids: shuffle(st.zle), pos: 0, ok: 0, odp: null, powt: {}}; go("learn"); }}, "Ćwicz błędy z tego testu") : null));
  const g = h("div", {class: "navgrid"});
  st.ids.forEach((nr, i) => g.append(h("button", {class: st.ans[i] === QBY[nr].correct ? "r" : "w", onclick: () => document.getElementById("eq" + i).scrollIntoView({behavior: "smooth"})}, i + 1)));
  b.append(g);
  st.ids.forEach((nr, i) => {
    const q = QBY[nr], dobrze = st.ans[i] === q.correct;
    const d = h("div", {class: "err", id: "eq" + i},
      h("div", {class: "qhead"}, h("span", {class: "mono"}, (i + 1) + ". nr " + nr), h("span", {class: "tag" + (dobrze ? " ok" : "")}, dobrze ? "dobrze" : st.ans[i] ? "źle" : "bez odpowiedzi")),
      h("div", {class: "qtext"}, q.question), opcje(q, {wybrana: st.ans[i], pokazKlucz: true}));
    if (dobrze) d.append(h("details", {}, h("summary", {}, "Dlaczego?"), wyjasnienie(q))); else d.append(wyjasnienie(q));
    b.append(d);
  });
}

// --- błędy ---
function renderErrors(v) {
  const ids = POOL.filter(doPoprawy).sort((a, b) => (P(b).n - P(b).ok) - (P(a).n - P(a).ok));
  const naprawione = POOL.filter(nr => P(nr).ok < P(nr).n && !doPoprawy(nr)).length;
  v.append(h("div", {class: "block"}, h("h3", {}, "Moje błędy"),
    h("p", {style: "margin:0"}, "Pytania, na które odpowiedziałeś źle i jeszcze nie odpowiedziałeś dobrze " + OPANOWANE + " razy z rzędu. Wracają w każdej serii nauki." + (naprawione ? " Poprawione dotąd: " + naprawione + "." : "")),
    ids.length ? h("div", {class: "row"}, h("button", {class: "btn primary", onclick: () => { learnState = {ids: nowaSeria(true), pos: 0, ok: 0, odp: null, powt: {}}; go("learn"); }}, "Ćwicz same błędy")) : null));
  if (!ids.length) { v.append(h("div", {class: "empty"}, "Brak błędów do poprawy.")); return; }
  const box = h("div", {class: "block"});
  ids.forEach(nr => {
    const q = QBY[nr], p = P(nr);
    const twoje = Object.entries(p.w || {}).sort((a, b) => b[1] - a[1]).map(([k, c]) => (k === "-" ? "bez odpowiedzi" : k) + (c > 1 ? " ×" + c : "")).join(", ");
    box.append(h("div", {class: "err"},
      h("div", {class: "qhead"}, h("span", {class: "mono"}, "nr " + nr), h("span", {}, h("span", {class: "tag"}, "źle " + (p.n - p.ok) + "×"), " ", p.ok ? h("span", {class: "tag ok"}, "dobrze " + p.ok + "×") : null)),
      h("div", {class: "qtext"}, q.question),
      h("div", {}, "Prawidłowa: ", h("strong", {}, q.correct + ". " + q.options[q.correct])),
      twoje ? h("div", {class: "muted"}, "Twoje odpowiedzi: " + twoje) : null,
      h("details", {}, h("summary", {}, "Dlaczego?"), wyjasnienie(q))));
  });
  v.append(box);
}

document.getElementById("poolInfo").textContent = POOL.length + " pytań z bazy egzaminacyjnej";
licznik();
if (examState && !examState.fin) current = "exam";
render();
synchronizuj();
</script>
