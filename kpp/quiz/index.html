const EXPL = {"1":"Wstrząs hipowolemiczny to skutek zmniejszenia objętości krwi krążącej (krwotok, odwodnienie, utrata osocza). Zmiany glikemii (A, B) dotyczą cukrzycy, a krótkotrwała utrata przytomności (C) może być objawem, ale nie przyczyną wstrząsu.","2":"Folię NRC owija się szczelnie wokół poszkodowanego, bo o ochronie przed utratą ciepła decyduje szczelność i brak przewiewów. Strona złota czy srebrna ma znaczenie drugorzędne, dlatego A i B jako wskazania bezwzględne są błędne. Prawdziwe są więc C i D.","3":"Przy braku cech urazu poszkodowanego układa się na plecach i można biernie unieść kończyny dolne na maksymalnie ok. 7 minut. Pozycja boczna (A) i półsiedząca (E) nie poprawiają powrotu żylnego, a wałek pod głową (D) działa odwrotnie. W C zbędnie podano sztywną wartość 30 cm.","4":"Niepokój, tachypnoe, brak tętna na tętnicy promieniowej, CRT >2 s, blada, zimna i spocona skóra to klasyczne objawy wstrząsu z centralizacją krążenia. Przy śmierci klinicznej (B) nie ma oddechu, a udar cieplny i przegrzanie (A, C) dają skórę gorącą.","5":"Prawdziwe są wszystkie trzy stwierdzenia. CRT <2 s przemawia przeciwko centralizacji krążenia, >2 s może wskazywać na wstrząs, a u wychłodzonego wynik jest zawyżany przez zimno i nie jest wiarygodnym wyznacznikiem stanu. Dlatego D (tylko B i C) jest niepełna.","6":"Podczas drgawek chronimy głowę przed urazem (np. podkładamy miękki przedmiot), a po ich ustąpieniu dbamy o drożność dróg oddechowych. Nie wkłada się niczego do ust (B) ani nie przytrzymuje ciała (C). E jest błędne, bo trzeba pomagać, a A samo w sobie nie wyczerpuje postępowania.","7":"Fałszem jest B: nigdy nie wkłada się patyka ani innych przedmiotów między zęby, bo grozi to złamaniem zębów, uszkodzeniem jamy ustnej i zaburzeniem drożności. Pozostałe stwierdzenia (niepamięć wsteczna, popuszczenie moczu, urazy głowy, drgawki uogólnione) są typowymi cechami napadu.","8":"Drgawki mają wiele przyczyn: uraz czaszkowo-mózgowy, zatrucia, niedotlenienie, gorączka (zwłaszcza u dzieci), odwodnienie i udar cieplny. Każda z odpowiedzi A–D jest prawdziwa, więc poprawna jest E.","9":"Śpiączka u diabetyka może wynikać z hipoglikemii (spadek glukozy, np. po przedawkowaniu insuliny), a objawem jest zaburzenie świadomości aż do jej utraty. Prawdziwe są A, B i C, czyli E. Odpowiedź D odwołuje się do samej siebie i jest błędnie sformułowana.","10":"Śpiączkę hiperglikemiczną sugerują zapach acetonu (B), suchość skóry i języka (C) oraz ślady po pomiarach glikemii na opuszkach palców (D). Cukierki w kieszeni (A) wskazują raczej na ryzyko hipoglikemii i nie rozstrzygają o rodzaju śpiączki. Zatem E.","11":"Hipoglikemia to niski poziom glukozy, który może prowadzić do utraty przytomności i daje dezorientację, bełkotliwą mowę, niepokój, pocenie i bladość. Insuliny (D) nie podaje się, bo pogłębiłaby niedocukrzenie; podaje się cukier przytomnemu. Prawdziwe są A, B i C.","12":"Najpierw trzeba sprawdzić, czy leżący żyje: reakcja, oddech, ewentualnie wezwanie pomocy. Zakładanie, że jest pijany (A, B), odejście (D) i szukanie lekarza (E) pomijają ocenę stanu zagrożenia życia, a osoba leżąca bez ruchu może mieć NZK, udar lub hipoglikemię.","13":"Objawy wskazują na zawał: pacjent ma pozostać w spoczynku, zbieramy wywiad, wzywamy ZRM, a przy objawach wstrząsu można rozważyć pozycję przeciwwstrząsową. Aspirynę 160–300 mg podaje się, jeśli jest dostępna, ale nie przy uczuleniu ani w innych przeciwwskazaniach. Błędne jest A, bo wysiłek pogarsza stan.","14":"Osoba nieprzytomna po zasłabnięciu to potencjalny NZK. Udrażniamy drogi oddechowe i oceniamy oddech (maks. 10 s), a przy jego braku rozpoczynamy uciśnięcia klatki piersiowej. Pozycja boczna (A) lub z uniesionymi nogami (B) opóźniają RKO, leki (C) nieprzytomnemu się nie podaje, a sam oddech zastępczy (E) bez uciśnięć jest niewłaściwy.","15":"U dorosłych RKO zaczyna się od 30 uciśnięć, następnie 2 wdechy (30:2). Odwrócona kolejność (A, B) i stosunek 15:2 (A, C) dotyczą innych sytuacji lub są błędne; E jest fałszem.","16":"Typowy zawał to gniotący ból zamostkowy, promieniowanie do lewej kończyny, drętwienie i lęk. Pobudzenie psychoruchowe (D) nie jest charakterystyczne, dlatego poprawna jest E obejmująca A, B i C.","17":"Najczęstszym powikłaniem uciśnięć klatki piersiowej są złamania żeber i mostka, które nie są powodem do przerwania RKO. Urazy kręgosłupa, niedowłady, uszkodzenia naczyń i zaburzenia rytmu (A, B, D, E) nie są typowe.","18":"Poszkodowanego trzeba możliwie osłonić przed toksycznym dymem i jak najszybciej wynieść ze strefy zagrożenia, bo każda minuta w niej pogarsza stan. Podawanie tlenu i ocena na miejscu (A, B, C) w strefie zadymienia narażają ratownika i poszkodowanego, a pozycja boczna z oczekiwaniem (E) jest bierna.","19":"Przy zatruciu środkami ochrony roślin (np. fosforoorganicznymi) usta poszkodowanego i jego wydzieliny są toksyczne dla ratownika, więc nie stosuje się metody usta-usta; używa się worka lub maski. Alkohol, cukrzyca i budowa szyi (A, B, C) nie są przeciwwskazaniem, a E nie opisuje przeciwwskazania.","20":"Przy zatruciu cyjanowodorem i wymiocinach na ustach nie wolno wentylować usta-usta, bo ratownik się zatruje. Trzeba użyć worka samorozprężalnego z maską, tak jak w E. Zaniechanie wentylacji (A) pozostawia poszkodowanego bez pomocy, a maska kieszonkowa i chusteczka (B, D) nie wystarczają.","21":"Głównym zagrożeniem po zatruciu środkami wpływającymi na OUN jest utrata przytomności z zapadnięciem języka i niedrożnością dróg oddechowych prowadząca do niedotlenienia. Sama trucizna (A) jest rzadziej bezpośrednią przyczyną zgonu, a odtrutki (B) nie podają laicy.","22":"Nieprzytomnego, który oddycha, układa się w pozycji bocznej bezpiecznej i wzywa ZRM. Wymiotów nie prowokuje się (B), a węgla aktywowanego nie podaje się osobie nieprzytomnej i ratownik KPP nie podaje leków (A). Zabezpieczenie substancji (C) jest dodatkowe, E pomija opiekę nad drogami oddechowymi.","23":"Według klucza kolejność to: wynieść poszkodowanego ze strefy zagrożenia (3), ocenić czynności życiowe (2), wezwać ZRM i straż (4). Pominięcie punktu 1 wynika z bezpieczeństwa ratownika i szybkiego wyniesienia. Opcje z punktem 5 (A, C) porzucają poszkodowanego, a B i D zaczynają nie od wyniesienia.","24":"Fałszem jest B: tlenek węgla jest bezwonny, bezbarwny i dlatego tak niebezpieczny. Pozostałe stwierdzenia są prawdziwe (powinowactwo do hemoglobiny 250–300 razy większe niż tlenu, czad, powstaje przy niepełnym spalaniu).","25":"Nudności, zawroty głowy i wymioty po kąpieli w łazience z piecykiem gazowym to klasyczne objawy zatrucia tlenkiem węgla, więc trzeba wyprowadzić osobę na świeże powietrze i wezwać pomoc. Wnioski o przegrzaniu, zatruciu pokarmowym czy alkoholu (A, B, D) oraz spacer (E) bagatelizują zagrożenie.","26":"Pulsoksymetr jest metodą nieinwazyjną, mierzy wysycenie krwi tętniczej tlenem przez skórę i jednocześnie podaje tętno. B jest błędne (nie mierzy CO2), C również (nie jest inwazyjny). Poprawne są A i D, czyli E. Uwaga: w zatruciu CO wynik jest zawyżony.","27":"Do wczesnych objawów zatrucia CO należą bóle i zawroty głowy. Drapanie w gardle, swędzenie skóry, skoki temperatury i bóle brzucha (A, C, D, E) nie są typowe dla zatrucia.","28":"Przy podtopieniu: sprawdzamy jamę ustną, udrażniamy drogi i przy braku oddechu wykonujemy 5 oddechów ratowniczych. Wylewanie wody (A) jest błędne, uraz szyi (B) nie jest najczęstszy, a okrycie folią (C) nie jest pierwszą czynnością. Dlatego E odpada, a poprawna jest D.","29":"Postępowanie z osobą podtopioną jest takie samo niezależnie od rodzaju wody: wody nie wylewamy, a rokowanie zależy od czasu niedotlenienia i szybkości RKO, nie od zasolenia. A–D zawierają mity o słonej i słodkiej wodzie.","30":"W wychłodzeniu przeżycie bywa możliwe po kilkudziesięciu minutach RKO, bo zimno chroni mózg, więc nie przerywa się resuscytacji przedwcześnie. Śmierć mózgu nie następuje szybciej (A), a RKO jest skuteczne (B). Głowę odchylamy normalnie (C).","31":"Oddechy ratownicze u tonącego zaczyna się jak najszybciej, jeśli to możliwe jeszcze w wodzie, bo przyczyną NZK jest niedotlenienie. Wylewanie wody, odczekanie 5 minut czy stabilizacja szyi najpierw (A, B, C) tylko opóźniają wentylację.","32":"Reguła dłoni mówi, że powierzchnia dłoni poszkodowanego wraz z palcami to ok. 1% powierzchni ciała. Wartości 0,5%, 1,5%, 2% i 2,5% (A, C, D, E) są błędne.","33":"Oparzenie parą wodną schładzamy wodą co najmniej 10 minut lub do ustania bólu, wzywamy ZRM i chronimy przed utratą ciepła folią NRC. Podawanie leków przeciwbólowych (A) wykracza poza KPP, a mokry opatrunek jałowy samodzielnie (B) nie zastępuje chłodzenia.","34":"Oparzenie ciężkie obejmuje m.in. oparzenia prądem elektrycznym, dróg oddechowych, II° >25% ciała oraz III° >10% ciała. Skoro wszystkie podane kryteria są spełnione, poprawna jest E.","35":"Po odłączeniu napięcia pierwsza jest zwykła ocena stanu poszkodowanego: przytomność i oddech. Dopiero wynik decyduje o dalszych działaniach, więc od razu udrażnianie lub uciśnięcia (A, C) są przedwczesne. D jest błędne, bo po odłączeniu źródła nie ma zagrożenia prądem.","36":"Oparzenie dróg oddechowych i zatrucie wziewne sugerują duszność, kaszel, sadza na twarzy i w ślinie, opalone brwi i rzęsy, chrypka, świszczący oddech oraz okoliczności zdarzenia (pożar w zamkniętym pomieszczeniu). Wszystkie wymienione, czyli E.","37":"Najgroźniejszym wczesnym powikłaniem porażenia prądem zmiennym są zaburzenia rytmu serca, w tym migotanie komór prowadzące do NZK. Uraz szyi, wstrząs hipowolemiczny i niewydolność nerek (B, C, D) są drugorzędne lub późne.","38":"Brak bólu występuje w oparzeniu III°, bo zniszczone są zakończenia nerwowe. W oparzeniach I° i II° (A, B) ból jest silny, więc E odpada. D (chemiczne) nie jest cechą tego typu oparzenia.","39":"Najpierw usuwamy poszkodowanego ze strefy zagrożenia (3), potem strzepujemy lub ścieramy suchy wapno z twarzy (2), a następnie intensywnie płuczemy oczy bieżącą wodą (5). Samo płukanie bez usunięcia substancji (A, D) oraz delikatne przemywanie (B) jest mniej skuteczne.","40":"Kolejność: kontrola czynności życiowych (3), przeniesienie do ciepłego pomieszczenia i zdjęcie mokrego ubrania (1), ułożenie poziomo, ograniczenie ruchu i bierne ogrzewanie (5). Alkohol (2) i rozcieranie lub gimnastyka (4) są szkodliwe, bo rozszerzają naczynia i zwiększają utratę ciepła.","41":"Najpierw odsuwamy poszkodowanego od źródła oparzenia (1), potem schładzamy dłoń bieżącą wodą co najmniej 10 minut lub do ustania bólu (3). Alkohol (5) nie jest skuteczny i szkodzi, trzymanie w wiadrze z wodą (4) nie zapewnia bieżącej wody, a pozycja boczna (2) nie jest wskazana.","42":"Najpierw wyprowadzamy z zagrożenia (2), zdejmujemy zanieczyszczoną odzież (3) i płuczemy dużą ilością bieżącej wody (5), wzywając ZRM. Piasek (4) nie neutralizuje wapna. W praktyce przy suchym wapnie warto też strzepnąć proszek, ale pierwszeństwo ma usunięcie ze strefy.","43":"Priorytetem jest własne bezpieczeństwo: zabezpieczamy miejsce (2), wzywamy 112/998 z numerami z pomarańczowej tablicy (3) i czekamy w bezpiecznej odległości (5). Wchodzenie do kabiny (1) jest zbyt niebezpieczne, a oddalenie się bez wezwania pomocy (4) zostawia ludzi bez ratunku.","44":"Według klucza przytomnemu wolno prowokować wymioty. Ten klucz jest niezgodny z aktualnymi wytycznymi (m.in. ERC i toksykologii), które odradzają prowokowanie wymiotów z powodu ryzyka zachłyśnięcia i braku korzyści. Wskazane jest wezwanie ZRM i zabezpieczenie opakowań (C, D). Na egzaminie zaznacza się odpowiedź z klucza (B).","45":"Osobę nietrzeźwą chronimy przed upadkiem i wychłodzeniem, a przy utracie świadomości układamy w pozycji bezpiecznej. Wymiotów nie prowokujemy (C). Odpowiedź D odwołuje się do samej siebie; intencją klucza są A i B, jedyne prawdziwe stwierdzenia, ale kluczowo pytanie jest wadliwe, a na egzaminie zaznacza się D.","46":"Przy oparzeniu kwasem lub zasadą postępowanie jest takie samo: odzież zdejmujemy, a ciało płuczemy obficie wodą. Zobojętniania (A) nie stosujemy, bo reakcja wytwarza ciepło. Stężenie ani rodzaj substancji (B, C, E) nie zmieniają zasadniczego postępowania w KPP.","47":"Oparzenie I° daje piekący, swędzący rumień i ból przy dotyku, bez pęcherzy (A) i bez utraty czucia (C). Poprawne jest B. Odpowiedź D odwołuje się do samej siebie i nie jest prawidłowa.","48":"Oparzenie II° cechują pęcherze z płynem surowiczym na rumieniu (C) oraz silny ból (D). Martwica i brak czucia (B) to III°, a sam rumień z bólem (A) to I°. Poprawna jest więc E.","49":"Oparzenie III° niszczy wszystkie warstwy skóry (B) i powoduje brak czucia bólu (A). Pęcherze z wyciekiem płynu (C) to II°. Klucz wskazuje D, która formalnie odwołuje się do samej siebie; sensowna interpretacja to A i B, a na egzaminie zaznacza się D.","50":"Hipertermia to podwyższona temperatura ciała (A), a postępowanie polega na ochłodzeniu organizmu (D). Obniżona temperatura (B) to hipotermia, a niezmienna temperatura (C) nie jest stanem chorobowym. Poprawne są A i D, czyli E.","51":"Według klucza prawidłowe są A, C i D, w tym 0,3 mg adrenaliny. Jest to niezgodne z wytycznymi ERC: 5-latkowi podaje się 150 µg (autostrzykawka Jr), a 300 µg dotyczy dzieci od 6–12 lat i dorosłych. Reszta postępowania (C, D, ZRM) jest zgodna. Na egzaminie zaznacza się E.","52":"Hipoksja to niedobór tlenu w tkankach w stosunku do zapotrzebowania, prowadzący do niedotlenienia. A opisuje nadmiar tlenu, B i D dotyczą zmian ciśnienia po zmianie pozycji, czyli innych stanów.","53":"Hipotonia ortostatyczna to spadek ciśnienia wywołany zmianą pozycji ciała (np. nagłe wstanie). B to odwrotność, a C i D opisują hipoksję i nadmiar tlenu.","54":"W oparzeniach elektrycznych największym zagrożeniem są zaburzenia rytmu serca, w tym migotanie komór. Zmiany miejscowe na skórze i blizny (A, C) są mniej groźne dla życia, a wpływ na potencjały mózgowe (D) nie jest klinicznie kluczowy.","55":"Przy oparzeniu dłoni schładzamy wodą min. 10 minut lub do ustania bólu albo hydrożelem (1), zdejmujemy biżuterię z palców i nadgarstków, zanim wystąpi obrzęk (2), i zakrywamy ranę jałowym opatrunkiem (3). Wszystkie trzy są prawdziwe, zatem E.","56":"U nieprzytomnego po upadku z podejrzeniem urazu kręgosłupa najpierw ręcznie stabilizujemy szyję i oceniamy oddech (3), a potem w razie wskazań podajemy tlen (1). Pozycja przeciwwstrząsowa (4) bez cech wstrząsu jest zbędna, a odkażanie rany (2) nie jest priorytetem.","57":"Priorytetem są czynności ratujące życie: udrożnienie dróg oddechowych (B) i zatamowanie krwotoku zagrażającego życiu (D), które wyprzedzają opatrywanie oparzeń czy unieruchamianie złamań (A, C). Dlatego E.","58":"Ranę kłutą klatki piersiowej zostawiamy bez opatrunku lub zaopatrujemy opatrunkiem nieokluzyjnym albo zastawkowym, aby powietrze mogło uchodzić i nie doszło do odmy prężnej. Szczelna folia ze wszystkich stron (B) grozi odmą prężną, a C jest mylące. Prawdziwe są A i D.","59":"Przy krwotoku tętniczym niezatrzymanym opatrunkiem uciskowym: układamy płasko i unosimy kończynę (1), wzmacniamy ucisk dodatkowym bandażem (2), zakładamy opaskę zaciskową 5–7 cm powyżej rany (4) i w razie nieskuteczności drugą (5). Zdejmowanie opatrunku (3) tylko wznawia krwawienie.","60":"Tlen jest podstawowym działaniem w zatruciach wziewnych (2), może szkodzić przy długim stosowaniu (4), a zestaw do tlenoterapii biernej powinien mieć rezerwuar (5). Tlen można podawać też w innej pozycji (1), a ok. 100% wymaga 10–15 l/min, nie 6 l/min (3).","61":"Skóra blada, chłodna i spocona wskazuje na wstrząs, czyli bezpośrednie zagrożenie życia. Złamanie z przemieszczeniem, oparzenie II° podudzia, mała rana dłoni i złamanie otwarte bez krwotoku (A, B, C, E) są poważne, ale nie zagrażają życiu w pierwszej kolejności.","62":"Wyciek płynu mózgowo-rdzeniowego lub krwi z uszu może świadczyć o złamaniu podstawy czaszki (B) i towarzyszyć wstrząsowi (A). Tamponu do ucha nie zakłada się (C), bo hamuje odpływ i zwiększa ryzyko zakażenia. Klucz wskazuje D, która odwołuje się do samej siebie; intencją są A i B.","63":"Krwotok tętniczy zaopatrujemy opatrunkiem uciskowym w miejscu zranienia, a gdy to nie wystarcza lub krwawienie zagraża życiu, opaską zaciskową powyżej rany. Opaska poniżej rany (A) jest błędna, a opatrunek osłaniający (D) nie tamuje krwotoku.","64":"W pierwszej fazie krwotoku serce przyspiesza, oddech jest szybki i płytki, pojawia się pragnienie i uczucie zimna. Zwolniona czynność serca (D) nie wystąpi; bradykardia pojawia się dopiero w późnych, ciężkich fazach.","65":"Opatrunek hydrożelowy zmniejsza ból, nie przywiera do rany i ogranicza ryzyko wychłodzenia wynikające z długotrwałego schładzania wodą. Wszystkie trzy zalety są prawdziwe (E); D jest błędnie sformułowana.","66":"Rana głowy, złamania obu podudzi na tej samej wysokości (zderzak) i wgnieciona maska z rozbitą szybą wskazują na potrącenie pieszego. Wypadnięcie lub zgniecenie (A, B) dałyby inny obraz obrażeń, a D i E są błędne, bo mechanizm można ocenić.","67":"Przy poziomej ranie brzucha najkorzystniejsza jest pozycja leżąca ze zgiętymi kolanami i biodrami, co rozluźnia mięśnie brzucha i zmniejsza ból oraz ryzyko wytrzewienia. Półsiedząca, boczna, na brzuchu i przeciwwstrząsowa (B–E) nie zapewniają takiej ulgi.","68":"Przy wycieku płynu z ucha po urazie głowy zakładamy luźny opatrunek osłaniający, bez ucisku i tamponu, żeby nie zatrzymać odpływu płynu mózgowo-rdzeniowego. Opatrunek uciskowy lub szczelny tampon (C, D) są błędne, a ignorowanie (A) niebezpieczne.","69":"Krwotok tętniczy cechuje intensywny, tętniący wypływ krwi, a żylny wypływa równomiernie. Bolesność (B) nie jest kryterium, a kolor krwi (C) bywa mylący i jest niewiarygodny w ocenie. Dlatego poprawne są A i D (E).","70":"Poszkodowany we wstrząsie w rozbitym aucie z możliwymi dodatkowymi zagrożeniami wymaga pilnej ewakuacji (C) lub, gdy nie jest to możliwe, ułożenia przeciwwstrząsowego w pojeździe (D). Unieruchamianie złamań w pierwszej kolejności (A) lub czekanie na lekarza (B) opóźniają ratunek.","71":"Kolejność zawsze zaczyna się od bezpieczeństwa: zabezpieczenie miejsca, dotarcie do poszkodowanego, dopiero potem pomoc. A, C i D przeskakują od razu do zabiegów, choć sprzęt czy kołnierz nie mają sensu, gdy ratownikowi grozi niebezpieczeństwo lub nie dotarł do rannego.","72":"Kołnierz tylko ogranicza ruchomość odcinka szyjnego, nie usztywnia go całkowicie, więc głowa nadal wymaga stabilizacji ręcznej do czasu przypięcia do deski. B i C są zbyt mocne (kołnierz nie unieruchamia absolutnie), D jest błędne, bo kołnierz stosuje się od początku, a nie tylko na czas ewakuacji.","73":"Wytrzewienia nie odprowadza się do brzucha: zakłada się wilgotny (jałowy, zwilżony solą) opatrunek osłaniający i przykrywa folią, by ograniczyć utratę ciepła. C jest błędne, bo ucisk na narządy brzucha jest przeciwwskazany; A jest błędne, bo poszkodowanemu z urazem brzucha nie podaje się niczego doustnie. D i E mają identyczną, bezsensowną treść.","74":"Ratownik KPP wykonuje RKO, tamuje krwotoki, udrażnia drogi (rurka UG, maska krtaniowa) i dba o komfort cieplny, ale o transporcie do szpitala decyduje ZRM, nie ratownik. Dlatego tylko B nie należy do jego zakresu; A, C, D i E to standardowe czynności KPP.","75":"Pierwsze objawy ostrej utraty krwi to zaburzenia świadomości, przyspieszone tętno i blada skóra. Zaczerwienienie skóry (C) nie występuje w krwotoku, więc prawidłowa byłaby kombinacja A, B i D, a nie A, B i C. Klucz bazy jest niezgodny z wiedzą i materiałem kursu (blada, chłodna skóra); na egzaminie zaznacza się odpowiedź z klucza.","76":"Priorytetem jest zawsze zatamowanie krwotoku tętniczego, bo zagraża życiu szybciej niż złamanie; unieruchomienie przychodzi po nim. B, C i D stawiają ułożenie lub stabilizację odłamów przed kontrolą krwawienia, a E (tlen) nie zatrzymuje utraty krwi. Dziś podstawą jest bezpośredni ucisk, opatrunek uciskowy i opaska.","77":"Poszkodowanego w hipotermii układa się poziomo i obchodzi się z nim delikatnie, bo ruchy i pionizacja grożą spadkiem ciśnienia i migotaniem komór. Pozycja półsiedząca (B) czy przeciwwstrząsowa (C) pogarsza krążenie mózgowe; boczna (D) jest tylko dla nieprzytomnych z drożnymi drogami wymagającymi zabezpieczenia.","78":"Zwichnięty staw unieruchamia się w pozycji zastanej, bez nastawiania i ruchów. B (nastawianie) może uszkodzić naczynia i nerwy, A (ruchy czynne) pogłębia uraz, C (pozycja fizjologiczna) wymagałaby poruszenia stawu, a E (bandaż elastyczny) nie unieruchamia.","79":"Przy braku szyny Kramera uszkodzoną kończynę dolną można przymocować do drugiej, zdrowej, jak podaje materiał kursu. A i C nie zapewniają unieruchomienia; B (kij, deska) też bywa możliwe, ale klucz wskazuje D. Zwykle dokłada się przekładkę, więc E jest staranniejsza, jednak na egzaminie zaznacza się D.","80":"Kończynę górną można unieruchomić każdą z tych metod: szyną Kramera, chustą trójkątną, przybandażowaniem do klatki lub sprzętem przygodnym. Wybór zależy od dostępnego sprzętu i typu urazu, więc pojedyncza odpowiedź A–D jest niepełna.","81":"Wszystkie A–D są fałszywe, więc prawidłowe jest E. Pozycja boczna (A) i siedząca (D) naruszają oś kręgosłupa, miękkie podłoże (B) nie stabilizuje. W C 'zawsze' z kołnierzem jest nadmierne uogólnienie, a ułożenie na twardym podłożu z ręczną stabilizacją jest podstawą.","82":"Uraz kręgosłupa podejrzewa się przy każdym mechanizmie wysokoenergetycznym: wypadku komunikacyjnym ze złamaniem kończyny dolnej lub urazem głowy oraz przy upadku z wysokości. Odpowiedź D odwołuje się do samej siebie, więc poprawna jest zbiorcza E (A, B i C).","83":"Opatrunek uciskowy zakłada się na krwotok zewnętrzny (z kończyny, tułowia, głowy). B jest błędne, bo krwotoku wewnętrznego nie da się zatamować uciskiem; C i D zawężają zastosowanie, a E (jednocześnie z opaską) jest błędne, bo opaskę stosuje się dopiero, gdy ucisk zawodzi.","84":"W szoku hipowolemicznym najpierw tamuje się krwawienie zewnętrzne, a następnie stosuje wszystkie elementy postępowania przeciwwstrząsowego: ułożenie, tlen, wsparcie psychiczne i ochronę przed utratą ciepła. Każde z A–D jest tylko częścią odpowiedzi, więc pełna jest E.","85":"Pytanie jest wadliwe. Pasy (A) zapina się przed przenoszeniem, zasada jednych noszy (D) jest prawidłowa, a tylko C jest fałszywe, bo samego kołnierza do unieruchomienia głowy nie wystarcza (potrzebne klocki i pasy). Klucz E (A, C i D) jest niezgodny z zasadami; na egzaminie zaznacza się odpowiedź z klucza.","86":"Z pojazdu ewakuuje się poszkodowanego, gdy trzeba rozpocząć RKO, gdy ma objawy wstrząsu (wymaga szybkiego transportu) lub gdy grozi zagrożenie zewnętrzne (pożar, wybuch). Samo polecenie dowódcy (A) nie jest kryterium medycznym, dlatego poprawna jest E (B, C i D).","87":"Ewakuacja to przemieszczenie ze strefy zagrożenia z decyzji ratownika, natomiast transport do szpitala następuje z decyzji lekarza lub ratownika medycznego (ZRM). B i C opierają się na sprzęcie lub formacji, a nie na decyzji; D przeczy istnieniu różnicy, więc E (A i D) też odpada.","88":"Grupa czerwona to poszkodowani z najwyższym priorytetem terapeutycznym i transportowym (zagrożenie życia, możliwe do uratowania). Sama A lub C jest niepełna, a E łączy wąskie kryteria; segregacja właśnie wyznacza priorytety, więc D jest błędne.","89":"Zdarzenie masowe to takie, w którym liczba poszkodowanych przekracza siły i środki ratownicze obecne na miejscu, nie całego powiatu czy województwa. B i C mylą skalę, D mówi o planie, a E zawęża do samych ZRM, choć na miejscu mogą być też inne podmioty.","90":"Dysponowanie opiera się na rodzaju zdarzenia (4) i aktualnym czasie przybycia (5), czyli realnym, a nie teoretycznym. Odległość stacjonowania (1), przynależność administracyjna (2) i teoretyczny czas dojazdu (3) są mniej miarodajne, dlatego A, B, D i E odpadają.","91":"Złamanie zamknięte podudzi bez zaburzeń życiowych to grupa żółta, ale po rozwinięciu wstrząsu pacjent przechodzi do czerwonej. Segregację powtarza się, bo stan się zmienia, więc 'cały czas żółta' (E) lub 'cały czas czerwona' (D) są błędne; A i B mają złą kolejność.","92":"Wykonanie dostępu to stworzenie możliwości zbadania i ewakuacji poszkodowanego, a więc coś więcej niż samo dotarcie (A) czy zbadanie (C). D jest błędne, bo wycięcie z pojazdu to tylko jedna z technik, a E dotyczy procedur dochodzeniowych, nie ratowniczych.","93":"Ratownicy KSRG wspomagają ZRM, nie zastępują go, i nie potrzebują nadzoru lekarza ani koordynatora. A, C, D i E zakładają zastępowanie, wyjątkowość lub konieczny nadzór, czego ustawa o PRM nie przewiduje.","94":"KMDR koordynuje KPP i segregację do przybycia ZRM, realizuje KPP w strefach zagrożenia dla ZRM, nadzoruje segregację i przekazuje informacje o dostępie. Transport poszkodowanych (5) nie należy do niego, tym zajmuje się ZRM, dlatego odpadają D i E, a poprawna jest A (1, 2, 3, 4).","95":"Organizacja systemu KSRG obejmuje ujednolicenie zasad dysponowania, postępowania w zdarzeniach masowych, planowania transportu do szpitali i wsparcia psychologicznego ratowników. Transport lżej poszkodowanych do miejsca zamieszkania (C) nie jest zadaniem ratownictwa medycznego.","96":"Ratownikiem może być osoba ze zaświadczeniem o ukończeniu kursu KPP (3) i stanem zdrowia pozwalającym na udzielanie pomocy (4). Dyplom szkoły medycznej (1, 5) nie jest wymagany, a praca w jednostce współpracującej (2) nie jest warunkiem wyłącznym, więc A, B, D i E odpadają.","97":"Ochronę prawną osobie udzielającej pomocy daje ustawa o PRM z 2006 r. (m.in. art. 5, jak dla funkcjonariusza publicznego). Nie wynika ona z prawa zwyczajowego (A), rozporządzenia MSWiA (B) ani kodeksu karnego (D); E jest błędne.","98":"Pozycja boczna musi być stabilna, umożliwiać kontrolę funkcji życiowych, zapewniać wypływ treści i nie uciskać klatki. Zasada 'nie zmienia się raz przyjętego ułożenia' (C) jest błędna, bo stan trzeba stale oceniać, a przy długim czasie zmienia się strona.","99":"U osoby krztuszącej się, która straciła przytomność, po wezwaniu pomocy usuwa się widoczne ciało obce i rozpoczyna RKO od 30 uciśnięć. A, E (uderzenia i uciśnięcia nadbrzusza) dotyczą osób przytomnych; B i C są nieskuteczne lub niebezpieczne.","100":"Osoba po zatruciu lekami, z gasping i dobrze wyczuwalnym tętnem, jest w niewydolności oddechowej: wzywa się ZRM i wspomaga oddech workiem 10/min. Uciski (B, D) są zbędne przy zachowanym krążeniu, a uciśnięcia nadbrzusza (C, E) dotyczą zadławienia, nie zatrucia.","101":"U nieprzytomnego dziecka po urazie wysuwa się żuchwę przy stabilizacji kręgosłupa szyjnego, wyklucza ciało obce i rozważa rurkę UG. Odchylanie głowy (A, B) grozi uszkodzeniem rdzenia, wyciąganie języka (C) i uciśnięcia nadbrzusza (D) nie mają zastosowania.","102":"Najpierw ocenia się przytomność i oddech, a wezwanie pomocy następuje po stwierdzeniu braku prawidłowego oddechu. B ignoruje ocenę poszkodowanego, C zakłada ciało obce bez przesłanek, D opóźnia wezwanie o 5 minut, a E rozpoczyna oddechy bez oceny.","103":"Wody z dróg oddechowych nie usuwa się (A), bo nie ma takiej możliwości i traci się czas; przy tonięciu RKO zaczyna się od 5 oddechów ratowniczych. B, C, D i E są prawdziwe: stabilizacja szyi przy niejasnym mechanizmie, ochrona termiczna, 5 oddechów i wołanie o pomoc.","104":"Pozycja boczna służy udrożnieniu dróg i odpływowi treści, nie kontroli tętna (B), więc to zdanie jest fałszywe. Pozostałe zdania są prawdziwe: chroni przed zachłyśnięciem, utrzymuje drożność, pozwala zostawić poszkodowanego, ale nie gwarantuje przeżycia.","105":"Tlenoterapia bierna nie udrażnia dróg oddechowych, a jedynie dostarcza tlen. Odsysanie (A), uciśnięcia nadbrzusza przy zadławieniu (B), rurka UG (D) i rękoczyn czoło-żuchwa (E) to elementy udrażniania.","106":"Po urazie głowy z utratą przytomności wzywa się ZRM, sprawdza funkcje życiowe i na tej podstawie decyduje o ewakuacji lub pomocy na miejscu. A i D to bierne czekanie, C i E zakładają zatrzymanie krążenia lub oddechu, którego nie stwierdzono.","107":"U nieprzytomnego urazowego z charczącym oddechem najpierw udrażnia się drogi wysunięciem żuchwy (5), stabilizuje szyję (4), zakłada rurkę UG (3), podaje tlen (2), a na końcu chroni przed wychłodzeniem (1). Pozostałe warianty zaczynają od tlenu lub okrycia, zanim drogi są drożne.","108":"U nieprzytomnego po upadku z wysokości z zachowanym oddechem i krążeniem priorytetem jest stabilizacja kręgosłupa i tlen, jeśli wskazany. RKO (A) i oddech zastępczy (B) nie są potrzebne, bo funkcje życiowe są zachowane; D i E odsuwają kluczowe czynności.","109":"U nieprzytomnego priorytetem jest udrożnienie dróg oddechowych, bo niedrożność zabija najszybciej. Opatrywanie oparzeń, unieruchamianie złamań, zaopatrzenie rany otwartej i okrycie kocem (A, C, D, E) są ważne, ale mają niższy priorytet.","110":"Rurkę UG stosuje się u głęboko nieprzytomnych, by zmniejszyć ryzyko zapadnięcia języka. Przytomni (A, E) nie tolerują rurki, a nie chroni ona przed zachłyśnięciem treścią (B); D jest błędne, bo rurka nie zastępuje tlenoterapii.","111":"Pomoc wzywa się niezwłocznie po stwierdzeniu braku prawidłowego oddechu, czyli po ocenie oddechu (A). Czekanie minutę (D) lub do dalszego pogorszenia (E) opóźnia pomoc, a brak wezwania (C) jest błędem niezależnie od umiejętności.","112":"AVPU to skala przytomności: A (alert) przytomny i zorientowany, V reaguje na głos, P na ból, U brak reakcji. A jest zlepkiem z SAMPLE, a C odwraca kolejność; D to wymysł.","113":"Rozmiar rurki UG dobiera się, mierząc odległość od płatka ucha do kącika ust (lub od kąta żuchwy do siekaczy). Brodę, obojczyk czy nos (A, C) nie używa się jako punktów, a rurkę zakłada się tylko u nieprzytomnych, więc D i E są błędne.","114":"Przy trudnościach z wentylacją poprawia się ułożenie maski (1), ponownie udrażnia drogi (2) i sprawdza szczelność układu (4). Czekanie na lekarza (3) i brnięcie bez zmian (5) są błędne, bo opóźniają skuteczną wentylację.","115":"Rezerwuar umożliwia osiągnięcie stężenia tlenu bliskiego 99% przy prawidłowym przepływie i szczelnej masce. A zaniża stężenie, C jest błędne (szczelność nadal wymagana), D przesadza z zapasem, a E nie rozwiązuje problemów z drożnością.","116":"Natychmiastowa RKO i defibrylacja w ciągu 4–5 minut zwiększają szanse przeżycia nagłego zatrzymania krążenia. A i D przeciwstawiają RKO defibrylacji, C jest błędne, bo RKO ma sens zawsze, a E opóźnia RKO do podłączenia AED.","117":"RKO rozpoczyna się, gdy poszkodowany jest nieprzytomny i nie oddycha prawidłowo. Źrenice, tętno na obwodzie, bladość i sinica (A, B, D, E) są niewiarygodne lub opóźniają decyzję.","118":"Przy zatrzymaniu krążenia u dorosłego zaczyna się od 30 uciśnięć i jak najszybszego użycia AED. A i B (oddechy na początku) są dla dzieci, C i D (15 uciśnięć) dotyczą dzieci, a nie dorosłych.","119":"Ręce układa się na środku klatki piersiowej (dolna połowa mostka). B, C, D i E wskazują inne miejsca: górna część mostka, łuk żebrowy lub lewa strona, które są nieprawidłowe.","120":"U dorosłych stosuje się 30 uciśnięć na 2 oddechy. 15:2 (C) dotyczy dzieci i niemowląt dla ratownika KPP, a 50:2, 15:1 i 10:1 nie są stosowane.","121":"Podczas RKO stan poszkodowanego ocenia się tylko wtedy, gdy pojawiają się oznaki życia, aby nie przerywać ucisków. Co minutę, co 5 cykli lub po 15 minutach (A, B, E) niepotrzebnie przerywają RKO, a D (przed elektrodami) opóźnia defibrylację.","122":"Jeśli klatka się nie unosi, sprawdza się udrożnienie i usuwa tylko widoczne ciała obce, nie więcej niż dwie próby oddechów. Wygarnianie 'na ślepo' (B) może wepchnąć ciało obce głębiej, więc jest wyjątkiem.","123":"Przy łagodnej niedrożności (poszkodowany kaszle, mówi) zachęca się do kaszlu i obserwuje. Uderzenia między łopatki i uciśnięcia nadbrzusza (B–E) są dla ciężkiej niedrożności i mogłyby ją pogorszyć.","124":"Worek z maską, rezerwuarem i przepływem 12–16 l/min daje stężenie tlenu 85–100%, a nie 'nie wyższe niż 75%' (C), dlatego to nie jest zaleta. Pozostałe zdania są prawdziwe.","125":"Uciska się klatkę z częstością 100–120/min, niezależnie od liczby ratowników. Poniżej 100 (C) lub 50–60 (D) jest za wolno, a kolor skóry czy wielkość klatki (A, B) nie są kryteriami.","126":"U 5-letniego dziecka uciska się jedną lub dwiema dłońmi na głębokość około 1/3 klatki, 100–120/min. B podaje za małą głębokość, C (dwa palce) jest dla niemowląt, D (15:3) to nieaktualna proporcja, a E zaniża tempo.","127":"Cichy, nieskuteczny kaszel, świst, sinienie i nagłe zadławienie podczas zabawy drobnymi częściami wskazują na całkowitą niedrożność przez ciało obce. Astma, padaczka czy obrzęk strun (A–C) nie pasują do nagłego początku, a częściowa niedrożność (E) pozwala na skuteczny kaszel.","128":"Oddech ocenia się do 10 sekund: patrz, słuchaj, czuj, obserwując klatkę. Lusterko, kartka lub ruchy tchawicy (A–C) są niewiarygodne, a 5 sekund (E) to za krótko.","129":"RKO przerywa się, gdy poszkodowany zacznie prawidłowo oddychać, gdy przejmie go ZRM, przy wyczerpaniu ratownika lub zagrożeniu. Sam upływ czasu, pogoda czy przybycie innych służb (A, C, E) nie są powodem, a przy wychłodzeniu RKO prowadzi się dłużej (D).","130":"Złamanie żeber to częste powikłanie, a RKO kontynuuje się zgodnie z algorytmem, kontrolując ułożenie rąk. Przerwanie (A), omijanie okolicy (E) czy bandażowanie (D) opóźnia lub osłabia uciski.","131":"Przy bólu wieńcowym wzywa się ZRM, ułatwia wygodną pozycję i, jeśli nie ma uczulenia, podaje aspirynę 160–300 mg (C i D razem). Nitroglicerynę (B) ratownik KPP nie podaje; A jest prawdziwe, ale niepełne.","132":"U niemowlęcia uciska się dwoma palcami dolną połowę mostka na około 4 cm z częstością 100–120/min. Jedna dłoń (1) jest dla dziecka, górna część mostka (3) to złe miejsce, a 15 uciśnięć i 3 wdechy (4) to nieaktualna proporcja.","133":"Szybkie badanie urazowe w zdarzeniu pojedynczym nie powinno trwać dłużej niż 2 minuty, aby nie opóźniać transportu. 1 minuta jest za krótka na dokładne badanie, a 5, 10 i 15 minut jest niedopuszczalnie długo.","134":"Przed badaniem wstępnym stabilizuje się ręcznie kręgosłup szyjny, aby nie pogłębić urazu. Unieruchamianie kończyn, tlen, manewr Sellicka (A, C, E) wykonuje się później, a RKO (D) dotyczy braku funkcji życiowych.","135":"Poszkodowanego z urazem obraca się zsynchronizowanie na bok na komendę ratownika trzymającego głowę, aby zachować oś kręgosłupa. Komenda prowadzącego badanie (A), kołnierz (B) i manewr Sellicka (C) nie zastępują tej zasady.","136":"Podchodzi się od strony nóg, by poszkodowany nie obracał głowy w poszukiwaniu ratownika. Zbliżanie się od głowy (B) przy zachowanej świadomości zachęca do ruchu szyi, a strona lewa czy prawa (C, D) nie ma znaczenia.","137":"Oddech ocenia się do 10 sekund. 15, 25, 60 i 90 sekund (B–E) niepotrzebnie opóźniają rozpoznanie zatrzymania krążenia i rozpoczęcie RKO.","138":"Pytanie ma wadliwe opcje (D i E identyczne, D odsyła do siebie). Badanie przerywa się z powodu niedrożności dróg oddechowych, masywnego krwotoku lub NZK, więc A i B są prawdziwe, a C jest błędne. Klucz D jest niespójny; na egzaminie zaznacza się odpowiedź z klucza.","139":"Podczas wstępnego badania urazowego optymalnie są trzej ratownicy: jeden bada, drugi stabilizuje głowę, trzeci pomaga i przygotowuje sprzęt. Dwóch (A) to za mało, a 4–6 (C–E) utrudnia pracę w ciasnym miejscu.","140":"Poszkodowanego z prawidłowym oddechem badamy i wstępnie opatrujemy w pozycji zastanej, aby nie pogłębić urazu kręgosłupa. Natychmiastowe przekręcenie (A, E), sadzanie (D) czy pośpieszny transport bez badania (B) są niebezpieczne.","141":"Badanie wstępne służy wykryciu i natychmiastowemu opanowaniu stanów zagrażających życiu (ABCDE, masywny krwotok). Złamania (A), uszkodzenia skóry (B) czy temperatura (E) są sprawą badania szczegółowego, a przyczyna samopoczucia (C) jest zbyt nieokreślona.","142":"Lider kieruje zespołem i deleguje zadania. Sam wykonuje badanie, a opatrunki i zabiegi zleca wolnemu ratownikowi (B). Klucz D („A i D”) jest wewnętrznie sprzeczny, bo D i E są identyczne i odsyłają do siebie; merytorycznie trafna jest B. Na egzaminie zaznacza się odpowiedź z klucza (D).","143":"Badanie szczegółowe wykonuje się dopiero po badaniu wstępnym i opanowaniu zagrożeń życia (A). Defibrylacja (B), udrożnienie (C) i ułożenia (D, E) to pojedyncze interwencje, a nie warunek rozpoczęcia badania powtórnego.","144":"Badanie urazowe prowadzi się systematycznie od głowy do stóp, kończyny górne na końcu (C), by niczego nie pominąć i nie zaczynać od najbardziej rzucającego się urazu (A). Kolejność ma znaczenie (B), a badanie od pleców (E) wykonuje się dopiero przy przekładaniu na deskę.","145":"Nawrót kapilarny sprawdza się na paznokciu, nie na szyi (C). Na szyi ocenia się rany, wyrostki kolczyste kręgów, wypełnienie żył szyjnych i położenie tchawicy (A, B, D, E).","146":"Kołnierz zakłada się po zakończeniu szybkiego badania urazowego i opatrunków, bo wcześniej utrudniałby badanie szyi (C). Pozostałe czynności (A, B, D) są elementami samego badania, a pozycji bocznej (E) nie stosuje się rutynowo przy podejrzeniu urazu kręgosłupa.","147":"Kołnierz tylko wspomaga unieruchomienie, więc głowa musi być nadal stabilizowana ręcznie, aż do ułożenia na desce z unieruchomieniem (B). Puszczenie głowy (D) lub zmiana pozycji przez poszkodowanego (E) grozi uszkodzeniem rdzenia; rany i nawrót (A, C) bada się wcześniej.","148":"Opór lub ból to przeciwwskazanie do siłowego prostowania: głowę stabilizuje się w pozycji zastanej, na jaką pozwalają ograniczenia (B). Wymuszanie ustawienia w osi (C) może uszkodzić rdzeń; A, D i E to inne elementy badania szyi.","149":"Wyciek płynu z uszu i nosa sugeruje uraz podstawy czaszki: wolno go osłonić luźnym jałowym opatrunkiem, ale nie wolno tamować wypływu. Sączki (C) są więc błędne i zgodnie z wytycznymi E jest niezgodne z nimi. Na egzaminie zaznacza się odpowiedź z klucza (E).","150":"Nawrót kapilarny ocenia się uciskając płytkę paznokcia (lub mostek) przez ok. 5 s i obserwując powrót ukrwienia, norma poniżej 2 s (A). Tętnica promieniowa (C) służy do badania tętna, a żyły szyjne ocenia się wzrokiem.","151":"Klatkę piersiową bada się klasycznie: oglądanie, obmacywanie, opukiwanie, a w badaniu pełnym także osłuchiwanie (E). Odpowiedzi B, C i D są niepełne, a prześwietlenie (A) nie jest badaniem ratownika.","152":"W badaniu brzucha szuka się śladów obrażeń, bolesności i napięcia powłok (B). Naczynia (A, D) i nawrót kapilarny (C) nie dotyczą brzucha, a odma otwarta (E) jest urazem klatki piersiowej.","153":"Plecy ogląda się i obmacuje w momencie przekładania na deskę (przy przetaczaniu en bloc), bo wtedy nie powoduje się dodatkowych ruchów kręgosłupa (B). Pozycja boczna, ułożenie na brzuchu (D) czy badanie po unieruchomieniu (C) są niewłaściwe lub za późne.","154":"Przed naklejeniem elektrod skóra ma być sucha, zdjęta biżuteria z szyi i klatki oraz w razie potrzeby zgolone owłosienie, aby elektrody dobrze przylegały (E obejmuje A, B i C). D jest błędna, bo odsyła do samej siebie.","155":"W strefie defibrylacji nie dotyka się poszkodowanego ani elektrod (A, E), nie może być wody (B), a wentylacja jest wstrzymana (D). Źródło tlenu odsuwa się, by uniknąć zapłonu przy wyładowaniu (C).","156":"U podtopionego po 5 oddechach ratowniczych podłącza się AED i defibryluje natychmiast po analizie rytmu, jeśli są wskazania; nie czeka się na cykle RKO (D). Opcje A i C nieuzasadnienie opóźniają defibrylację, a B pomija analizę rytmu.","157":"Po powrocie krążenia kontroluje się oddech i tętno, wspomaga wentylację w razie potrzeby i zostawia elektrody na klatce, bo rytm może znowu zaburzyć się i AED będzie potrzebny (E = A, B, C). Odklejanie elektrod (D) jest błędem.","158":"Asystolia to brak czynności elektrycznej serca (komór, z przedsionkami lub bez) (A). B to PEA, C migotanie komór, E częstoskurcz komorowy bez tętna, a D opisuje tylko objaw NZK, nie rytm.","159":"Standardowo: jedna elektroda pod prawym obojczykiem przy mostku, druga w linii pachowej przedniej lewej, zgodnie z piktogramem (A). Elektrody nie mogą być w dowolnych miejscach (C) ani stykać się (E), bo prąd omija serce.","160":"Wsparcie psychiczne zaczyna się jak najwcześniej, już na miejscu zdarzenia (D). Odkładanie go do karetki, szpitala czy diagnozy (A, B, C) pozbawia poszkodowanego pomocy w najtrudniejszej chwili, a obecność rodziny (E) nie jest warunkiem.","161":"Dozwolone jest utrzymywanie kontaktu wzrokowego (C). Brak zainteresowania, postawa „ja wiem lepiej”, nadmierny dystans i brak akceptacji (A, B, D, E) są zachowaniami niewłaściwymi.","162":"Wszystkie wymienione zachowania są niedopuszczalne: brak zainteresowania, postawa „ja wiem lepiej”, głośne zwracanie uwagi członkom zespołu i stwarzanie zamieszania (E). Szkodzą zaufaniu poszkodowanego i sprawności zespołu.","163":"W zespole urazowym wsparcie psychiczne prowadzi ratownik stabilizujący głowę, bo jest przy twarzy poszkodowanego i nie wykonuje innych zadań (D). Ratownicy opatrujący lub badający (C, E) są zajęci, a wykształcenie psychologiczne (A) nie jest wymagane.","164":"Poszkodowany oczekuje akceptacji, zainteresowania, kontaktu wzrokowego i umiejętności słuchania (C). Unikanie kontaktu wzrokowego (D), dystans (B), natręctwo (A) i „ja wiem lepiej” (E) pogarszają kontakt.","165":"Ratownik przedstawia się, pyta o przebieg zdarzenia i na bieżąco informuje, co robi i po co (C). Odpowiedzi A, B i D są niepełne, a „ja wiem lepiej” (E) jest zakazane.","166":"Rozpoznanie obejmuje charakter i okoliczności zdarzenia, zagrożenia, orientacyjną liczbę poszkodowanych, ustalenie priorytetów i ewentualne uznanie zdarzenia za masowe (D). Pozostałe warianty pomijają część tych elementów albo mylą rozpoznanie z samą pomocą lub ewakuacją.","167":"Badanie wstępne to ocena miejsca zdarzenia, ocena wstępna oraz szybkie badanie urazowe lub miejscowe (E). Sama kontrola ABC (B) jest niewystarczająca, a rany, kręgosłup i żyły szyjne (A, C, D) to tylko pojedyncze elementy.","168":"Przy stabilizacji bezprzyrządowej nie pociąga się głowy w osi długiej i nie odchyla jej do tyłu (A). Odchylenie (C) grozi uszkodzeniem rdzenia, a zbytnie pociąganie (E) sformułowane jest niedokładnie, bo pociągania nie wolno stosować w ogóle. Tętno (B) i tchawica (D) nie dotyczą stabilizacji.","169":"W trakcie defibrylacji wykonuje się polecenia AED (B). Nie dotyka się poszkodowanego ani nie dociska elektrod (E), a tętna co 2 min nie sprawdza się (A), bo rytm ocenia AED.","170":"Wsparcie zaczyna się jak najwcześniej i trwa w miarę możliwości do uzyskania równowagi psychicznej (D). B pomija początek, a A, C i E błędnie uzależniają je od szpitala, rodziny lub diagnozy.","171":"Typowo: nagły ból uciskający w klatce, duszność, tachykardia, bladość, potliwość i osłabienie (C). A, B i D to pojedyncze objawy; przesunięcie tchawicy (D) świadczy raczej o odmie prężnej, nie o najczęstszych objawach.","172":"But zdejmuje się, gdy krwawi (to wymaga dostępu do rany) i tylko przy ręcznej stabilizacji kończyny w pozycji zbliżonej do fizjologicznej (E = B i C). „Jak najwcześniej” (A) jest zbyt ogólne, a przecinanie (D) nie jest wymagane.","173":"Zapas tlenu = 2,7 l x 150 atm = ok. 405 l; przy 15 l/min to 405/15 = 27 min (B), czyli maksymalnie 27 minut. Dłuższe czasy (C, D, E) wymagałyby większej pojemności.","174":"Rana kłuta brzucha może stanowić bezpośrednie zagrożenie życia (B) i może współistnieć z odmą (A), ale nie zawsze daje krwotok zewnętrzny (C). Klucz D („A i D”) jest wewnętrznie błędny, bo D odsyła do samej siebie; merytorycznie trafne jest A+B. Na egzaminie zaznacza się D.","175":"Przy niedrożności nosa wentylacja workiem z maską chwytem CE z rurką ustno-gardłową utrzymuje drożność przez usta (B). Sama maska (C) bez rurki jest mniej skuteczna u nieprzytomnego, a czekanie na odessanie nosa (D) niepotrzebnie opóźnia wentylację.","176":"Skręcenie stawu skokowego traktuje się jak złamanie: unieruchamia się w pozycji zbliżonej do fizjologicznej (E = A i D). Samo zwichnięcie (B) unieruchamia się w pozycji zastanej (C), co nie dotyczy postępowania ze skręceniem.","177":"Złamanie otwarte to złamanie z przerwaniem ciągłości skóry (A). Kość nie musi przebijać skóry (B), na ranę zakłada się opatrunek jałowy, nie uciskowy (C), a kończynę się unieruchamia, więc D („nie wolno ruszać”) jest zbyt kategoryczne.","178":"Przy niedosłyszeniu mówi się wyraźnie, wspomagając się gestami (D); krzyk (A) nie pomaga. Klucz E (B i C) jest wątpliwy merytorycznie: rezygnacja z głosu (C) nie jest zalecana. Na egzaminie zaznacza się odpowiedź z klucza (E).","179":"Utrata przytomności jest groźna, bo słabną lub znikają odruchy obronne (kaszel, połykanie), co grozi niedrożnością i zachłyśnięciem (B). Nie zawsze oznacza zatrzymanie krążenia (A) ani nieuchronnie do niego prowadzi (C).","180":"Wymioty po wypadku mogą być reakcją psychiczną, objawem niedotlenienia lub obrażeń mózgu (E = A, B, C). D jest błędne, bo nie wolno ich bagatelizować jako przemijających.","181":"Łańcuch przeżycia: wczesne rozpoznanie, wezwanie pomocy, wczesna RKO, wczesna defibrylacja, opieka poresuscytacyjna (B = 5,2,3,1,4). Pozostałe warianty zaburzają kolejność, np. defibrylacja przed RKO i wezwaniem pomocy.","182":"Wątpliwości co do zatrzymania krążenia rozstrzyga się na korzyść poszkodowanego: rozpoczyna się RKO (C). Przedłużanie oceny (A) lub pozycja boczna (D) opóźniają pomoc, a same oddechy bez uciśnięć (B) są nieskuteczne. AED (E) podłącza się po rozpoczęciu RKO.","183":"Przy podejrzeniu urazu szyi stosuje się wysunięcie żuchwy bez odginania głowy (B). Odgięcie głowy (A, C, D) ruszałoby kręgosłup szyjny i grozi uszkodzeniem rdzenia.","184":"Przed zachłyśnięciem treścią płynną chroni odessanie jamy ustnej i pozycja bezpieczna (D = B i C). Rurka ustno-gardłowa (A) nie zabezpiecza dróg oddechowych przed aspiracją.","185":"Maska z rezerwuarem przy przepływie 15 l/min daje ok. 85% tlenu (E). Przy 8 l/min (D) rezerwuar się nie napełnia, a wąsy, worek i maska bez rezerwuaru (A, B, C) dają dużo niższe stężenia.","186":"Gwałtowne ściskanie worka powoduje nadmierne ciśnienie, wdmuchiwanie powietrza do żołądka i ryzyko zachłyśnięcia (E). Oddech ok. 1 s, widoczne unoszenie klatki i 30:2 (A, C, D) są prawidłowe; dwa oddechy w czasie do 5 s (B) także.","187":"Rozpoczęcie ucisku przed całkowitym powrotem klatki do pozycji wyjściowej uniemożliwia napełnienie serca i obniża skuteczność (B). Częstość co najmniej 100/min, minimalizowanie przerw, zmiana ratownika co 2 min i głębokość co najmniej 5 cm (A, C, D, E) są zgodne z wytycznymi.","188":"Ciężka niedrożność: bezgłośny kaszel, niemożność oddychania i postępująca utrata przytomności (B = 1,3,4). Głośny kaszel i swobodne mówienie (2, 5) świadczą o niedrożności łagodnej.","189":"Niedrożność łagodna: dziecko kaszle głośno, nabiera powietrza przed kaszlem i głośno płacze (C = 2,4,5). Bezgłośny kaszel i sinica (1, 3) wskazują na niedrożność ciężką.","190":"Rurka ustno-gardłowa utrzymuje drożność przez odsunięcie języka, ale nie zabezpiecza przed zachłyśnięciem (B jest fałszywe). Pozostałe stwierdzenia są prawdziwe: stosuje się ją z workiem i maską, może powodować wymioty lub niedrożność, są rozmiary dziecięce i dorosłe.","191":"U nieprzytomnego z ciałem obcym zaczyna się natychmiast od 30 uciśnięć, sprawdza usta przed oddechami i prowadzi 30:2 (C = 2,3,5). Palcem usuwa się tylko widoczne ciało (1 jest błędne), a nie czeka się na brak tętna (4).","192":"Uciska się środek klatki piersiowej, czyli dolną połowę mostka (E). Punkty z A i B (linia sutków) i górna połowa mostka (C) leżą zbyt wysoko lub nieprecyzyjnie, a „środek mostka” (D) jest mniej precyzyjne od E.","193":"Bulgotanie świadczy o płynie (krew, wydzielina, treść żołądkowa) w drogach oddechowych (B). Zapadnięty język daje chrapanie (D), kurcz krtani i ciało obce dają świsty lub stridor.","194":"Chrapanie u nieprzytomnego na plecach to typowy objaw opadnięcia języka na tylną ścianę gardła (D). Bulgotanie sugeruje płyn (B), a kurcz i ciało obce dają stridor lub świst.","195":"Świst lub stridor u dziecka kwalifikowany jest tu jako ciało obce lub zapadnięty język (E = A i D). Klasycznie stridor wiąże się z ciałem obcym i kurczem krtani, więc D jest wątpliwe, a język daje raczej chrapanie. Na egzaminie zaznacza się odpowiedź z klucza (E).","196":"U niemowląt tętno bada się na tętnicy ramiennej (C), bo krótka, gruba szyja utrudnia badanie szyjnej (A). Pachowa, pachwinowa i udowa (B, D, E) są niepraktyczne w ocenie wstępnej.","197":"U niemowlęcia przy dwóch ratownikach stosunek uciśnięć do oddechów wynosi 15:2 (D). 30:2 (E) dotyczy jednego ratownika lub osoby dorosłej, a 3:1 i 5:1 (A, B) to dawne schematy.","198":"U 6-latka przy dwóch ratownikach RKO prowadzi się 15:2 (B), tak jak u niemowlęcia. 30:2 (D) dotyczy dorosłych i jednego ratownika, a pozostałe stosunki nie występują w wytycznych.","199":"U dorosłych stosunek wynosi 30 uciśnięć do 2 oddechów (D). Inne warianty (A, B, C, E) nie są zgodne z wytycznymi.","200":"U noworodka tuż po urodzeniu stosuje się 3 uciśnięcia na 1 oddech (A, 3:1), bo przyczyną zatrzymania jest głównie niedotlenienie i wentylacja ma priorytet. 15:2 i 30:2 (C, E) są dla dzieci i dorosłych.","201":"Częstość uciśnięć u dzieci i dorosłych wynosi 100-120/min (B). 80-100 (A) to za mało, a wartości powyżej 120 (C, D, E) są zbyt szybkie i obniżają skuteczność.","202":"U niemowlęcia przy dwóch ratownikach stosuje się technikę dwóch kciuków z objęciem klatki dłońmi (C). Dwa palce (A) są zalecane przy jednym ratowniku, a dłoń (D) dla starszych dzieci.","203":"U niemowlęcia przy dwóch ratownikach uciska się metodą dwóch kciuków z objęciem klatki dłońmi (C), co daje lepszy ucisk i perfuzję. Dwa palce (A) dla jednego ratownika, dłoń (D) dla dzieci powyżej roku.","204":"U niemowląt i dzieci uciska się na głębokość co najmniej 1/3 wymiaru przednio-tylnego klatki (B), ok. 4 cm u niemowląt. Połowa lub 2/3 (C, D) grozi urazem, a 1/4 (A) jest za płytka.","205":"Rozpoznanie NZK u dorosłego opiera się na braku przytomności i braku prawidłowego oddechu (A); oddech agonalny (C) nie jest oddechem prawidłowym. Sprawdzanie tętna (B) nie jest wymagane w ocenie przez świadka; D i E odsyłają do samych siebie.","206":"Przy wymiotach u poszkodowanego z urazem obraca się go na bok z utrzymaniem głowy i szyi w osi ciała (D), co chroni drogi oddechowe i kręgosłup. Odgięcie głowy (B) i samo obrócenie głowy (E) zagrażają szyi, a wygarnianie palcem (C) jest wtórne.","207":"Przy zatrzymaniu oddechu z zachowanym krążeniem prowadzi się wentylację zastępczą z częstością 10 oddechów/min, jeden co 6 s (C). 6 i 8 (A, B) to za mało, a 12 i 20 (D, E) przekraczają zalecenia i grożą hiperwentylacją.","208":"U dziecka, które straciło przytomność przy zadławieniu, wzywa się pomoc, wykonuje 5 oddechów ratowniczych i rozpoczyna RKO (D). Uciśnięcia nadbrzusza lub klatki w izolacji (A, B, C) są niewłaściwe, a ślepe wygarnianie palcem (E) może wepchnąć ciało głębiej.","209":"Dziecko przytomne, które głośno kaszle, ma niedrożność łagodną: zachęca się do kaszlu i obserwuje (A). Uderzenia i uciśnięcia (B, C, D) stosuje się dopiero przy ciężkiej niedrożności, a ślepe wygarnianie (E) jest zabronione.","210":"Przy bezgłośnym kaszlu i braku oddechu stosuje się uderzenia w okolicę międzyłopatkową (A), a gdy nieskuteczne, uciśnięcia nadbrzusza (B). Klucz D („A i D”) jest formalnie błędny, bo odsyła do samej siebie; zaznacza się odpowiedź z klucza.","211":"Nieprzytomne, wiotkie niemowlę z niedrożnością rozpoczyna RKO: udrażniasz drogi oddechowe, wykonujesz 5 oddechów ratowniczych, potem uciśnięcia 15:2. Uderzenia (E) i uciśnięcia (B, C) są dla przytomnego dziecka, a palcem usuwa się tylko widoczne ciało obce (A), nigdy na ślepo.","212":"Skuteczny, głośny kaszel oznacza częściową niedrożność, więc dziecko samo najlepiej usunie ciało obce. Zachęcasz do kaszlu i obserwujesz, oceniając stan. Uderzenia (A), uciśnięcia (B, C) i szukanie palcem (E) mogłyby przesunąć ciało obce i zamienić niedrożność częściową w całkowitą.","213":"Przy nieskutecznym kaszlu u niemowlęcia: ułożenie główką w dół na przedramieniu, 5 uderzeń między łopatki, potem 5 uciśnięć klatki piersiowej (odpowiedzi B i C razem). Uciśnięć nadbrzusza (A) nie wykonuje się u niemowląt z powodu ryzyka uszkodzenia narządów jamy brzusznej.","214":"Gdy osoba dorosła traci przytomność, przestajesz stosować chwyty na drożność i zaczynasz RKO od 30 uciśnięć klatki piersiowej. Sprawdzanie tętna (A) nie jest zalecane laikom, uciśnięcia nadbrzusza (B) dotyczą przytomnych, a oddechy (C) poprzedzają uciśnięcia tylko u dzieci. Wygarnianie na ślepo (E) jest błędem.","215":"Skuteczny kaszel to częściowa niedrożność: zachęcasz do kaszlu i obserwujesz. Uderzenia i uciśnięcia (B, C, E) stosuje się dopiero, gdy kaszel słabnie lub ustaje. Wygarnianie palcem (D) jest błędem, bo można wepchnąć ciało obce głębiej.","216":"Przy nieskutecznym kaszlu przytomnego dorosłego stosuje się 5 uderzeń między łopatki, a jeśli nie pomogły, 5 uciśnięć nadbrzusza, i tak naprzemiennie (E). Same uderzenia (D) lub same uciśnięcia (C) to połowa schematu, a zachęcanie do kaszlu (A) jest za słabe przy bezgłośnym kaszlu.","217":"U kobiety w zaawansowanej ciąży po 5 uderzeniach między łopatki uciska się klatkę piersiową zamiast nadbrzusza, bo powiększona macica uniemożliwia i czyni ryzykownym uciśnięcia nadbrzusza (C, E). Same uderzenia (B) lub kaszel (A) nie wystarczą przy niedrożności całkowitej.","218":"Klucz: przechylenie na lewą stronę w osi długiej ciała (15-30°). Uwaga: ERC 2021 zaleca w pierwszej kolejności ręczne przesunięcie macicy w lewo (A), a pochylenie tylko gdy to niemożliwe, więc klucz nie do końca zgadza się z wytycznymi; na egzaminie zaznacza się odpowiedź z klucza. Strona prawa (B, C) pogarsza ucisk na naczynia.","219":"Złamania żeber zdarzają się często i nie zwalniają z RKO. Sprawdzasz, czy ręce leżą na dolnej połowie mostka, bo zbyt boczny ucisk zwiększa ryzyko urazów, i kontynuujesz. Zmniejszanie głębokości lub częstości (A, B) obniża skuteczność, a przerwanie ucisku (E) zagraża życiu.","220":"Według ERC dziecko to osoba od 1. roku życia do wystąpienia cech pokwitania, a nie do 18 lat (B) ani wg masy ciała (A). Cechy pokwitania decydują o przejściu na algorytm dorosłych. Zakres 1-8 lat (C) jest zmyślony.","221":"Rurkę ustno-gardłową stosuje się tylko u osoby głęboko nieprzytomnej, bez odruchu wymiotnego, bo przy zachowanym odruchu (B) wywoła wymioty i skurcz krtani. Świsty (D), drgawki z szczękościskiem (E) i uraz twarzoczaszki (C) to sytuacje, gdy założenie jest niemożliwe lub groźne.","222":"Kłutą ranę klatki z krwawieniem zabezpiecza się opatrunkiem zastawkowym (wentylowym), który nie pozwala na wciągnięcie powietrza, ale umożliwia jego ujście, oraz opatrunkiem hemostatycznym na krwawienie (A i D). Szczelny opatrunek uciskowy (B) grozi odmą prężną, a brak opatrunku (C) nie chroni rany.","223":"Opatrunek hemostatyczny stosuje się, gdy ucisk bezpośredni nie opanował krwawienia (A), w miejscach, gdzie ucisk jest niemożliwy (B), i do głębokich ran penetrujących (D). Sama kłuta rana klatki (C) nie jest wskazaniem; zależy od krwawienia, więc odpowiedź E zbiera A, B, D.","224":"Odma opłucnowa może być otwarta (rana w ścianie klatki), zamknięta (powietrze z uszkodzonego płuca bez rany zewnętrznej) i prężna (zastawkowa, narastająca, zagrażająca życiu). Wszystkie trzy postacie występują (A, B, C), więc E. Odpowiedź D jest nielogiczna, bo odwołuje się do samej siebie.","225":"Jeden ratownik u dziecka (także niemowlęcia) stosuje 15 uciśnięć i 2 oddechy (D), po wstępnych 5 oddechach ratowniczych. Stosunek 30:2 (E) dotyczy osób dorosłych, a 3:1 (A) noworodków tuż po porodzie. Stosunek 5:1 i 15:1 to dawne lub błędne wartości.","226":"Niemowlę wg ERC to dziecko od pierwszego miesiąca do 1. roku życia (C). Okres od narodzin do miesiąca to noworodek, a od 1. roku do pokwitania to dziecko (D). Granica 18 lat (B) czy masa ciała (A) nie ma zastosowania.","227":"Noworodek to dziecko od narodzin do pierwszego miesiąca życia (D). Zakres A opisuje niemowlę, a C jest błędny. Nie mylić z terminem „świeżorodek”, który oznacza tylko pierwsze godziny po porodzie.","228":"Świeżorodek (ang. newborn) to dziecko w pierwszych godzinach po porodzie, więc E. Okres od narodzin do miesiąca (D) to noworodek (neonate), co kusi, bo nazwy brzmią podobnie. Zakresy A, B, C opisują niemowlę lub dziecko i nie pasują.","229":"Przy defibrylacji ciężarnej elektrody przykleja się standardowo, ale boczną wysoko pod lewą pachą (C), tak by obejmowała serce mimo przesunięcia go przez macicę. Pozycja na prawym boku (A) jest błędna, a elektrody pediatryczne (E) nie są potrzebne. Procedura nie jest identyczna jak u nieciężarnej (D).","230":"U dziecka powyżej 1. roku używa się elektrod pediatrycznych (A) lub trybu pediatrycznego (B), a gdy ich nie ma, wolno użyć AED dla dorosłych (C), bo defibrylacja ratuje życie. Wszystkie trzy są poprawne, więc E. Odpowiedź D jest nielogiczna, a energia „4 kJ/kg” w B to skrót myślowy (4 J/kg).","231":"Udar objawia się bełkotliwą mową, zaburzeniami równowagi, opadnięciem kącika ust i połowiczym niedowładem lub porażeniem. Wszystkie wymienione objawy są typowe (E), więc wybór pojedynczego objawu (A-D) jest niepełny. Pamiętaj o skali FAST i szybkim wezwaniu ZRM.","232":"U dorosłych najczęstszą przyczyną NZK jest choroba serca, czyli niewydolność krążeniowa (B), zwykle migotanie komór po zawale. Uraz głowy i przedawkowanie leków (A, D) są rzadsze, a niewydolność oddechowa (C) to typowa przyczyna NZK u dzieci.","233":"U dzieci NZK zwykle jest wtórne do niewydolności oddechowej (C), dlatego RKO zaczyna się od 5 oddechów. Niewydolność krążeniowa (B) to typowa przyczyna u dorosłych, a uraz głowy i zatrucia (A, D) są rzadsze.","234":"Klucz: 5 oddechów na początek RKO przy uduszeniu i zatruciu tlenkiem węgla (A i D), bo przyczyną jest hipoksja. Uwaga: wg ERC 2021 dotyczy to też utonięcia (B), więc klucz rozmija się z wytycznymi; na egzaminie zaznacza się E. Porażenie prądem (C) to przyczyna sercowa, RKO standardowe.","235":"Ratownik KPP może stosować tylko rurkę ustno-gardłową (A). Rurka nosowo-gardłowa, krtaniowa, maska krtaniowa i intubacja (B, C, D, E) to przyrządy zaawansowane, zarezerwowane dla personelu medycznego (ratownik medyczny, lekarz, pielęgniarka).","236":"Nieprzytomną kobietę w widocznej ciąży, która oddycha, układa się w pozycji bezpiecznej na lewym boku (A), aby macica nie uciskała żyły głównej dolnej. Prawy bok (B) zwiększa ucisk, a pozycja na plecach (C, D, E) z uniesionymi nogami lub bez nie rozwiązuje problemu i grozi niedrożnością.","237":"Krótkie drgawki mogą być objawem NZK, więc po każdym napadzie najpierw sprawdzasz oddech (D). Dopiero gdy oddycha, układasz w pozycji bezpiecznej (B, C). Pozostawienie bez oceny (E) lub ułożenie z uniesionymi nogami (A) zaniedbuje rozpoznanie NZK.","238":"RKO prowadzi się na twardym, płaskim podłożu (E), bo na miękkim łóżku materac pochłania siłę ucisku i uciśnięcia są nieskuteczne. Łóżko (A, B, C) jest dopuszczalne tylko wyjątkowo z deską pod plecami. Uniesienie lewego biodra (D) dotyczy ciężarnych, nie wszystkich.","239":"Przy wstrząsie anafilaktycznym ratownik KPP może podać adrenalinę domięśniowo z autostrzykawki lub ampułkostrzykawki w ramach stanu wyższej konieczności (B), bo to ratuje życie. Samo wezwanie ZRM (A) nie wystarcza. Argumenty z recepty i programu kursu (C, D, E) nie dotyczą tego wyjątku.","240":"Objaw Battle'a to krwiak podskórny za uchem nad wyrostkiem sutkowatym (B), świadczący o złamaniu podstawy czaszki. Krwiak okularowy (A) to objaw szopa. Krwotok z nosa, ból głowy i zaburzenia równowagi (C, D, E) są niespecyficzne.","241":"Wstrząs z dużej utraty krwi lub płynów (biegunka, wymioty, oparzenia) to wstrząs hipowolemiczny (A). Względna hipowolemia (B) to rozszerzenie naczyń przy prawidłowej objętości krwi, np. w anafilaksji. Kardiogenny (D) dotyczy niewydolności serca, mechaniczny (C) przeszkody w krążeniu.","242":"Wg klasyfikacji ATLS krwotok I stopnia to do 15% krwi, II stopnia 15-30% (C), III stopnia 30-40% (D), IV stopnia powyżej 40%. Odpowiedzi A, B dotyczą stopnia I, a D, E stopni wyższych, więc kuszą przy zbyt dużym lub zbyt małym nasileniu.","243":"Płytką, powierzchowną ranę zabezpiecza się zwykłym opatrunkiem osłaniającym (A), czyli jałowym materiałem chroniącym przed zakażeniem. Opatrunek uciskowy i staza taktyczna (B, E) są na krwawienia, które nie ustają, opatrunek zastawkowy (C) na ranę klatki, a unieruchamiający (D) na urazy kości.","244":"Chrypka po pożarze świadczy o oparzeniu dróg oddechowych i narastającym obrzęku (A), który może szybko zamknąć drogi oddechowe, więc trzeba natychmiast wezwać ZRM. Powierzchowne oparzenia skóry (C, D, E) nie dają chrypki, a skurcz oskrzeli (B) objawia się świstami.","245":"U poszkodowanego w hipotermii czynności życiowe są spowolnione, więc oddech ocenia się do 60 sekund (E). Standardowe 10 s (A) jest za krótkie i grozi przeoczeniem słabego oddechu, a pośrednie wartości (B, C, D) nie są zalecane.","246":"W stopniu I szwajcarskiej skali hipotermii (35-32°C) poszkodowany jest przytomny i ma dreszcze (A). Zaburzenia świadomości to stopień II, utrata przytomności III, zatrzymanie krążenia IV, a śmierć V (B-E).","247":"Szybkie badanie urazowe ma wykryć obrażenia zagrażające życiu (C), czyli szybko zbadać głowę, szyję, klatkę, brzuch, miednicę i kończyny. Nie służy do szczegółowego badania (D) ani mierzenia parametrów (E), a także nie szuka tylko jednego urazu (B).","248":"W ITLS badanie wstępne zaczyna się od oceny miejsca zdarzenia (A): bezpieczeństwo, mechanizm urazu, liczba poszkodowanych. Dopiero potem szukasz zagrażających życiu obrażeń (C), robisz badanie ogólne (D) i mierzysz parametry (E).","249":"AED zaleca wyładowanie przy rytmach do defibrylacji: migotaniu komór i częstoskurczu komorowym bez tętna. Klucz wskazuje tylko C, ale D i E też są rytmami defibrylacyjnymi, więc klucz rozmija się z wytycznymi; na egzaminie zaznacza się C. Asystolia (A) nie jest do defibrylacji.","250":"Przy ewentracji (jelita na zewnątrz) nie wpycha się narządów (A), tylko przykrywa je mokrym, jałowym opatrunkiem osłaniającym (C), by nie wyschły. Suchy opatrunek (B) przykleja się do tkanek, ucisk (D) uszkadza jelita, a pozostawienie odsłoniętych (E) grozi wyziębieniem i zakażeniem.","251":"Chwyt Rauteka to szybki chwyt ewakuacyjny z miejsca zdarzenia, gdy poszkodowanemu grozi bezpośrednie niebezpieczeństwo (A). Nie jest pozycją leżącą (B, D), siedzącą (C) ani metodą wyłącznie dla urazów szyi (E), choć stabilizuje szyję i głowę.","252":"Wg ERC 2021 łańcuch przeżycia: 1. wczesne rozpoznanie i wezwanie pomocy, 2. wczesna RKO, 3. wczesna defibrylacja (D), 4. opieka poresuscytacyjna. Odpowiedzi A, B i E to ogniwa pierwsze, drugie i czwarte, a wentylacja workiem (C) nie jest osobnym ogniwem.","253":"Ból, obrzęk, zaczerwienienie i pęcherze z płynem surowiczym to oparzenie II stopnia (B). W I stopniu jest tylko zaczerwienienie, w III stopniu skóra jest martwa i bezbolesna, a stopnie IV i V (D, E) obejmują głębsze struktury.","254":"Figury Lichtenberga, czyli rozgałęzione, paprociowate zaczerwienienia skóry, powstają po porażeniu piorunem (E). Oparzenia wrzątkiem i chemiczne (A-D) dają zupełnie inny obraz uszkodzenia skóry, bez charakterystycznego rysunku.","255":"Rysunek przedstawia rurkę ustno-gardłową (A), czyli zakrzywiony przyrząd z kołnierzem i otworem, jedyny sprzęt do przyrządowego udrożnienia dostępny ratownikowi KPP. Rurki intubacyjna i krtaniowa oraz maski (B-E) wyglądają inaczej (mankiet, balonik, maska twarzowa).","256":"Rysunek przedstawia ręczny ssak (E), czyli pompkę do odsysania wydzielin z górnych dróg oddechowych. Nie jest to rurka ustno-gardłowa, intubacyjna, krtaniowa ani maska krtaniowa (A-D), które służą do udrażniania, a nie do odsysania.","257":"Ratownik KPP może udrożnić drogi rurką ustno-gardłową (A). Intubacja, odbarczenie odmy prężnej, zszywanie ran i podawanie leków w NZK (B-E) to procedury medyczne poza zakresem KPP.","258":"Ratownik KPP może podać adrenalinę z ampułkostrzykawki lub wstrzykiwacza we wstrząsie anafilaktycznym (E). Przyrządowe udrożnianie ogranicza się do rurki ustno-gardłowej, a nie każdej metody (A). Intubacja, odbarczenie i szycie (B, C, D) są poza zakresem.","259":"Fałszywe jest twierdzenie E: maska krtaniowa jest sprzętem zaawansowanym, a ratownik KPP stosuje tylko rurkę ustno-gardłową. Pozostałe są prawdziwe, bo ratownik może szynować, podać tlen, założyć stazę taktyczną i podać adrenalinę domięśniowo we wstrząsie anafilaktycznym (A-D).","260":"Fałszywe jest E: ratownik KPP nie może podać adrenaliny dożylnie, tylko domięśniowo z autostrzykawki. Prawdziwe są A, B, C (leki dożylne, odbarczenie odmy i RKO z lekami są poza zakresem) i D (klin Cardiff jest dozwolony).","261":"Fałszywe jest C: ratownik KPP nie zszywa ran, krwotok opanowuje uciskiem, opatrunkiem hemostatycznym lub stazą. Reszta zgadza się z kursem (mokry opatrunek przy wytrzewieniu, RKO z AED i workiem, aspiryna przy zawale). Odpowiedź B jest sporna (formalnie to zaświadczenie), ale kluczem jest C.","262":"Fałszywe jest E: ratownik KPP nie wykonuje ani nie analizuje EKG (to zadanie personelu medycznego). Pozostałe stwierdzenia są prawdziwe, w tym C, które poprawnie mówi, że ratownik nie może zszyć rany, oraz D, bo aspirynę podaje się przy podejrzeniu zawału.","263":"Serce ma cztery jamy: dwa przedsionki i dwie komory (A). Opcje z dwiema, trzema lub pięcioma jamami (B, D, E) są błędne, a „4 komory” (C) to pomyłka, bo komory są tylko dwie.","264":"Kręgosłup człowieka ma 33-34 kręgi (D): 7 szyjnych, 12 piersiowych, 5 lędźwiowych, 5 zrośniętych krzyżowych i 4-5 guzicznych. Pozostałe zakresy (A, B, C, E) są nieprawdziwe.","265":"Klatkę piersiową tworzy 12 kręgów piersiowych, 12 par żeber i mostek (D). Opcje z 10 kręgami lub 10 parami żeber (A, B, C) są błędne, a brak mostka (E) wyklucza odpowiedź, bo mostek należy do szkieletu klatki.","266":"Bulgotanie świadczy o płynnej lub półpłynnej treści (krew, wymiociny) w górnych drogach oddechowych (C), więc trzeba odessać. Niedrożność na poziomie krtani objawia się stridorem (A, D), niedrożność dolnych dróg świstem (B), a przy drożnych drogach oddech jest cichy (E).","267":"Oceniasz obecność, częstość, głębokość i wysiłek oddechowy (E), bo dopiero komplet cech pokazuje skuteczność oddechu, np. praca dodatkowych mięśni oznacza duszność. Ograniczenie do jednej lub dwóch cech (A-D) pomija część objawów zagrożenia.","268":"Prawidłowy oddech dorosłego to 10-20 na minutę (B). Wartość 10 jako pojedyncza liczba (A) jest zbyt niska, a 20-30 i więcej (C, D, E) to przyspieszenie (tachypnoe).","269":"U niemowląt prawidłowy oddech to 25-50 na minutę (D). Wartości dorosłych (B) są za niskie, a 60/min (E) to już znaczne przyspieszenie, wskazujące na niewydolność oddechową.","270":"Klucz: przy niewydolnym oddechu stosuje się wentylację wspomaganą workiem samorozprężalnym (E), bo bierna tlenoterapia nie zastąpi pracy mięśni oddechowych. Tlen przez maskę z rezerwuarem 10-15 l/min (C) jest dla oddechu wydolnego. Przepływ 25 l/min (D) nie jest stosowany.","271":"Prawidłowe tętno niemowlęcia to 80-180 na minutę (C), zgodnie z materiałem kursu. Zakres 60-160 (B) dotyczy małego dziecka, a 50-120 (A) starszych dzieci.","272":"Prawidłowe tętno małego dziecka to 60-160 na minutę (B). Zakres 80-180 (C) dotyczy niemowląt, a wyższe (D, E) są zbyt szybkie dla tego wieku.","273":"Podczas wyładowania nikt nie dotyka poszkodowanego (C), bo prąd mógłby przejść przez ratownika. Dotykanie (A, E) jest zabronione, przyciski analizy (B) wciska się przed wyładowaniem, a mokra klatka (D) grozi rozpływem prądu i oparzeniami i musi być osuszona.","274":"Wyciek płynu mózgowo-rdzeniowego z uszu lub nosa świadczy o złamaniu podstawy czaszki (C), z uszkodzeniem opon. Złamanie nosa (A) daje krwawienie z nosa, a wstrząśnienie mózgu (D) i wstrząs (E) nie powodują takiego wycieku.","275":"Odwrotny ruch klatki (zapada się przy wdechu, unosi przy wydechu) to wiotka klatka piersiowa (B), czyli złamanie kilku żeber w dwóch miejscach. Pojedyncze złamanie żebra (E) i stłuczenie płuca (D) nie dają paradoksu oddechowego.","276":"Oddech paradoksalny to ruch odłamanego fragmentu klatki przeciwny do ruchu reszty: w głąb przy wdechu, na zewnątrz przy wydechu (A). Odpowiedź B pomija unoszenie przy wydechu, a C, D, E opisują tempo lub rytm, nie paradoks.","277":"O masywnym krwotoku do jamy opłucnej mówi się przy ponad 1,5 litra krwi (E). Mniejsze objętości (A-D) to krwotok umiarkowany, choć 1-1,5 litra (D) jest bliską granicą, więc łatwo ją pomylić.","278":"Przy odmie opłucnowej stosuje się opatrunek wentylowy (zastawkowy) (A), który wypuszcza powietrze z jamy opłucnej, a nie wpuszcza go. Hermetyczny i uciskowy (C, D) grożą odmą prężną, a osłaniający (B, E) nie zapewnia odprowadzania powietrza.","279":"Pionowa rana brzucha nie rozchodzi się przy ułożeniu na plecach, więc najdogodniejsza jest pozycja leżąca na plecach (C), zwykle z ugiętymi kolanami. Pozycje na boku, brzuchu i półsiedząca (A, B, D, E) zwiększają napięcie powłok lub ryzyko wytrzewienia.","280":"Najprostszy jest opatrunek osłaniający (B), czyli jałowy materiał przykrywający ranę. Uciskowy (A) wymaga dodatkowego ucisku, hermetyczny i wentylowy (C, D) dotyczą ran klatki, a opatrunek na wytrzewienie (E) jest specjalistyczny."};
const NOTES = {44: "Tak brzmi klucz bazy egzaminacyjnej. Aktualne zalecenia nie zalecają prowokowania wymiotów; na egzaminie zaznaczasz odpowiedź z klucza."};
const QBY = Object.fromEntries(Q.map(q => [q.nr, q]));
const POOL = Q.filter(q => q.nr !== 255 && q.nr !== 256).map(q => q.nr);   // 255–256 to pytania do rysunku, którego nie ma w bazie
const SERIA = 20, OPANOWANE = 2, EX_N = 30, EX_MIN = 30, PROG = 70, CEL = 80;

// ---------- stan ----------
// stan["q<nr>"] = {n: odpowiedzi, ok: dobre, s: dobre z rzędu, w: {litera: ile razy}, l: ms ostatniej, t: ms zmiany}
// stan["x<ms>"] = egzamin {ok, n, pct, sek, zle: [nr], t}
const API = "https://nieciecz.taile0bd49.ts.net:8443/sync/";
const SERWIS = "kpp_quiz", LS = "nauka_kpp_quiz_stan", LSK = "nauka_sync_klucz", LSX = "nauka_kpp_quiz_egzamin";
const ls = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};
// Klucz synchronizacji podaje się raz w adresie: …/quiz/#sync=<klucz> (potem zostaje w przeglądarce, wspólny z innymi stronami /nauka/).
const mk = location.hash.match(/sync=([\w-]+)/);
if (mk) { ls.set(LSK, mk[1]); history.replaceState(null, "", location.pathname); }
const KLUCZ = ls.get(LSK);
let stan = {}; try { stan = JSON.parse(ls.get(LS) || "{}") || {}; } catch (e) {}

// Jednorazowo przejmij błędy z quizów przy lekcjach kursu (../, ta sama domena).
if (!stan.import_kurs) {
  try {
    const k = JSON.parse(ls.get("kpp-state") || "{}");
    for (const [nr, c] of Object.entries(k.wrong || {})) if (QBY[nr] && !stan["q" + nr]) stan["q" + nr] = {n: c, ok: 0, s: 0, w: {}, l: 0, t: Date.now()};
  } catch (e) {}
  stan.import_kurs = {t: Date.now()};
  ls.set(LS, JSON.stringify(stan));
}

const P = nr => stan["q" + nr] || {n: 0, ok: 0, s: 0, w: {}, l: 0};
const opanowane = nr => P(nr).s >= OPANOWANE;
const doPoprawy = nr => { const p = P(nr); return p.n > 0 && p.ok < p.n && p.s < OPANOWANE; };
const egzaminy = () => Object.entries(stan).filter(([k]) => k[0] === "x").map(([k, v]) => ({...v, k})).sort((a, b) => +a.k.slice(1) - +b.k.slice(1));

function zapisz(nr, litera) {
  const p = {...P(nr)}; p.w = {...(p.w || {})};
  const q = QBY[nr], dobrze = litera === q.correct;
  p.n++; p.l = Date.now(); p.t = Date.now();
  if (dobrze) { p.ok++; p.s++; } else { p.s = 0; const k = litera || "-"; p.w[k] = (p.w[k] || 0) + 1; }
  stan["q" + nr] = p;
  zmiana();
  return dobrze;
}
function zmiana() { ls.set(LS, JSON.stringify(stan)); licznik(); wyslij(); }
function licznik() { document.getElementById("errCount").textContent = POOL.filter(doPoprawy).length; }

// ---------- synchronizacja (jak /nauka/boks/) ----------
function scal(a, b) {
  const o = {...a};
  for (const [k, v] of Object.entries(b || {})) if (!o[k] || (v.t || 0) > (o[k].t || 0)) o[k] = v;
  return o;
}
const info = t => document.getElementById("sync").textContent = t;
const godz = () => new Date().toLocaleTimeString("pl", {hour: "2-digit", minute: "2-digit"});
async function pobierz() {
  const r = await fetch(API + KLUCZ + "/" + SERWIS, {cache: "no-store"});
  if (!r.ok) throw new Error(r.status);
  return (await r.json()).v || {};
}
let trwa = false, znowu = false;
async function wyslij() {
  if (!KLUCZ) return;
  if (trwa) { znowu = true; return; }
  trwa = true;
  try {
    stan = scal(stan, await pobierz());
    const r = await fetch(API + KLUCZ + "/" + SERWIS, {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({v: stan})});
    if (!r.ok) throw new Error(r.status);
    ls.set(LS, JSON.stringify(stan));
    info("zsynchronizowano " + godz());
  } catch (e) { info("offline, zapisano w tej przeglądarce"); }
  trwa = false;
  if (znowu) { znowu = false; wyslij(); }
}
async function synchronizuj() {
  if (!KLUCZ) { info("synchronizacja wyłączona (otwórz stronę z linkiem #sync=…)"); return; }
  try {
    const zdalny = await pobierz();
    const przed = JSON.stringify(stan);
    stan = scal(stan, zdalny);
    ls.set(LS, JSON.stringify(stan));
    if (JSON.stringify(stan) !== przed) { licznik(); if (current === "home" || current === "errors") render(); }
    if (JSON.stringify(scal(zdalny, stan)) !== JSON.stringify(zdalny)) await wyslij();
    else info("zsynchronizowano " + godz());
  } catch (e) { info("offline, zapisano w tej przeglądarce"); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) synchronizuj(); });

// ---------- narzędzia ----------
const h = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, val] of Object.entries(attrs)) { if (val == null) continue; if (k === "class") e.className = val; else if (k.startsWith("on")) e[k] = val; else e.setAttribute(k, val); } kids.flat().forEach(c => c != null && c !== false && e.append(c.nodeType ? c : document.createTextNode(c))); return e; };
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const kolor = pct => pct >= CEL ? "var(--ok)" : pct >= PROG ? "var(--warn)" : "var(--bad)";
function wyjasnienie(q) {
  return h("div", {class: "why"}, h("strong", {}, "Dlaczego " + q.correct + ": "), EXPL[q.nr] || "Wyjaśnienie w przygotowaniu.",
    NOTES[q.nr] ? h("div", {class: "note", style: "margin-top:8px"}, NOTES[q.nr]) : null);
}
function opcje(q, {wybrana, pokazKlucz, onclick}) {
  const os = h("div", {class: "opts"});
  Object.entries(q.options).forEach(([k, txt]) => {
    const b = h("button", {class: "opt", onclick: onclick ? () => onclick(k) : null}, h("b", {}, k), h("span", {}, txt));
    if (pokazKlucz) { b.disabled = true; if (k === q.correct) b.classList.add("right"); else if (k === wybrana) b.classList.add("wrong"); }
    else if (k === wybrana) b.classList.add("sel");
    os.append(b);
  });
  return os;
}

// ---------- widoki ----------
let current = "home";
function go(v) { current = v; render(); window.scrollTo({top: 0}); }
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => go(b.dataset.view));
function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === current));
  const v = document.getElementById("view"); v.innerHTML = "";
  ({home: renderHome, learn: renderLearn, exam: renderExam, errors: renderErrors})[current](v);
}

function renderHome(v) {
  const op = POOL.filter(opanowane).length, zle = POOL.filter(doPoprawy).length;
  const nie = POOL.filter(nr => !P(nr).n).length, rest = POOL.length - op - zle - nie;
  v.append(h("div", {class: "stats"},
    h("div", {class: "stat ok"}, h("span", {class: "n mono"}, op), h("span", {class: "muted"}, "opanowane (2× dobrze z rzędu)")),
    h("div", {class: "stat bad"}, h("span", {class: "n mono"}, zle), h("span", {class: "muted"}, "do poprawy")),
    h("div", {class: "stat warn"}, h("span", {class: "n mono"}, rest), h("span", {class: "muted"}, "raz dobrze")),
    h("div", {class: "stat"}, h("span", {class: "n mono"}, nie), h("span", {class: "muted"}, "jeszcze nie było"))));
  const pc = x => (x / POOL.length * 100) + "%";
  v.append(h("div", {class: "bar", style: "margin:14px 0 22px", title: "opanowane / raz dobrze / do poprawy / nie było"},
    h("i", {style: "width:" + pc(op) + ";background:var(--ok)"}), h("i", {style: "width:" + pc(rest) + ";background:var(--warn)"}), h("i", {style: "width:" + pc(zle) + ";background:var(--bad)"})));
  v.append(h("div", {class: "block"}, h("h3", {}, "Nauka"),
    h("p", {style: "margin:0"}, "Serie po " + SERIA + " pytań. Po każdej odpowiedzi widzisz, czy była dobra, i możesz sprawdzić, dlaczego. Najpierw wracają pytania, na które odpowiedziałeś źle, potem te, których jeszcze nie było, na końcu najdawniej powtarzane. Pytanie przestaje wracać po " + OPANOWANE + " dobrych odpowiedziach z rzędu."),
    h("div", {class: "row"}, h("button", {class: "btn primary", onclick: () => { learnState = null; go("learn"); }}, "Zacznij serię"))));
  v.append(h("div", {class: "block"}, h("h3", {}, "Symulacja egzaminu"),
    h("p", {style: "margin:0"}, EX_N + " pytań losowanych z całej bazy, " + EX_MIN + " minut. Wynik i poprawne odpowiedzi dopiero na końcu. Zaliczenie od " + PROG + "%, cel " + CEL + "%."),
    h("div", {class: "row"}, h("button", {class: "btn primary", onclick: () => go("exam")}, ls.get(LSX) ? "Wróć do trwającej symulacji" : "Rozpocznij symulację"))));
  const ex = egzaminy();
  if (ex.length) {
    const t = h("table", {class: "hist"}, h("tr", {}, h("th", {}, "Data"), h("th", {}, "Wynik"), h("th", {}, "Czas")));
    ex.slice(-10).reverse().forEach(e => t.append(h("tr", {},
      h("td", {}, new Date(+e.k.slice(1)).toLocaleString("pl-PL", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"})),
      h("td", {class: "mono", style: "color:" + kolor(e.pct)}, e.pct + "% (" + e.ok + "/" + e.n + ")"),
      h("td", {class: "mono"}, Math.round(e.sek / 60) + " min"))));
    v.append(h("div", {class: "block"}, h("h3", {}, "Ostatnie symulacje"), t));
  }
  if (!KLUCZ) v.append(h("p", {class: "muted"}, "Synchronizacja między urządzeniami włącza się, gdy raz otworzysz stronę z linkiem zawierającym klucz (#sync=…)."));
}

// --- nauka ---
let learnState = null;
function nowaSeria(tylkoBledy) {
  const zle = shuffle(POOL.filter(doPoprawy)).sort((a, b) => P(a).l - P(b).l);
  if (tylkoBledy) return zle.slice(0, SERIA);
  const nowe = shuffle(POOL.filter(nr => !P(nr).n));
  const stare = shuffle(POOL.filter(nr => P(nr).n && !doPoprawy(nr))).sort((a, b) => (opanowane(a) - opanowane(b)) || (P(a).l - P(b).l));
  // do 12 błędów, reszta nowe, potem najdawniej powtarzane
  const ids = [...zle.slice(0, 12), ...nowe, ...stare, ...zle.slice(12)];
  return shuffle([...new Set(ids)].slice(0, SERIA));
}
function renderLearn(v) {
  if (!learnState) learnState = {ids: nowaSeria(false), pos: 0, ok: 0, odp: null, powt: {}};
  const st = learnState;
  const b = h("div", {class: "block quiz"}); v.append(b);
  if (!st.ids.length) { b.append(h("div", {class: "empty"}, "Brak pytań do powtórki.")); return; }
  if (st.pos >= st.ids.length) {
    const n = st.ids.length - Object.keys(st.powt).length, pct = Math.round(st.ok / n * 100);
    b.append(h("div", {class: "result"}, h("span", {class: "big mono", style: "color:" + kolor(pct)}, pct + "%"),
      h("div", {}, h("strong", {}, st.ok + " z " + n + " dobrze za pierwszym razem"), h("div", {class: "muted"}, "Do poprawy w całej bazie: " + POOL.filter(doPoprawy).length + ". Te pytania wrócą w kolejnych seriach."))),
      h("div", {class: "row"}, h("button", {class: "btn primary", onclick: () => { learnState = null; render(); }}, "Następna seria"),
        h("button", {class: "btn", onclick: () => go("home")}, "Start")));
    return;
  }
  const nr = st.ids[st.pos], q = QBY[nr], p = P(nr), powtorka = st.powt[st.pos];
