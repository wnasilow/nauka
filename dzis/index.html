<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Lista dnia</title>
<style>
:root{--bg:#f3f4f2;--panel:#fff;--ink:#1b1f22;--muted:#5d666c;--line:#d9ddda;--accent:#c4122f;--ok:#1f7a3f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141719;--panel:#1d2124;--ink:#e8eae8;--muted:#9aa3a8;--line:#30363a;--accent:#ff5468;--ok:#4cc77a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141719;--panel:#1d2124;--ink:#e8eae8;--muted:#9aa3a8;--line:#30363a;--accent:#ff5468;--ok:#4cc77a;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:24px 16px 40px}
.w{max-width:560px;margin:0 auto}
h1{margin:0}.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
.top a{color:var(--muted);font-size:.9rem}
.sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
h2{font-size:1rem;margin:22px 0 8px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.it{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.it input{width:24px;height:24px;accent-color:var(--ok);flex:none;margin:0}
.it label{flex:1;cursor:pointer}.it label span{display:block;color:var(--muted);font-size:.85rem}
.it.done label b{text-decoration:line-through;color:var(--muted)}
.go{flex:none;background:var(--accent);color:#fff;text-decoration:none;border-radius:10px;padding:8px 12px;font-weight:600;font-size:.9rem}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 0}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
.hist{display:flex;gap:4px;margin-top:8px}.hist div{flex:1;height:28px;border-radius:5px;background:var(--line);position:relative}
.hist div[data-n="1"]{background:color-mix(in srgb,var(--ok) 35%,var(--line))}.hist div[data-n="2"]{background:color-mix(in srgb,var(--ok) 60%,var(--line))}
.hist div[data-n="3"]{background:color-mix(in srgb,var(--ok) 80%,var(--line))}.hist div[data-n="4"]{background:var(--ok)}
.foot{color:var(--muted);font-size:.85rem;margin-top:20px}
</style></head><body><div class="w">
<div class="top"><h1>Lista dnia</h1><a href="../">← Nauka</a></div>
<p class="sub" id="dzis"></p>
<div class="bar"><i id="pas"></i></div>
<div id="lista"></div>
<h2>Ostatnie 14 dni</h2><div class="hist" id="hist"></div>
<p class="foot" id="sync">Zapis tylko w tej przeglądarce. Synchronizacja: otwórz raz adres z #sync=&lt;klucz&gt;.</p>
</div>
<script>
// Wspólny magazyn postępu na serwerze nieciecz (ten sam co /nauka/boks/). Klucz podaje się raz: …/dzis/#sync=<klucz>,
// zostaje w przeglądarce i działa dla wszystkich stron /nauka/. Bez klucza zapis tylko w localStorage.
let KLUCZ=null;try{const m=location.hash.match(/sync=([\w-]+)/);if(m){localStorage.setItem('nauka_sync_klucz',m[1]);history.replaceState(null,'',location.pathname)}KLUCZ=localStorage.getItem('nauka_sync_klucz')}catch(e){}
const SYNC_URL=KLUCZ?'https://nieciecz.taile0bd49.ts.net:8443/sync/'+KLUCZ+'/dzis':'';
const ZAD=[
 {j:'Języki · angielski',id:'manchester',n:'Fiszki Manchester',o:'Słówka z Quizletu',href:'../manchester/'},
 {j:'Języki · angielski',id:'speak',n:'Speak',o:'Rozmowa z AI',ios:'https://apps.apple.com/pl/app/id1286609883',and:'com.selabs.speak',web:'https://www.speak.com/'},
 {j:'Języki · hiszpański',id:'babbel',n:'Babbel',o:'Lekcja dnia',ios:'https://apps.apple.com/pl/app/id829587759',and:'com.babbel.mobile.android.en',web:'https://my.babbel.com/'},
 {j:'Języki · hiszpański',id:'etutor',n:'eTutor',o:'Powtórki i lekcja',ios:'https://apps.apple.com/pl/app/id1108911192',and:'pl.etutor.mobile',web:'https://www.etutor.pl/'},
 {j:'KPP',id:'kpp',n:'Kurs KPP',o:'Lekcja albo quiz',href:'../kpp/'},
 {j:'Kursy',id:'claude_code',n:'Claude Code in action',o:'Claude Academy, następna lekcja',href:'https://anthropic.skilljar.com/claude-code-in-action'},
 {j:'Algorytmy',id:'neetcode',n:'NeetCode 150',o:'Jedno zadanie',href:'https://neetcode.io/practice/practice/neetcode150'},
 {j:'Boks',id:'boks',n:'Trening boksu',o:'Kolejny film',href:'../boks/'},
 {j:'Ćwiczenia',id:'cwiczenia',n:'Trening',o:'Wybierz z listy, najdawniej robione na górze',href:'../cwiczenia/'}
];
const ua=navigator.userAgent,isA=/Android/i.test(ua),isI=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function link(z){
 if(z.href)return z.href;
 if(isA)return 'intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package='+z.and+';S.browser_fallback_url='+encodeURIComponent('https://play.google.com/store/apps/details?id='+z.and)+';end';
 if(isI)return z.ios; // App Store pokazuje „Otwórz”, gdy aplikacja jest zainstalowana
 return z.web;
}
const dz=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const DZIS=dz(new Date());
// stan: {"YYYY-MM-DD":{"speak":{"v":true,"t":ms}}}; scalanie: nowszy znacznik wygrywa
let S={};try{S=JSON.parse(localStorage.getItem('jez_stan')||'{}')}catch(e){}
function zapiszLok(){try{localStorage.setItem('jez_stan',JSON.stringify(S))}catch(e){}}
function scal(a,b){const r=JSON.parse(JSON.stringify(a||{}));for(const d in b||{}){if(!/^\d{4}-\d\d-\d\d$/.test(d))continue;r[d]=r[d]||{};for(const k in b[d]){const x=b[d][k];if(!r[d][k]||(x&&x.t>r[d][k].t))r[d][k]=x}}return r}
const zrob=(d,k)=>!!(S[d]&&S[d][k]&&S[d][k].v);
function rysuj(){
 document.getElementById('dzis').textContent=new Date().toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});
 let h='',j='',n=0;
 for(const z of ZAD){if(z.j!==j){j=z.j;h+='<h2>'+j+'</h2>'}const c=zrob(DZIS,z.id);if(c)n++;
  h+='<div class="it'+(c?' done':'')+'"><input type="checkbox" id="c_'+z.id+'"'+(c?' checked':'')+' data-k="'+z.id+'"><label for="c_'+z.id+'"><b>'+z.n+'</b><span>'+z.o+'</span></label><a class="go" href="'+link(z)+'"'+(/^https?:/.test(z.href||'')?' target="_blank" rel="noopener"':'')+'>Otwórz</a></div>'}
 document.getElementById('lista').innerHTML=h;
 document.getElementById('pas').style.width=(100*n/ZAD.length)+'%';
 let hs='';for(let i=13;i>=0;i--){const d=dz(Date.now()-i*864e5);const m=ZAD.filter(z=>zrob(d,z.id)).length;hs+='<div data-n="'+m+'" title="'+d+': '+m+'/'+ZAD.length+'"></div>'}
 document.getElementById('hist').innerHTML=hs;
}
document.getElementById('lista').addEventListener('change',e=>{const k=e.target.dataset.k;if(!k)return;S[DZIS]=S[DZIS]||{};S[DZIS][k]={v:e.target.checked,t:Date.now()};zapiszLok();rysuj();wyslij()});
const info=t=>document.getElementById('sync').textContent=t;
async function pobierz(){const r=await fetch(SYNC_URL,{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();return (j&&j.v)||{}}
async function wyslij(){if(!SYNC_URL)return;try{S=scal(S,await pobierz());zapiszLok();rysuj();const r=await fetch(SYNC_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({v:S})});if(!r.ok)throw 0;info('Zsynchronizowano '+new Date().toLocaleTimeString('pl-PL'))}catch(e){info('Brak połączenia z serwerem, zapis w tej przeglądarce.')}}
async function synchro(){if(!SYNC_URL)return;try{const zdal=await pobierz();S=scal(S,zdal);zapiszLok();rysuj();if(JSON.stringify(scal(zdal,S))!==JSON.stringify(zdal))await wyslij();else info('Zsynchronizowano '+new Date().toLocaleTimeString('pl-PL'))}catch(e){info('Brak połączenia z serwerem, zapis w tej przeglądarce.')}}
rysuj();synchro();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(dz(new Date())!==DZIS)location.reload();else synchro()}});
</script></body></html>
