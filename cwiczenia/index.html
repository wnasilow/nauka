<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Ćwiczenia</title>
<meta name="theme-color" content="#c4122f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#f3f4f2; --panel:#fff; --ink:#1b1f22; --muted:#5d666c; --line:#d9ddda;
  --accent:#c4122f; --accent-ink:#fff; --accent-soft:#fbe7ea; --ok:#1f7a3a;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141719; --panel:#1d2124; --ink:#e8eae8; --muted:#9aa3a8; --line:#30363a;
  --accent:#ff5468; --accent-ink:#1a0005; --accent-soft:#3a1a20; --ok:#5fd17f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141719; --panel:#1d2124; --ink:#e8eae8; --muted:#9aa3a8; --line:#30363a;
  --accent:#ff5468; --accent-ink:#1a0005; --accent-soft:#3a1a20; --ok:#5fd17f; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font-body);padding:env(safe-area-inset-top) 16px calc(32px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
.wrap{max-width:680px;margin:0 auto}
h1,h2{font-family:var(--font-display);font-weight:700;line-height:1.1;margin:0}
h1{font-size:2rem}
header{padding:20px 0 6px}
header a{color:var(--muted);font-size:.9rem;text-decoration:none}
.muted{color:var(--muted)} .small{font-size:.88rem}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:10px 0 14px}
.tools label{display:flex;gap:6px;align-items:center;cursor:pointer}
#sync{font-size:.85rem}
details{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary h2{font-size:1.3rem}
summary .cnt{color:var(--muted);font-size:.9rem;white-space:nowrap}
summary .cnt.done{color:var(--ok);font-weight:600}
.fl{display:block;padding:0 16px 8px;font-size:.88rem;color:var(--accent);text-decoration:none}
li a.fd{flex:none;font-size:1.1rem;text-decoration:none;color:var(--muted)}
ul{list-style:none;margin:0;padding:0 8px 8px}
li{display:flex;gap:10px;align-items:center;padding:8px;border-top:1px solid var(--line)}
li input{width:22px;height:22px;flex:none;accent-color:var(--accent);cursor:pointer}
li a{flex:1;color:var(--ink);text-decoration:none;min-width:0;overflow-wrap:anywhere}
li a:hover{color:var(--accent)}
li .sz{color:var(--muted);font-size:.8rem;white-space:nowrap}
li.w a{color:var(--muted)}
body.hide li.w{display:none}
body.hide details.alldone{display:none}
button.lnk{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.tr{padding:10px 12px;border-top:1px solid var(--line)}
.tr .r1{display:flex;gap:10px;align-items:baseline}
.tr .r1 a{flex:1;color:var(--ink);font-weight:600;text-decoration:none;min-width:0;overflow-wrap:anywhere}
.tr .r1 a:hover{color:var(--accent)}
.tr .opis{color:var(--muted);font-size:.9rem;margin:2px 0 6px}
.tr .r2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tr .ost{font-size:.88rem;color:var(--muted)}
.tr .ost.dzis{color:var(--ok);font-weight:600}
button.zr{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:7px 12px;font:600 .9rem var(--font-body);cursor:pointer}
button.zr.on{background:var(--ok);color:#fff}
select{font:inherit;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
<header><a href="../">← Nauka</a><h1>Ćwiczenia</h1><div class="muted small" id="src"></div></header>
<div id="ptxt" class="small"></div>
<div class="tools">
  <label>kolejność <select id="sort"><option value="f">wg folderów</option><option value="o">najdawniej robione</option></select></label>
  <span id="sync" class="muted"></span>
</div>
<p class="muted small">Treningi można powtarzać: „Zrobione” zapisuje datę ostatniego treningu (ponowne kliknięcie ją nadpisuje). Pomyłkę cofa „cofnij”.</p>
<div id="lista">Wczytuję listę…</div>
</div>
<script>
// Stan: {id: {d: ms ostatniego treningu | 0, p: poprzednia data (do cofnięcia), t: ms zmiany}}.
// Scalanie jak w /nauka/boks/: dla każdego treningu wygrywa nowszy znacznik t.
const API = "https://nieciecz.taile0bd49.ts.net:8443/sync/";
const SERWIS = "cwiczenia", LS = "nauka_cwiczenia_stan", LSK = "nauka_sync_klucz", LSS = "nauka_cwiczenia_sort";
const ls = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const m = location.hash.match(/sync=([\w-]+)/);
if (m) { ls.set(LSK, m[1]); history.replaceState(null, "", location.pathname); }
const KLUCZ = ls.get(LSK);

let stan = {}; try { stan = JSON.parse(ls.get(LS) || "{}") || {}; } catch (e) {}
let tr = [];
const $ = s => document.querySelector(s);

function scal(a, b) {
  const o = {...a};
  for (const [k, v] of Object.entries(b || {})) if (!o[k] || (v.t || 0) > (o[k].t || 0)) o[k] = v;
  return o;
}
const ost = id => (stan[id] && stan[id].d) || 0;
const nat = (a, b) => a.localeCompare(b, "pl", {numeric: true, sensitivity: "base"});
const ladna = n => n.replace(/\.[^.]+$/, "").replace(/[_]+/g, " ");
const mb = s => s >= 1e9 ? (s / 1e9).toFixed(1) + " GB" : Math.round(s / 1e6) + " MB";
const dzien = t => { const x = new Date(t); x.setHours(0, 0, 0, 0); return x.getTime(); };
function kiedy(t) {
  if (!t) return "jeszcze nie robiony";
  const dni = Math.round((dzien(Date.now()) - dzien(t)) / 864e5);
  const d = new Date(t).toLocaleDateString("pl", {day: "numeric", month: "short"});
  const g = new Date(t).toLocaleTimeString("pl", {hour: "2-digit", minute: "2-digit"});
  return "ostatnio: " + (dni === 0 ? "dziś" : dni === 1 ? "wczoraj" : dni + " dni temu") + " (" + d + ", " + g + ")";
}

function wiersz(f) {
  const el = document.createElement("div"); el.className = "tr";
  el.innerHTML = `<div class="r1"><a target="_blank" rel="noopener"></a><span class="sz small muted"></span></div><div class="opis"></div><div class="r2"><button class="zr"></button><span class="ost"></span><button class="lnk small cof">cofnij</button></div>`;
  const a = el.querySelector("a"); a.href = f.link; a.textContent = f.tytul || ladna(f.nazwa); a.title = f.nazwa;
  el.querySelector(".sz").textContent = f.rozmiar ? mb(f.rozmiar) : "";
  const op = el.querySelector(".opis"); if (f.opis) op.textContent = f.opis; else op.remove();
  const t = ost(f.id), dz = t && dzien(t) === dzien(Date.now());
  const b = el.querySelector("button.zr"); b.textContent = dz ? "✓ Zrobione dziś" : "Zrobione"; if (dz) b.classList.add("on");
  b.onclick = () => ustaw(f.id, Date.now());
  const o = el.querySelector(".ost"); o.textContent = kiedy(t); if (dz) o.classList.add("dzis");
  const c = el.querySelector(".cof"); if (t) c.onclick = () => ustaw(f.id, (stan[f.id] && stan[f.id].p) || 0, true); else c.remove();
  return el;
}

function rysuj() {
  const box = $("#lista"); box.innerHTML = "";
  const sort = $("#sort").value;
  if (sort === "o") {
    const d = document.createElement("details"); d.open = true;
    d.innerHTML = `<summary><h2>Od najdawniej robionych</h2></summary>`;
    [...tr].sort((a, b) => ost(a.id) - ost(b.id) || nat(a.folder + a.nazwa, b.folder + b.nazwa)).forEach(f => d.appendChild(wiersz(f)));
    box.appendChild(d);
  } else {
    const otwarte = new Set([...document.querySelectorAll("details[open]")].map(d => d.dataset.f));
    const pierwszyRaz = !document.querySelector("details[data-f]");
    const grupy = new Map();
    for (const f of tr) { if (!grupy.has(f.folder)) grupy.set(f.folder, []); grupy.get(f.folder).push(f); }
    for (const folder of [...grupy.keys()].sort(nat)) {
      const lista = grupy.get(folder).sort((a, b) => nat(a.nazwa, b.nazwa));
      const d = document.createElement("details"); d.dataset.f = folder;
      const n = lista.filter(f => ost(f.id)).length;
      d.innerHTML = `<summary><h2></h2><span class="cnt">${n}/${lista.length} robione</span></summary>`;
      d.querySelector("h2").textContent = folder.replace(/^\d+\s+/, "");
      if (lista[0].link_folderu) {
        const fl = document.createElement("a"); fl.className = "fl"; fl.href = lista[0].link_folderu; fl.target = "_blank"; fl.rel = "noopener";
        fl.textContent = "Otwórz folder w MEGA"; d.appendChild(fl);
      }
      lista.forEach(f => d.appendChild(wiersz(f)));
      box.appendChild(d);
      if (otwarte.has(folder) || (pierwszyRaz && grupy.size <= 3)) d.open = true;
    }
  }
  const dzis = tr.filter(f => ost(f.id) && dzien(ost(f.id)) === dzien(Date.now())).length;
  const ostatni = Math.max(0, ...tr.map(f => ost(f.id)));
  $("#ptxt").textContent = (dzis ? `Dziś zrobione: ${dzis}. ` : "") + (ostatni ? "Ostatni trening " + kiedy(ostatni).replace("ostatnio: ", "") + "." : "Jeszcze żadnego treningu.");
}

function ustaw(id, d, cofnij) {
  const st = stan[id] || {};
  stan[id] = {d, p: cofnij ? 0 : (st.d || 0), t: Date.now()};
  ls.set(LS, JSON.stringify(stan));
  rysuj();
  wyslij();
}
function info(t) { $("#sync").textContent = t; }

async function pobierz() {
  const r = await fetch(API + KLUCZ + "/" + SERWIS, {cache: "no-store"});
  if (!r.ok) throw new Error(r.status);
  return (await r.json()).v || {};
}
let trwa = false, znowu = false;
async function wyslij() {
  if (!KLUCZ) return;
  if (trwa) { znowu = true; return; }
  trwa = true;
  try {
    stan = scal(stan, await pobierz());
    const r = await fetch(API + KLUCZ + "/" + SERWIS, {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({v: stan})});
    if (!r.ok) throw new Error(r.status);
    ls.set(LS, JSON.stringify(stan));
    info("zsynchronizowano " + new Date().toLocaleTimeString("pl", {hour: "2-digit", minute: "2-digit"}));
  } catch (e) {
    info("offline, zapisano w tej przeglądarce");
  }
  trwa = false;
  if (znowu) { znowu = false; wyslij(); }
}
async function synchronizuj() {
  if (!KLUCZ) { info("synchronizacja wyłączona (otwórz stronę z linkiem #sync=…)"); return; }
  try {
    const zdalny = await pobierz();
    const przed = JSON.stringify(stan);
    stan = scal(stan, zdalny);
    ls.set(LS, JSON.stringify(stan));
    if (JSON.stringify(stan) !== przed) rysuj();
    // lokalne zmiany, których serwer nie ma, odsyłamy
    if (JSON.stringify(scal(zdalny, stan)) !== JSON.stringify(zdalny)) await wyslij();
    else info("zsynchronizowano " + new Date().toLocaleTimeString("pl", {hour: "2-digit", minute: "2-digit"}));
  } catch (e) { info("offline, zapisano w tej przeglądarce"); }
}

$("#sort").value = ls.get(LSS) === "o" ? "o" : "f";
$("#sort").onchange = e => { ls.set(LSS, e.target.value); rysuj(); };
document.addEventListener("visibilitychange", () => { if (!document.hidden) { rysuj(); synchronizuj(); } });

fetch("treningi.json", {cache: "no-cache"}).then(r => r.json()).then(d => {
  tr = d.filmy;
  $("#src").textContent = "Folder MEGA „! ED” · " + tr.length + " treningów · " + mb(tr.reduce((s, f) => s + f.rozmiar, 0));
  rysuj();
  synchronizuj();
}).catch(() => { $("#lista").textContent = "Nie udało się wczytać listy treningów."; });
</script>
</body>
</html>
